# ================= SETTINGS =================
disk_cap   = 100G     # your virtual disk MAX size (grow-only). Empty space is free.
chunk_size = 4M       # slice size. Don't change.
sync_every = 2s       # mirror interval. Lower = safer, chattier. 0 = off.
dash_port  = 9999     # dashboard port (used by file #3 later).

# ================= ACCOUNTS (order = disk order) =================
# FIRST line = your DEFAULT Drime. It holds base.vmdk + the manifest.
# The account NAME is exactly the GitHub Secret name holding its API key.
# Add a line + add the matching Secret = more space. Nothing moves.
DRIME    20G        # default account (base.vmdk lives here)   -> Secret: DRIME
# DRIME1   20G      # extra #1  (uncomment + add Secret DRIME1)
# DRIME2   20G      # extra #2  (uncomment + add Secret DRIME2)