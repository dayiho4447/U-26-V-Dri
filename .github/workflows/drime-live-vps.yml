name: Drime Live VM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 rclone curl qemu-utils qemu-system-x86 nbdkit nbdkit-plugin-python wget ca-certificates jq xvfb x11vnc net-tools ovmf

    - name: Install latest rclone
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Install NetBird on runner
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key CE303734-75C3-44DC-8E35-B533A858A900
        sudo netbird status

    - name: Create drime_store.py
      run: |
        cat > drime_store.py <<'PYEOF'
        #!/usr/bin/env python3
        import os, re, json, time, uuid, gzip, sqlite3, hashlib, threading, subprocess, shutil
        from pathlib import Path

        class OutOfCapacity(Exception): pass

        def parse_size(v):
            if isinstance(v, int): return int(v)
            s = str(v).strip().upper()
            m = re.match(r'^([0-9]*\.?[0-9]+)([KMGTP]?I?B?)$', s)
            if not m: raise ValueError("bad size: %s" % v)
            num = float(m.group(1)); unit = m.group(2); mult = 1
            if unit.startswith("K"): mult = 1024
            elif unit.startswith("M"): mult = 1024**2
            elif unit.startswith("G"): mult = 1024**3
            elif unit.startswith("T"): mult = 1024**4
            elif unit.startswith("P"): mult = 1024**5
            return int(num*mult)

        def parse_time(v):
            if isinstance(v, int): return int(v)
            s = str(v).strip().lower()
            if s in ("0", "off", "disabled"): return 0
            m = re.match(r'^([0-9]*\.?[0-9]+)([smh]?)$', s)
            if not m: raise ValueError("bad time: %s" % v)
            num = float(m.group(1)); unit = m.group(2)
            mult = 1
            if unit == "s": mult = 1
            elif unit == "m": mult = 60
            elif unit == "h": mult = 3600
            return int(num * mult)

        def run_rclone(args, check=True, extra=None):
            cmd = ["rclone"] + args + (extra or [])
            p = subprocess.run(cmd, text=True, capture_output=True)
            if check and p.returncode != 0:
                raise subprocess.CalledProcessError(p.returncode, cmd, output=p.stdout, stderr=p.stderr)
            return p

        class DrimeStore:
            def __init__(self, conf_path, accounts_path, cache="/var/lib/drimelive"):
                self.cache = Path(cache); self.cache.mkdir(parents=True, exist_ok=True)
                self.chunks_dir = self.cache/"chunks"; self.tmp_dir = self.cache/"tmp"
                self.chunks_dir.mkdir(parents=True, exist_ok=True); self.tmp_dir.mkdir(parents=True, exist_ok=True)
                self.db_path = self.cache/"meta.db"
                st = self._parse_conf(conf_path)
                self.size = parse_size(st.get("disk_cap", "100G"))
                self.chunk_size = parse_size(st.get("chunk_size", "4M"))
                se = st.get("sync_every", "2s")
                self.sync_every = parse_time(se)
                self.accounts = []; total = 0
                for line in open(accounts_path):
                    line = line.strip()
                    if not line or line.startswith("#"): continue
                    parts = line.split(); name, sz = parts[0], parse_size(parts[1])
                    start = total // self.chunk_size; total += sz; end = total // self.chunk_size
                    self.accounts.append({"name": name, "start": start, "end": end})
                self.capacity_chunks = total // self.chunk_size
                self.lock = threading.RLock(); self.remote_ids = set()
                self.db = sqlite3.connect(str(self.db_path), check_same_thread=False)
                self.db.execute("PRAGMA journal_mode=WAL"); self.db.execute("PRAGMA synchronous=NORMAL"); self.db.execute("PRAGMA busy_timeout=10000")
                self.db.execute("CREATE TABLE IF NOT EXISTS meta (k TEXT PRIMARY KEY, v TEXT)")
                self.db.execute("CREATE TABLE IF NOT EXISTS chunks (id INTEGER PRIMARY KEY, sha256 TEXT, uploaded INTEGER DEFAULT 0, dirty INTEGER DEFAULT 0, gen INTEGER DEFAULT 0, updated REAL, zero INTEGER DEFAULT 0)")
                self.db.commit()
                self.dirty = set(r[0] for r in self.db.execute("SELECT id FROM chunks WHERE dirty = 1 OR uploaded = 0"))

            def _parse_conf(self, path):
                out = {}
                for line in open(path):
                    line = line.split("#",1)[0].strip()
                    if "=" in line:
                        k,v = line.split("=",1); out[k.strip()] = v.strip()
                return out

            def account_for(self, cid):
                for a in self.accounts:
                    if a["start"] <= cid < a["end"]: return a["name"]
                raise OutOfCapacity("chunk %d beyond Drime capacity.")

            def chunk_len(self, cid):
                start = cid*self.chunk_size
                return min(self.chunk_size, self.size-start)

            def chunk_path(self, cid): return self.chunks_dir / ("%08d.part" % cid)

            def _atomic_write(self, path, data):
                tmp = self.tmp_dir / ("%s.%s" % (path.name, uuid.uuid4().hex))
                with open(tmp,"wb") as f: f.write(data); f.flush(); os.fsync(f.fileno())
                os.replace(tmp, path)

            def prewarm_boot_chunks(self, count=64):
                print(f"[PREWARM] Downloading first {count} chunks for fast boot...", flush=True)
                for cid in range(count):
                    try:
                        self.read_chunk(cid)
                    except Exception:
                        pass
                print(f"[PREWARM] Done. Boot sectors cached locally.", flush=True)

            def ingest_from_file(self, path):
                chunk_size = self.chunk_size
                zero_chunk = b"\x00" * chunk_size
                file_size = os.path.getsize(path)
                print(f"[FAST INGEST] Processing {path} ({file_size} bytes)...", flush=True)
                with open(path, "rb") as f:
                    cid = 0
                    while True:
                        data = f.read(chunk_size)
                        if not data: break
                        if len(data) < chunk_size: data = data + b"\x00" * (chunk_size - len(data))
                        if data == zero_chunk:
                            cid += 1; continue
                        self._atomic_write(self.chunk_path(cid), data)
                        sha = hashlib.sha256(data).hexdigest()
                        self.db.execute("INSERT INTO chunks(id,sha256,uploaded,dirty,gen,updated,zero) VALUES(?,?,0,1,0,?,0) ON CONFLICT(id) DO UPDATE SET sha256=excluded.sha256,uploaded=0,dirty=1,gen=gen+1,updated=excluded.updated,zero=0", (cid, sha, time.time()))
                        self.dirty.add(cid); cid += 1
                        if cid % 100 == 0: print(f"  processed {cid} chunks...", flush=True)
                self.db.commit()
                print(f"[FAST INGEST] Found {len(self.dirty)} non-zero chunks. Flushing...", flush=True)
                self.flush()

            def load_remote_manifest(self):
                self.remote_ids = set()
                if not self.accounts: return
                tmp = self.tmp_dir / ("manifest_%s.gz" % uuid.uuid4().hex)
                try:
                    run_rclone(["copyto", self.accounts[0]["name"] + ":liveblock/manifest.json.gz", str(tmp)], extra=["--retries","1","--low-level-retries","1"])
                    with gzip.open(tmp,"rt") as f: m = json.load(f)
                    for c in m.get("chunks", []):
                        rid = int(c["id"]); self.remote_ids.add(rid)
                        self.db.execute("INSERT INTO chunks(id,sha256,uploaded,dirty,gen,updated,zero) VALUES(?,?,1,0,?,?,0) ON CONFLICT(id) DO NOTHING", (rid, c.get("sha256",""), int(c.get("gen",0)), float(c.get("updated",0))))
                    self.db.commit()
                except Exception: pass
                finally:
                    try: tmp.unlink()
                    except Exception: pass

            def upload_manifest(self):
                cur = self.db.execute("SELECT id,sha256,gen,updated FROM chunks WHERE uploaded=1 AND zero=0 ORDER BY id")
                chunks = [{"id":int(r[0]),"sha256":r[1],"gen":int(r[2]),"updated":float(r[3]) if r[3] else 0.0} for r in cur.fetchall()]
                m = {"version":3,"size":self.size,"chunk_size":self.chunk_size,"accounts":[a["name"] for a in self.accounts],"generated":time.time(),"chunks":chunks}
                tmp = self.tmp_dir / ("manifest_%s.gz" % uuid.uuid4().hex)
                with gzip.open(tmp,"wt") as f: json.dump(m,f)
                run_rclone(["copyto", str(tmp), self.accounts[0]["name"] + ":liveblock/manifest.json.gz"], extra=["--retries","2","--low-level-retries","2"])
                try: tmp.unlink()
                except Exception: pass

            def read_chunk(self, cid):
                with self.lock:
                    p = self.chunk_path(cid)
                    if p.exists(): return p.read_bytes()
                    if cid not in self.remote_ids: return b"\x00"*self.chunk_len(cid)
                    remote = self.account_for(cid)
                    tmp = self.tmp_dir / ("%08d_%s.gz" % (cid, uuid.uuid4().hex))
                    try:
                        run_rclone(["copyto", "%s:liveblock/chunks/%08d.gz" % (remote,cid), str(tmp)], extra=["--retries","1","--low-level-retries","1"])
                        with gzip.open(tmp,"rb") as f: data = f.read()
                        exp = self.chunk_len(cid)
                        if len(data) < exp: data += b"\x00"*(exp-len(data))
                        self._atomic_write(p, data); return data
                    except subprocess.CalledProcessError as e:
                        err = (e.stderr or "").lower()
                        if any(s in err for s in ["not found","object not found","doesn't exist","file not found","no such"]):
                            self.remote_ids.discard(cid); return b"\x00"*self.chunk_len(cid)
                        raise
                    finally:
                        try: tmp.unlink()
                        except Exception: pass

            def write_chunk(self, cid, data, off):
                with self.lock:
                    p = self.chunk_path(cid)
                    chunk = bytearray(p.read_bytes()) if p.exists() else bytearray(self.read_chunk(cid))
                    exp = self.chunk_len(cid)
                    if len(chunk) < exp: chunk.extend(b"\x00"*(exp-len(chunk)))
                    chunk[off:off+len(data)] = data
                    final = bytes(chunk); self._atomic_write(p, final)
                    sha = hashlib.sha256(final).hexdigest()
                    self.db.execute("INSERT INTO chunks(id,sha256,uploaded,dirty,gen,updated,zero) VALUES(?,?,0,1,0,?,0) ON CONFLICT(id) DO UPDATE SET sha256=excluded.sha256,uploaded=0,dirty=1,gen=gen+1,updated=excluded.updated,zero=0", (cid,sha,time.time()))
                    self.db.commit(); self.dirty.add(cid)

            def flush(self):
                with self.lock:
                    rows = self.db.execute("SELECT id,gen FROM chunks WHERE dirty=1").fetchall()
                    if not rows: return
                    by = {}
                    for cid,gen in rows:
                        try: remote = self.account_for(cid)
                        except OutOfCapacity: continue
                        by.setdefault(remote, []).append((cid,gen))
                    for remote, items in by.items():
                        stage = self.tmp_dir / ("stage_%s" % uuid.uuid4().hex); stage.mkdir(parents=True, exist_ok=True)
                        plan = []
                        try:
                            for cid,gen in items:
                                p = self.chunk_path(cid)
                                if not p.exists(): continue
                                data = p.read_bytes(); exp = self.chunk_len(cid)
                                if len(data) < exp: data += b"\x00"*(exp-len(data))
                                sha = hashlib.sha256(data).hexdigest()
                                is_zero = (data == b"\x00"*exp); rp = cid in self.remote_ids
                                if is_zero and rp: plan.append({"id":cid,"gen":gen,"sha":sha,"kind":"delete"}); continue
                                if is_zero and not rp: plan.append({"id":cid,"gen":gen,"sha":sha,"kind":"skip"}); continue
                                with gzip.open(stage/("%08d.gz"%cid),"wb") as f: f.write(data)
                                plan.append({"id":cid,"gen":gen,"sha":sha,"kind":"upload"})
                            if any(x["kind"]=="upload" for x in plan):
                                run_rclone(["copy", str(stage), remote+":liveblock/chunks/", "--transfers","8","--no-update-modtime","--stats","5s"], extra=["--retries","2","--low-level-retries","2"])
                            now = time.time()
                            for x in plan:
                                self.db.execute("UPDATE chunks SET uploaded=1,dirty=0,sha256=?,updated=?,zero=? WHERE id=? AND gen=?", (x["sha"],now,1 if x["kind"]=="skip" else 0,x["id"],x["gen"]))
                                if x["kind"]=="upload": self.remote_ids.add(x["id"])
                                elif x["kind"]=="delete":
                                    self.remote_ids.discard(x["id"])
                                    try: run_rclone(["deletefile", "%s:liveblock/chunks/%08d.gz" % (remote,x["id"])], check=False)
                                    except Exception: pass
                            self.db.commit()
                        finally:
                            shutil.rmtree(stage, ignore_errors=True)
                    self.upload_manifest()
                    self.dirty = set(r[0] for r in self.db.execute("SELECT id FROM chunks WHERE dirty=1 OR uploaded=0"))

            def read(self, offset, length):
                out = bytearray(length); pos = 0
                while pos < length:
                    off = offset+pos; cid = off//self.chunk_size; coff = off%self.chunk_size
                    n = min(self.chunk_size-coff, length-pos)
                    chunk = self.read_chunk(cid); out[pos:pos+n] = chunk[coff:coff+n]; pos += n
                return bytes(out)

            def write(self, data, offset):
                pos = 0; total = len(data)
                while pos < total:
                    off = offset+pos; cid = off//self.chunk_size; coff = off%self.chunk_size
                    n = min(self.chunk_size-coff, total-pos)
                    self.write_chunk(cid, data[pos:pos+n], coff); pos += n

            def trim(self, offset, length):
                self.write(b"\x00"*length, offset)
        PYEOF

    - name: Create drime_nbd.py
      run: |
        cat > drime_nbd.py <<'PYEOF'
        #!/usr/bin/env python3
        import os, sys
        sys.path.insert(0, os.getcwd())
        import nbdkit
        from drime_store import DrimeStore
        API_VERSION = 2
        CFG = {}; STORE = None
        def thread_model(): return nbdkit.THREAD_MODEL_PARALLEL
        def config(key, value): CFG[key] = value
        def config_complete():
            global STORE
            STORE = DrimeStore(conf_path=CFG["conf"], accounts_path=CFG["accounts"], cache=CFG.get("cache","/var/lib/drimelive"))
            STORE.load_remote_manifest()
            STORE.prewarm_boot_chunks(64)
        def open(readonly): return STORE
        def close(h):
            try: h.flush()
            except Exception: pass
        def get_size(h): return h.size
        def can_write(h): return True
        def can_flush(h): return True
        def can_trim(h): return True
        def pread(h, buf, offset, flags):
            data = h.read(offset, len(buf)); buf[:len(data)] = data; return buf
        def pwrite(h, buf, offset, flags):
            h.write(bytes(buf), offset); return len(buf)
        def trim(h, count, offset, flags):
            h.trim(offset, count); return 0
        def flush(h): h.flush()
        PYEOF

    - name: Create drimeblock
      run: |
        cat > drimeblock <<'SHEOF'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        CONF="${DRIME_CONF:-drime-storage.conf}"
        ACCOUNTS="${DRIME_ACCOUNTS:-/run/drimelive/accounts.txt}"
        CACHE="${DRIME_CACHE:-/var/lib/drimelive}"
        RUNDIR="${DRIME_RUNDIR:-/run/drimelive}"
        SOCK="${DRIME_SOCK:-${RUNDIR}/nbd.sock}"

        case "${1:-}" in
          serve)
            mkdir -p "$CACHE" "$RUNDIR"
            exec env PYTHONPATH="$(pwd)" nbdkit --foreground --unix "$SOCK" python ./drime_nbd.py conf="$CONF" accounts="$ACCOUNTS" cache="$CACHE"
            ;;
          sync)
            mkdir -p "$CACHE"
            env PYTHONPATH="$(pwd)" python3 -c 'import os; from drime_store import DrimeStore; s=DrimeStore(conf_path=os.environ["DRIME_CONF"], accounts_path=os.environ["DRIME_ACCOUNTS"]); s.load_remote_manifest(); s.flush()'
            ;;
          flushloop)
            mkdir -p "$CACHE"
            exec env PYTHONPATH="$(pwd)" python3 -c 'import os,time; from drime_store import DrimeStore; s=DrimeStore(conf_path=os.environ["DRIME_CONF"], accounts_path=os.environ["DRIME_ACCOUNTS"]); s.load_remote_manifest(); iv=s.sync_every or 60
        while True:
            try: s.flush()
            except Exception as e: print("flush err:",e,flush=True)
            time.sleep(iv)'
            ;;
          *) echo "usage: serve|sync|flushloop"; exit 1;;
        esac
        SHEOF
        chmod +x drimeblock

    - name: Configure Drime accounts
      env:
        ALL_SECRETS: ${{ toJson(secrets) }}
      run: |
        sudo mkdir -p /run/drimelive
        sudo -E python3 - <<'PY'
        import os, json, re, subprocess
        secrets = json.loads(os.environ.get("ALL_SECRETS") or "{}")
        accounts = []
        for line in open("drime-storage.conf"):
            line = line.split("#",1)[0].strip()
            m = re.match(r'^(DRIME[0-9]*)\s+(\S+)', line)
            if m: accounts.append((m.group(1), m.group(2)))
        ok = 0
        with open("/run/drimelive/accounts.txt","w") as out:
            for name,size in accounts:
                key = secrets.get(name)
                if not key: continue
                subprocess.run(["rclone","config","delete",name], capture_output=True)
                c = subprocess.run(["rclone","config","create",name,"drime","access_token="+key], capture_output=True)
                m2 = subprocess.run(["rclone","mkdir",name+":liveblock"], capture_output=True)
                if c.returncode==0 and m2.returncode==0:
                    out.write("%s %s\n" % (name,size)); ok+=1
        if ok==0: raise SystemExit("ERROR: no Drime account.")
        PY

    - name: Check if disk already ingested
      id: os
      run: |
        first=$(head -1 /run/drimelive/accounts.txt | awk '{print $1}')
        if sudo rclone lsf "$first:liveblock/" 2>/dev/null | grep -q '^installed.marker$'; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

    - name: Find + download base image
      if: steps.os.outputs.exists != 'true'
      run: |
        first=$(head -1 /run/drimelive/accounts.txt | awk '{print $1}')
        IMG=$(sudo rclone lsf "$first:liveblock/" 2>/dev/null | grep -iE '\.(vmdk|img|qcow2)$' | head -1 || true)
        [ -z "$IMG" ] && { echo "ERROR: no base image on Drime"; exit 1; }
        echo "IMG=$IMG" >> "$GITHUB_ENV"
        sudo rclone copyto "$first:liveblock/$IMG" "./$IMG" --progress

    - name: Start storage server (auto-check)
      run: |
        sudo rm -f /run/drimelive/nbd.sock
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && DRIME_CONF=drime-storage.conf DRIME_ACCOUNTS=/run/drimelive/accounts.txt nohup ./drimeblock serve > /var/log/drimelive-serve.log 2>&1 &"
        ok=""
        for i in $(seq 1 90); do
          if [ -S /run/drimelive/nbd.sock ]; then ok=1; break; fi
          sleep 1
        done
        if [ -z "$ok" ]; then
          echo "ERROR: NBD socket never appeared. Server log:"
          sudo cat /var/log/drimelive-serve.log || true
          exit 1
        fi
        echo "NBD socket ready."

    - name: FAST Ingest VMDK directly
      if: steps.os.outputs.exists != 'true'
      run: |
        cat > /tmp/ingest.py <<'PY'
        import sys, os
        sys.path.insert(0, os.environ["PYTHONPATH"])
        from drime_store import DrimeStore
        img_path = os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["IMG_NAME"])
        s = DrimeStore(conf_path=os.environ["DRIME_CONF"], accounts_path=os.environ["DRIME_ACCOUNTS"])
        s.load_remote_manifest()
        s.ingest_from_file(img_path)
        PY
        sudo env PYTHONPATH="$PWD" DRIME_CONF="drime-storage.conf" DRIME_ACCOUNTS="/run/drimelive/accounts.txt" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" IMG_NAME="$IMG" python3 /tmp/ingest.py

    - name: Persist ingest + restart server (auto-check)
      if: steps.os.outputs.exists != 'true'
      run: |
        sudo pkill -f 'drime_nbd.py' || true; sleep 3; sudo rm -f /run/drimelive/nbd.sock
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && DRIME_CONF=drime-storage.conf DRIME_ACCOUNTS=/run/drimelive/accounts.txt ./drimeblock sync"
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && DRIME_CONF=drime-storage.conf DRIME_ACCOUNTS=/run/drimelive/accounts.txt nohup ./drimeblock serve > /var/log/drimelive-serve.log 2>&1 &"
        ok=""
        for i in $(seq 1 90); do
          if [ -S /run/drimelive/nbd.sock ]; then ok=1; break; fi
          sleep 1
        done
        if [ -z "$ok" ]; then
          echo "ERROR: NBD socket never appeared after restart. Server log:"
          sudo cat /var/log/drimelive-serve.log || true
          exit 1
        fi
        first=$(head -1 /run/drimelive/accounts.txt | awk '{print $1}')
        echo "installed $(date -Is) vmdk=$IMG" | sudo rclone rcat "$first:liveblock/installed.marker"
        echo "NBD socket ready after restart."

    - name: Start flush loop
      run: |
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && DRIME_CONF=drime-storage.conf DRIME_ACCOUNTS=/run/drimelive/accounts.txt nohup ./drimeblock flushloop > /var/log/drimelive-flush.log 2>&1 &"

    - name: Start VNC + Boot VM (KVM/VT-x, NVMe, 2c4t, 16G)
      run: |
        SOCK=/run/drimelive/nbd.sock

        if [ ! -S "$SOCK" ]; then
          echo "ERROR: NBD socket missing. Aborting."
          sudo cat /var/log/drimelive-serve.log || true
          exit 1
        fi

        # Check KVM availability
        if [ -e /dev/kvm ]; then
          echo "KVM is available on this runner"
          sudo chmod 666 /dev/kvm || true
          ACCEL="kvm"
          CPU_OPTS="-cpu host,kvm=on"
        else
          echo "WARNING: KVM not available, falling back to TCG"
          ACCEL="tcg"
          CPU_OPTS="-cpu qemu64"
        fi

        # Kill old VNC
        sudo pkill -f Xvfb || true
        sudo pkill -f x11vnc || true
        sleep 2

        echo "Starting fresh Xvfb + x11vnc..."
        sudo Xvfb :1 -screen 0 1920x1080x24 &
        sleep 2
        sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg -o /tmp/x11vnc.log
        sleep 2

        if ! sudo ss -tlnp | grep -q ':5900'; then
          echo "ERROR: x11vnc not listening. Log:"
          sudo cat /tmp/x11vnc.log || true
          exit 1
        fi
        echo "VNC server listening on port 5900"

        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        if [ -z "$NB_IP" ]; then
          echo "ERROR: Could not get NetBird IP"
          exit 1
        fi

        export DISPLAY=:1

        echo "=== BOOTING VM: q35 + KVM/VT-x + NVMe + 2c/4t + 16G ==="
        sudo -E DISPLAY=:1 qemu-system-x86_64 \
          -enable-kvm \
          -machine q35,accel=$ACCEL \
          $CPU_OPTS \
          -smp 4,sockets=1,cores=2,threads=2 \
          -m 16384 \
          -drive file=nbd:unix:${SOCK},if=none,id=drime0,format=raw,cache=writeback \
          -device nvme,drive=drime0,serial=DRIME0001 \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -display sdl > /tmp/vm.log 2>&1 &
        QPID=$!
        echo "qemu pid=$QPID"

        sleep 5
        echo "=========================================="
        echo "VM SPECS:"
        echo "  CPU: 2 cores, 4 threads"
        echo "  RAM: 16GB"
        echo "  Disk: NVMe (VMware-compatible VMDK)"
        echo "  Accel: KVM/VT-x (if available)"
        echo ""
        echo "CONNECT VIA VNC:"
        echo "  $NB_IP:5900 (no password)"
        echo "=========================================="

        # VNC watchdog
        (
          while kill -0 $QPID 2>/dev/null; do
            sleep 30
            if ! sudo ss -tlnp | grep -q ':5900'; then
              echo "[WATCHDOG] x11vnc died, restarting..."
              sudo pkill -f x11vnc || true
              sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg -o /tmp/x11vnc.log
            fi
          done
        ) &

        tail -f /dev/null
