name: DRIME TWO‑STAGE BOOT

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 curl qemu-utils qemu-system-x86 wget nbdkit nbdkit-plugin-python nbd-client
        curl -fsSL https://rclone.org/install.sh | sudo bash
        sudo chmod 666 /dev/kvm 2>/dev/null || true

    - name: Install NetBird
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key "${{ secrets.NETBIRD_SETUP_KEY }}" || exit 1

    - name: Configure rclone
      env:
        DRIME_TOKEN: ${{ secrets.DRIME }}
      run: |
        rclone config create DRIME drime access_token="$DRIME_TOKEN"
        rclone mkdir DRIME:dlive/v6/blocks || true

    - name: Write image – synchronous plugin (reliable)
      run: |
        # Download image
        IMG="/var/lib/dlive/ubuntu.img"
        sudo mkdir -p /var/lib/dlive
        sudo chown runner:runner /var/lib/dlive
        wget -O "$IMG" "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img"

        # Create a simple synchronous NBD plugin
        cat > /tmp/sync_nbd.py <<'EOF'
        import nbdkit, os, zlib, subprocess, sys, time

        BLOCK_SIZE = 16 * 1024 * 1024
        DISK_SIZE = 20 * 1024 * 1024 * 1024
        REMOTE_BASE = "DRIME:dlive/v6/blocks"
        RCLONE_FLAGS = [
            "--transfers=4",
            "--buffer-size=64M",
            "--drime-upload-concurrency=4",
            "--drime-chunk-size=16M",
            "--retries=3"
        ]

        ram_cache = {}
        ram_lock = threading.Lock()

        # Force log to stderr so we can see it
        def log(msg):
            sys.stderr.write(f"[SYNC] {msg}\n")

        def config(key, value): pass
        def thread_model(): return nbdkit.THREAD_MODEL_SERIAL
        def open(readonly): return 1
        def close(h): pass
        def get_size(h): return DISK_SIZE
        def can_write(h): return True
        def can_flush(h): return True
        def can_trim(h): return True

        def block_id(offset): return offset // BLOCK_SIZE

        def get_block(cid):
            with ram_lock:
                if cid in ram_cache:
                    return ram_cache[cid]
            remote_path = f"{REMOTE_BASE}/{cid:08d}.gz"
            tmp = f"/tmp/dlive_{cid}.tmp"
            try:
                cmd = ["rclone", "copyto"] + RCLONE_FLAGS + [remote_path, tmp]
                subprocess.run(cmd, check=True, capture_output=True, timeout=30)
                with open(tmp, 'rb') as f:
                    data = zlib.decompress(f.read())
                os.unlink(tmp)
                with ram_lock:
                    ram_cache[cid] = data
                return data
            except:
                return b"\x00" * BLOCK_SIZE

        def pread(h, count, offset, flags):
            out = bytearray(count)
            pos = 0
            while pos < count:
                o = offset + pos
                cid = block_id(o)
                co = o % BLOCK_SIZE
                n = min(BLOCK_SIZE - co, count - pos)
                blk = get_block(cid)
                out[pos:pos+n] = blk[co:co+n]
                pos += n
            return bytes(out)

        def pwrite(h, buf, offset, flags):
            # Synchronous write: upload immediately and wait
            pos = 0
            n = len(buf)
            while pos < n:
                o = offset + pos
                cid = block_id(o)
                co = o % BLOCK_SIZE
                k = min(BLOCK_SIZE - co, n - pos)

                # Update the in‑memory block
                with ram_lock:
                    if cid in ram_cache:
                        cur = bytearray(ram_cache[cid])
                    else:
                        cur = bytearray(get_block(cid))
                    cur[co:co+k] = buf[pos:pos+k]
                    new = bytes(cur)
                    ram_cache[cid] = new

                # Upload immediately
                compressed = zlib.compress(new, 1)
                remote_path = f"{REMOTE_BASE}/{cid:08d}.gz"
                tmp = f"/tmp/dlive_sync_{cid}.gz"
                try:
                    with open(tmp, 'wb') as f:
                        f.write(compressed)
                    cmd = ["rclone", "copyto"] + RCLONE_FLAGS + [tmp, remote_path]
                    subprocess.run(cmd, check=True, capture_output=True, timeout=60)
                    log(f"✅ SYNC UPLOADED {cid:08d}")
                except Exception as e:
                    log(f"❌ SYNC FAILED {cid:08d}: {e}")
                    raise  # Let nbdkit know the write failed
                finally:
                    try: os.unlink(tmp)
                    except: pass
                pos += k

        def flush(h, flags):
            pass

        def trim(h, count, offset, flags):
            start_cid = offset // BLOCK_SIZE
            end_cid = (offset + count + BLOCK_SIZE - 1) // BLOCK_SIZE
            with ram_lock:
                for cid in range(start_cid, end_cid):
                    if cid in ram_cache:
                        del ram_cache[cid]

        log("Sync plugin ready")
        EOF

        # Start nbdkit with this synchronous plugin
        sudo nbdkit -f -v python /tmp/sync_nbd.py --unix /tmp/dlive.sock > /tmp/nbdkit.log 2>&1 &
        for i in {1..15}; do [ -S /tmp/dlive.sock ] && break; sleep 1; done
        [ -S /tmp/dlive.sock ] || { cat /tmp/nbdkit.log; exit 1; }

        # Connect NBD
        sudo modprobe nbd
        sudo nbd-client -u /tmp/dlive.sock /dev/nbd0
        for i in {1..10}; do [ -b /dev/nbd0 ] && break; sleep 1; done
        [ -b /dev/nbd0 ] || { echo "nbd-client failed"; exit 1; }

        # Write the image with qemu-img
        sudo qemu-img convert -f qcow2 -O raw "$IMG" /dev/nbd0
        RESULT=$?
        sudo nbd-client -d /dev/nbd0
        if [ $RESULT -ne 0 ]; then
            echo "qemu-img failed. Showing nbdkit log:"
            cat /tmp/nbdkit.log
            exit 1
        fi
        echo "✅ Image written successfully (synchronous)."
        rclone size DRIME:dlive || true

    - name: Boot VM – adaptive async plugin (fast)
      run: |
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        echo "VNC: $NB_IP:5900"

        # Now use the full adaptive plugin for boot (already in tmp/dlive_nbd.py from previous step)
        # If not, recreate it. But we can reuse the same plugin as before with async.
        # We'll create it again here.
        cat > /tmp/dlive_nbd.py <<'PYEOF'
        import nbdkit, os, zlib, subprocess, threading, queue, sys, time, builtins
        _builtin_open = builtins.open

        BLOCK_SIZE = 8 * 1024 * 1024
        DISK_SIZE = 20 * 1024 * 1024 * 1024
        UPLOADER_THREADS = 64
        AUTO_FLUSH_INTERVAL = 5
        RCLONE_FLAGS = [
            "--transfers=64",
            "--checkers=64",
            "--buffer-size=256M",
            "--drime-upload-concurrency=16",
            "--drime-chunk-size=64M",
            "--retries=3",
            "--no-traverse"
        ]
        REMOTE_BASE = "DRIME:dlive/v6/blocks"

        ram_cache = {}
        ram_lock = threading.Lock()
        upload_queue = queue.Queue()
        pending_uploads = 0
        pending_lock = threading.Lock()
        flush_cond = threading.Condition(pending_lock)

        def log(msg):
            try:
                with _builtin_open("/tmp/dlive_plugin.log", "a") as f:
                    f.write(f"[DLIVE] {time.ctime()} {msg}\n")
            except:
                sys.stderr.write(f"[DLIVE] {time.ctime()} {msg}\n")

        def config(key, value): pass
        def thread_model(): return nbdkit.THREAD_MODEL_PARALLEL
        def open(readonly): return 1
        def close(h):
            log("Close: flushing...")
            with pending_lock:
                while pending_uploads > 0:
                    flush_cond.wait(timeout=5.0)
                    log(f"Waiting for uploads: {pending_uploads}")
            log("Close complete")

        def get_size(h): return DISK_SIZE
        def can_write(h): return True
        def can_flush(h): return True
        def can_trim(h): return True

        def block_id(offset): return offset // BLOCK_SIZE

        def get_block(cid):
            with ram_lock:
                if cid in ram_cache:
                    return ram_cache[cid]
            remote_path = f"{REMOTE_BASE}/{cid:08d}.gz"
            tmp = f"/tmp/dlive_{cid}.tmp"
            try:
                cmd = ["rclone", "copyto"] + RCLONE_FLAGS + [remote_path, tmp]
                subprocess.run(cmd, check=True, capture_output=True, timeout=30)
                with _builtin_open(tmp, 'rb') as f:
                    data = zlib.decompress(f.read())
                os.unlink(tmp)
                with ram_lock:
                    ram_cache[cid] = data
                return data
            except Exception as e:
                log(f"Download block {cid} failed: {e}")
                return b"\x00" * BLOCK_SIZE

        def pread(h, count, offset, flags):
            out = bytearray(count)
            pos = 0
            while pos < count:
                o = offset + pos
                cid = block_id(o)
                co = o % BLOCK_SIZE
                n = min(BLOCK_SIZE - co, count - pos)
                blk = get_block(cid)
                out[pos:pos+n] = blk[co:co+n]
                pos += n
            return bytes(out)

        def pwrite(h, buf, offset, flags):
            global pending_uploads
            pos = 0
            n = len(buf)
            while pos < n:
                o = offset + pos
                cid = block_id(o)
                co = o % BLOCK_SIZE
                k = min(BLOCK_SIZE - co, n - pos)

                with ram_lock:
                    if cid in ram_cache:
                        cur = bytearray(ram_cache[cid])
                    else:
                        cur = bytearray(get_block(cid))
                    cur[co:co+k] = buf[pos:pos+k]
                    new = bytes(cur)
                    ram_cache[cid] = new

                with pending_lock:
                    pending_uploads += 1
                upload_queue.put((cid, new))
                pos += k

        def flush(h, flags):
            with pending_lock:
                while pending_uploads > 0:
                    flush_cond.wait(timeout=1.0)

        def trim(h, count, offset, flags):
            start_cid = offset // BLOCK_SIZE
            end_cid = (offset + count + BLOCK_SIZE - 1) // BLOCK_SIZE
            with ram_lock:
                for cid in range(start_cid, end_cid):
                    if cid in ram_cache:
                        del ram_cache[cid]

        def uploader_loop():
            global pending_uploads
            while True:
                cid, data = upload_queue.get()
                compressed = zlib.compress(data, 1)
                remote_path = f"{REMOTE_BASE}/{cid:08d}.gz"
                tmp = f"/tmp/dlive_up_{cid}.gz"
                try:
                    with _builtin_open(tmp, 'wb') as f:
                        f.write(compressed)
                    cmd = ["rclone", "copyto"] + RCLONE_FLAGS + [tmp, remote_path]
                    subprocess.run(cmd, check=True, capture_output=True, timeout=60)
                    log(f"✅ PUSHED {cid:08d}")
                except Exception as e:
                    log(f"❌ FAILED {cid:08d}: {e}")
                finally:
                    try: os.unlink(tmp)
                    except: pass
                    with pending_lock:
                        pending_uploads -= 1
                        if pending_uploads == 0:
                            flush_cond.notify_all()

        def auto_flusher():
            while True:
                time.sleep(AUTO_FLUSH_INTERVAL)
                log("Auto-flush triggered")
                flush(None, None)
                log("Auto-flush complete")

        for _ in range(UPLOADER_THREADS):
            threading.Thread(target=uploader_loop, daemon=True).start()
        threading.Thread(target=auto_flusher, daemon=True).start()
        log("Adaptive plugin ready")
        PYEOF

        # Start nbdkit with adaptive plugin
        sudo nbdkit -f -v python /tmp/dlive_nbd.py --unix /tmp/dlive.sock > /tmp/nbdkit.log 2>&1 &
        for i in {1..15}; do [ -S /tmp/dlive.sock ] && break; sleep 1; done
        [ -S /tmp/dlive.sock ] || { cat /tmp/nbdkit.log; exit 1; }

        sudo qemu-system-x86_64 -enable-kvm -machine q35 -cpu qemu64 \
          -smp 4,sockets=1,cores=2,threads=2 -m 16384 \
          -object iothread,id=ioth1 \
          -drive file=nbd:unix:/tmp/dlive.sock,format=raw,if=none,id=d0,cache=none,aio=native,discard=unmap \
          -device nvme,serial=deadbeef,drive=d0,iothread=ioth1,namespaces=1,queue_size=1024,msix_qsize=16 \
          -boot order=c -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -device virtio-rng-pci \
          -serial file:/tmp/qemu.log -display none -vnc 0.0.0.0:0,lossy=on,share=allow-exclusive &

        while true; do sleep 30; done
