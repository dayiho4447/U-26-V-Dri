name: DLIVE1 GOD MODE (noVNC + 50ms HyperScan)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 curl qemu-utils qemu-system-x86 wget ca-certificates jq net-tools novnc websockify || true
        sudo chmod 666 /dev/kvm 2>/dev/null || true

    - name: Install latest rclone
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Install NetBird
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key "${{ secrets.NETBIRD_SETUP_KEY }}" || { echo "NetBird failed"; exit 1; }
        sudo netbird status

    - name: Configure Drime accounts
      env:
        DRIME: ${{ secrets.DRIME }}
        DRIME_ACCOUNTS: ${{ secrets.DRIME_ACCOUNTS }}
      run: |
        set +e
        python3 - <<'PY'
        import os, subprocess, sys
        accounts = []
        d = os.environ.get("DRIME", "").strip()
        if d: accounts.append(("DRIME", d, 20*1024**3))
        batch = os.environ.get("DRIME_ACCOUNTS", "") or ""
        for i, line in enumerate(batch.splitlines(), 1):
            line = line.strip()
            if not line: continue
            parts = line.split()
            if len(parts) >= 3: name, tok, size = parts[0], parts[1], int(parts[2])
            elif len(parts) == 2: name, tok, size = parts[0], parts[1], 20*1024**3
            else: name, tok, size = f"DRIME{i}", parts[0], 20*1024**3
            accounts.append((name, tok, size))
        if not accounts:
            print("ERROR: No Drime accounts!", file=sys.stderr); sys.exit(1)
        with open("/tmp/dlive_accounts", "w") as out:
            for name, tok, size in accounts:
                subprocess.run(["rclone", "config", "delete", name], capture_output=True)
                c = subprocess.run(["rclone", "config", "create", name, "drime", f"access_token={tok}"], capture_output=True)
                if c.returncode == 0:
                    out.write(f"{name} {size}\n"); print(f"✓ Account configured: {name} ({size//1024**3}GB)")
        print(f"Total accounts: {len(accounts)}")
        PY
        [ -s /tmp/dlive_accounts ] || { echo "FATAL: accounts file empty"; exit 1; }
        cat /tmp/dlive_accounts

    - name: Write DLIVE1 GOD MODE engine
      run: |
        cat > dlive_raw.py <<'PYEOF'
        #!/usr/bin/env python3
        import os, json, zlib, subprocess, sys, argparse, threading, traceback, time, queue, urllib.request
        from pathlib import Path

        B = 4 * 1024 * 1024  # 4MB BLOCKS

        class Engine:
            def __init__(s, accounts_file, cache):
                s.cache = Path(cache); s.cache.mkdir(parents=True, exist_ok=True)
                (s.cache / "staging").mkdir(exist_ok=True)
                s.accounts = []
                for line in open(accounts_file):
                    p = line.split()
                    if len(p) >= 2: s.accounts.append([p[0], int(p[1])])
                if not s.accounts: raise RuntimeError("No accounts")
                s.anchor = s.accounts[0][0]
                
                s.running = True
                s.stats = {"mb": 0.0}
                s.pushed_hashes = {}
                s.compress_queue = queue.Queue(maxsize=500)
                s.upload_queue = queue.Queue(maxsize=500)
                s.lock = threading.Lock()
                s.raw_fd = -1

            def log(s, *a): print("[DLIVE]", *a, flush=True)

            def load(s):
                sb = s.cache / "superblock.json"
                r = subprocess.run(["rclone", "copyto", f"{s.anchor}:dlive/v2/superblock.json", str(sb)], capture_output=True)
                if r.returncode == 0 and sb.exists():
                    try:
                        data = json.load(open(sb))
                        if data.get("block_size") == B:
                            s.accounts = data["accounts"]
                            s.log(f"Loaded existing v2 disk: {len(s.accounts)} accounts")
                        else: s._create_superblock()
                    except Exception: s._create_superblock()
                else: s._create_superblock()
                s.ranges = []; off = 0
                for name, size in s.accounts:
                    nb = size // B; s.ranges.append((name, off, off + nb)); off += nb
                s.size = off * B
                s.log(f"Disk size: {s.size // 1024**3}GB ({s.size // B} blocks of 4MB)")

            def _create_superblock(s):
                s.log("Creating new v2 disk...")
                sb = {"magic": "DLIVE1", "version": 2, "block_size": B, "accounts": s.accounts}
                with open(s.cache / "superblock.json", "w") as f: json.dump(sb, f)
                subprocess.run(["rclone", "copyto", str(s.cache / "superblock.json"), f"{s.anchor}:dlive/v2/superblock.json"], capture_output=True)

            def start_workers(s):
                threading.Thread(target=s.flusher_loop, daemon=True).start()
                threading.Thread(target=s.scanner_loop, daemon=True).start()
                for _ in range(12): threading.Thread(target=s.compress_worker, daemon=True).start()
                for _ in range(12): threading.Thread(target=s.upload_worker, daemon=True).start()

            def rcd_upload(s, gz_path, dest):
                url = "http://127.0.0.1:5572/operations/copyfile"
                data = json.dumps({"src": str(gz_path), "dst": dest}).encode()
                req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
                try:
                    urllib.request.urlopen(req, timeout=60)
                    return True
                except Exception: return False

            def fallback_upload(s, gz_path, dest):
                r = subprocess.run(["rclone", "copyto", str(gz_path), dest, "--retries", "2"], capture_output=True)
                return r.returncode == 0

            def flusher_loop(s):
                while s.running:
                    try:
                        if s.raw_fd >= 0: os.fsync(s.raw_fd)
                    except: pass
                    time.sleep(0.2)  # 0.2s fsync for maximum NVMe speed + data safety

            def scanner_loop(s):
                fd = os.open(s.raw_path, os.O_RDONLY)
                s.raw_fd = fd
                s.log(f"⚡ GOD MODE ACTIVE (0.2s fsync + 50ms scan + 12x compress + 12x upload)")
                while s.running:
                    pos = 0
                    while True:
                        try: data_start = os.lseek(fd, pos, os.SEEK_DATA)
                        except OSError: break
                        try: data_end = os.lseek(fd, data_start, os.SEEK_HOLE)
                        except OSError: data_end = os.lseek(fd, 0, os.SEEK_END)
                        
                        start_cid = data_start // B
                        end_cid = (data_end + B - 1) // B
                        
                        for cid in range(start_cid, end_cid):
                            os.lseek(fd, cid * B, os.SEEK_SET)
                            d = os.read(fd, B)
                            if len(d) < B: d += b"\x00" * (B - len(d))
                            if not any(d): continue
                            
                            h = zlib.crc32(d)
                            if s.pushed_hashes.get(cid) == h: continue
                            s.compress_queue.put((cid, d, h))
                        
                        pos = data_end
                    time.sleep(0.05)  # Scan every 50ms

            def compress_worker(s):
                while s.running or not s.compress_queue.empty():
                    try: cid, d, h = s.compress_queue.get(timeout=0.5)
                    except queue.Empty: continue
                    gz_data = zlib.compress(d, 1)
                    s.upload_queue.put((cid, gz_data, h))

            def upload_worker(s):
                while s.running or not s.upload_queue.empty():
                    try: cid, gz_data, h = s.upload_queue.get(timeout=0.5)
                    except queue.Empty: continue
                    
                    gz_path = s.cache / "staging" / f"{cid:08d}.gz"
                    gz_path.write_bytes(gz_data)
                    
                    dest = f"{s.anchor}:dlive/v2/blocks/{cid:08d}.gz"
                    ok = s.rcd_upload(gz_path, dest)
                    if not ok: ok = s.fallback_upload(gz_path, dest)
                    
                    if ok:
                        with s.lock:
                            s.pushed_hashes[cid] = h
                            s.stats["mb"] += B / (1024*1024)
                        s.log(f"⚡ PUSHED {cid:08d} — TOTAL ON DRIME: {s.stats['mb']:.1f}MB")
                    else:
                        s.log(f"FAILED {cid:08d}")
                    
                    try: gz_path.unlink()
                    except: pass

            def watch(s, raw_path):
                s.raw_path = raw_path
                s.start_workers()
                while s.running: time.sleep(1)

            def drain(s):
                s.log("Draining: executing DEATH SCAN...")
                s.running = False
                time.sleep(0.2)
                
                if s.raw_fd >= 0:
                    os.fsync(s.raw_fd)
                    pos = 0
                    while True:
                        try: data_start = os.lseek(s.raw_fd, pos, os.SEEK_DATA)
                        except OSError: break
                        try: data_end = os.lseek(s.raw_fd, data_start, os.SEEK_HOLE)
                        except OSError: data_end = os.lseek(s.raw_fd, 0, os.SEEK_END)
                        
                        start_cid = data_start // B
                        end_cid = (data_end + B - 1) // B
                        
                        for cid in range(start_cid, end_cid):
                            os.lseek(s.raw_fd, cid * B, os.SEEK_SET)
                            d = os.read(s.raw_fd, B)
                            if len(d) < B: d += b"\x00" * (B - len(d))
                            if not any(d): continue
                            h = zlib.crc32(d)
                            if s.pushed_hashes.get(cid) == h: continue
                            s.compress_queue.put((cid, d, h))
                        pos = data_end
                    os.close(s.raw_fd)
                
                while not s.compress_queue.empty() or not s.upload_queue.empty():
                    time.sleep(0.5)
                s.log(f"Final: TOTAL ON DRIME: {s.stats['mb']:.1f}MB")

        if __name__ == "__main__":
            ap = argparse.ArgumentParser()
            ap.add_argument("cmd")
            ap.add_argument("--accounts", required=True)
            ap.add_argument("--cache", required=True)
            ap.add_argument("--raw")
            a = ap.parse_args()
            e = Engine(a.accounts, a.cache)
            e.raw_path = a.raw
            e.load()
            try:
                if a.cmd == "watch": e.watch(a.raw)
                elif a.cmd == "drain": e.drain()
            except Exception:
                traceback.print_exc()
                sys.exit(1)
        PYEOF
        echo "✓ GOD MODE Engine written"

    - name: Start rclone daemon
      run: |
        nohup rclone rcd --rc-addr=127.0.0.1:5572 --rc-no-auth --transfers=32 --checkers=32 > /tmp/rcd.log 2>&1 &
        sleep 2
        curl -s http://127.0.0.1:5572/rc/noop && echo "✓ rclone rcd ready"

    - name: Prepare cache dir
      run: |
        set +e
        CACHE=/var/lib/dlive
        if df -P /mnt 2>/dev/null | awk 'NR==2{exit !($4>30000000)}'; then CACHE=/mnt/dlive; fi
        sudo mkdir -p "$CACHE"; sudo chown -R runner:runner "$CACHE"
        echo "$CACHE" > /tmp/dlive_cache
        df -h "$CACHE" | tail -1

    - name: Download Ubuntu 26.04 LTS Server ISO
      run: |
        CACHE=$(cat /tmp/dlive_cache)
        ISO="$CACHE/ubuntu.iso"
        if [ ! -f "$ISO" ]; then
          wget -q --tries=3 -O "$ISO" "https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso" || { echo "✗ ISO failed"; exit 1; }
        fi
        echo "$ISO" > /tmp/dlive_iso
        ls -lh "$ISO"

    - name: Boot VM GOD MODE + noVNC + LIVE LOGS
      run: |
        set -x
        CACHE=$(cat /tmp/dlive_cache)
        ISO=$(cat /tmp/dlive_iso)
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
        ACCEL=""; CPU="-cpu qemu64"
        [ -e /dev/kvm ] && { ACCEL="-enable-kvm"; CPU="-cpu host"; }

        RAW="$CACHE/disk.raw"
        truncate -s 20G "$RAW"

        touch /tmp/watch.log
        tail -n +1 -F /tmp/watch.log 2>/dev/null &
        TAIL_PID=$!

        sudo python3 -u dlive_raw.py watch --accounts /tmp/dlive_accounts --cache "$CACHE" --raw "$RAW" > /tmp/watch.log 2>&1 &
        WATCH_PID=$!
        sleep 2

        # Start noVNC web proxy (Browser access on port 6080)
        websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
        WEBSOCK_PID=$!

        echo "=================================================="
        echo "VNC CLIENT: $NB_IP:5900"
        echo "WEB BROWSER: http://$NB_IP:6080/vnc.html (autoconnect)"
        echo "MODE: GOD MODE (50ms scan + 24 workers + Death Scan)"
        echo "Install: entire disk, NO LVM."
        echo "=================================================="

        # cache=writeback,aio=threads gives VM NVMe RAM speed without the aio=native error.
        # lossy,tight compresses VNC frames instantly over the network.
        sudo -E qemu-system-x86_64 $ACCEL -machine pc $CPU \
          -smp 4,sockets=1,cores=4,threads=1 -m 16384 \
          -object iothread,id=ioth1 \
          -drive file="$RAW",format=raw,if=none,id=d0,cache=writeback,aio=threads,discard=unmap \
          -device virtio-blk-pci,drive=d0,iothread=ioth1 \
          -drive file="$ISO",media=cdrom,if=ide,id=cd0 \
          -boot order=c,once=d \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -serial stdio \
          -display none \
          -vnc 0.0.0.0:0,lossy,tight,share=allow-exclusive &
        QPID=$!

        wait $QPID

        echo "VM stopped — executing DEATH SCAN..."
        sudo python3 -u dlive_raw.py drain --accounts /tmp/dlive_accounts --cache "$CACHE" --raw "$RAW"
        sudo kill $WATCH_PID $WEBSOCK_PID 2>/dev/null
        kill $TAIL_PID 2>/dev/null
        echo "--- FULL WATCH LOG ---"
        cat /tmp/watch.log
        echo "--- FINAL DRIME STATE ---"
        ACC=$(head -1 /tmp/dlive_accounts | awk '{print $1}')
        rclone size "$ACC:dlive"
        echo "✓ Done."
