name: DLIVE1 True Block Storage (AIO)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_drime:
        description: 'Wipe Drime dlive storage and start fresh (true/false)'
        required: false
        default: 'true'

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 curl qemu-utils qemu-system-x86 wget ca-certificates jq net-tools xvfb x11vnc inotify-tools

    - name: Install latest rclone
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Install NetBird
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key "${{ secrets.NETBIRD_SETUP_KEY }}" || { echo "NetBird failed"; exit 1; }
        sudo netbird status

    - name: Configure Drime accounts
      env:
        DRIME: ${{ secrets.DRIME }}
        DRIME_ACCOUNTS: ${{ secrets.DRIME_ACCOUNTS }}
      run: |
        set +e
        python3 - <<'PY'
        import os, subprocess, sys
        accounts = []
        d = os.environ.get("DRIME", "").strip()
        if d: accounts.append(("DRIME", d, 20*1024**3))
        batch = os.environ.get("DRIME_ACCOUNTS", "") or ""
        for i, line in enumerate(batch.splitlines(), 1):
            line = line.strip()
            if not line: continue
            parts = line.split()
            if len(parts) >= 3: name, tok, size = parts[0], parts[1], int(parts[2])
            elif len(parts) == 2: name, tok, size = parts[0], parts[1], 20*1024**3
            else: name, tok, size = f"DRIME{i}", parts[0], 20*1024**3
            accounts.append((name, tok, size))
        if not accounts:
            print("ERROR: No Drime accounts!", file=sys.stderr); sys.exit(1)
        with open("/tmp/dlive_accounts", "w") as out:
            for name, tok, size in accounts:
                subprocess.run(["rclone", "config", "delete", name], capture_output=True)
                c = subprocess.run(["rclone", "config", "create", name, "drime", f"access_token={tok}"], capture_output=True)
                if c.returncode == 0:
                    out.write(f"{name} {size}\n"); print(f"✓ Account configured: {name} ({size//1024**3}GB)")
        print(f"Total accounts: {len(accounts)}")
        PY
        [ -s /tmp/dlive_accounts ] || { echo "FATAL: accounts file empty"; exit 1; }
        cat /tmp/dlive_accounts

    - name: Auto-clean Drime (fresh start)
      run: |
        if [ "${{ github.event.inputs.clean_drime }}" = "true" ]; then
          echo "Wiping Drime dlive storage..."
          while read -r name size; do
            rclone purge "${name}:dlive" 2>/dev/null || true
          done < /tmp/dlive_accounts
          echo "✓ Drime wiped clean — starting fresh"
        else
          echo "Clean skipped — will restore existing disk"
        fi

    - name: Write DLIVE1 engine (full implementation)
      run: |
        cat > dlive.py <<'PYEOF'
        #!/usr/bin/env python3
        # DLIVE1 - true object-backed block storage. ONE path: restore -> boot -> livepush -> final push.
        import os, json, zlib, subprocess, time, argparse, hashlib, threading, queue, sys
        from pathlib import Path
        from collections import defaultdict

        VERSION = "1.0"
        B = 512 * 1024  # 512KB blocks
        RC_FLAGS = ["--retries", "2", "--low-level-retries", "2", "--contimeout", "15s", "--timeout", "180s"]

        def rc(*args, timeout=600):
            try: return subprocess.run(["rclone"] + list(args) + RC_FLAGS, capture_output=True, timeout=timeout)
            except Exception as e:
                print(f"[RC ERROR] {e}", flush=True)
                return subprocess.CompletedProcess(args, 1, b"", str(e).encode())

        class Engine:
            def __init__(s, accounts_file, cache):
                s.cache = Path(cache); s.cache.mkdir(parents=True, exist_ok=True)
                s.blocks_dir = s.cache / "blocks"; s.blocks_dir.mkdir(exist_ok=True)
                s.accounts = []
                for line in open(accounts_file):
                    p = line.split()
                    if len(p) >= 2: s.accounts.append([p[0], int(p[1])])
                if not s.accounts: raise RuntimeError("No accounts")
                s.anchor = s.accounts[0][0]
                s.blk_locks = {}; s.glock = threading.Lock()
                s.up_q = queue.Queue(); s.up_set = set(); s.up_lock = threading.Lock()
                s.running = True
                s.stats = {"uploaded": 0, "skipped": 0, "changed": 0}

            def log(s, *a): print("[DLIVE]", *a, flush=True)

            def block_lock(s, cid):
                with s.glock:
                    if cid not in s.blk_locks: s.blk_locks[cid] = threading.Lock()
                    return s.blk_locks[cid]

            def load(s):
                sb = s.cache / "superblock.json"
                r = rc("copyto", f"{s.anchor}:dlive/v1/superblock.json", str(sb))
                if r.returncode == 0 and sb.exists():
                    try:
                        s.accounts = json.load(open(sb))["accounts"]
                        s.log(f"Loaded existing disk: {len(s.accounts)} accounts")
                    except Exception:
                        s._create_superblock()
                else:
                    s.log("Creating new disk..."); s._create_superblock()
                s.ranges = []; off = 0
                for name, size in s.accounts:
                    nb = size // B; s.ranges.append((name, off, off + nb)); off += nb
                s.size = off * B
                s.log(f"Disk size: {s.size // 1024**3}GB ({off} blocks)")

            def _create_superblock(s):
                sb = {"version": VERSION, "magic": "DLIVE1", "block_size": B, "accounts": s.accounts, "created": int(time.time())}
                with open(s.cache / "superblock.json", "w") as f: json.dump(sb, f)
                rc("copyto", str(s.cache / "superblock.json"), f"{s.anchor}:dlive/v1/superblock.json")

            def acct_for(s, cid):
                for name, a, b in s.ranges:
                    if a <= cid < b: return name, cid - a
                return None, None

            def block_path(s, cid): return s.blocks_dir / f"{cid:08d}.blk"

            def _fetch_block(s, cid):
                name, lid = s.acct_for(cid)
                if name is None: return None
                tmp = str(s.block_path(cid)) + ".tmp"
                r = rc("copyto", f"{name}:dlive/v1/blocks/{lid:08d}.gz", tmp)
                if r.returncode == 0 and os.path.exists(tmp):
                    try:
                        d = zlib.decompress(open(tmp, "rb").read()); os.unlink(tmp); return d
                    except Exception:
                        try: os.unlink(tmp)
                        except Exception: pass
                return None

            def _write_block_local(s, cid, data):
                with s.block_lock(cid):
                    s.block_path(cid).write_bytes(data)

            def remote_cids(s):
                cids = []
                for name, s0, e0 in s.ranges:
                    r = rc("lsf", f"{name}:dlive/v1/blocks/", "--files-only")
                    if r.returncode != 0: continue
                    for ln in r.stdout.decode().split():
                        if ln.endswith(".gz"):
                            try: cids.append(s0 + int(ln.split(".")[0]))
                            except Exception: pass
                return cids

            def restore(s, out):
                ids = s.remote_cids()
                s.log(f"Restoring {len(ids)} blocks from Drime...")
                fd = os.open(out, os.O_RDWR | os.O_CREAT, 0o644)
                os.ftruncate(fd, s.size)
                done = 0
                for cid in sorted(ids):
                    d = s._fetch_block(cid)
                    if d is None: continue
                    if len(d) < B: d += b"\x00" * (B - len(d))
                    if any(d): os.pwrite(fd, d, cid * B)
                    s._write_block_local(cid, d)
                    done += 1
                    if done % 256 == 0: s.log(f"restored {done}/{len(ids)}")
                os.close(fd)
                s.log(f"Restore complete: {done} blocks")

            def start_uploaders(s):
                for i in range(4): threading.Thread(target=s._uploader, daemon=True).start()

            def _uploader(s):
                while s.running:
                    cid = s.up_q.get(); batch = [cid]; dl = time.time() + 0.15
                    while len(batch) < 32:
                        try: batch.append(s.up_q.get(timeout=max(0.01, dl - time.time())))
                        except queue.Empty: break
                    by = defaultdict(list)
                    for c in batch:
                        p = s.block_path(c)
                        if not p.exists(): continue
                        d = p.read_bytes()
                        if not any(d): continue
                        name, lid = s.acct_for(c)
                        if name: by[name].append((lid, d))
                    for name, items in by.items():
                        stage = s.cache / f"stage_{threading.get_ident()}"; stage.mkdir(exist_ok=True)
                        for lid, d in items:
                            open(stage / f"{lid:08d}.gz", "wb").write(zlib.compress(d, 1))
                        r = rc("copy", str(stage), f"{name}:dlive/v1/blocks/", "--transfers", "16")
                        for f in stage.glob("*"):
                            try: f.unlink()
                            except Exception: pass
                        if r.returncode == 0:
                            s.stats["uploaded"] += len(items)
                            if len(items) > 0:
                                s.log(f"Uploaded {len(items)} blocks to {name}")
                        else:
                            base = next((a for nm, a, b in s.ranges if nm == name), None)
                            if base is not None:
                                for lid, _ in items:
                                    with s.up_lock: s.up_set.add(base + lid); s.up_q.put(base + lid)
                    with s.up_lock:
                        for c in batch: s.up_set.discard(c)

            def write_changed(s, off, data):
                changed = 0; pos = 0; n = len(data)
                while pos < n:
                    o = off + pos; cid = o // B; co = o % B; k = min(B - co, n - pos)
                    with s.block_lock(cid):
                        p = s.block_path(cid)
                        cur = p.read_bytes() if p.exists() else None
                        if cur is None: cur = s._fetch_block(cid) or b"\x00" * B
                        if len(cur) < B: cur += b"\x00" * (B - len(cur))
                        seg = data[pos:pos + k]
                        if cur[co:co + k] != seg:
                            cur = bytearray(cur); cur[co:co + k] = seg
                            s._write_block_local(cid, bytes(cur))
                            with s.up_lock:
                                if cid not in s.up_set: s.up_set.add(cid); s.up_q.put(cid)
                            changed += 1
                    pos += k
                return changed

            def cycle(s, overlay):
                # Direct scan - reads overlay file directly, more reliable than qemu-img map
                pushed = 0
                total_blocks = s.size // B
                
                try:
                    with open(overlay, "rb") as f:
                        for cid in range(total_blocks):
                            f.seek(cid * B)
                            d = f.read(B)
                            if len(d) == B and any(d):  # non-zero block
                                # Check if already cached and identical
                                p = s.block_path(cid)
                                if p.exists():
                                    cur = p.read_bytes()
                                    if cur == d:
                                        s.stats["skipped"] += 1
                                        continue  # skip unchanged blocks
                                
                                # Mark as changed and queue for upload
                                s._write_block_local(cid, d)
                                with s.up_lock:
                                    if cid not in s.up_set:
                                        s.up_set.add(cid)
                                        s.up_q.put(cid)
                                pushed += 1
                                s.stats["changed"] += 1
                                if pushed % 100 == 0:
                                    s.log(f"cycle: {pushed} blocks queued, {s.stats['uploaded']} uploaded, {s.stats['skipped']} skipped")
                except Exception as e:
                    s.log(f"cycle scan error: {e}")
                
                return pushed

            def livepush(s, overlay, interval):
                s.start_uploaders()
                have_inotify = subprocess.run(["which", "inotifywait"], capture_output=True).returncode == 0
                s.log(f"livepush started: event-driven={have_inotify}, fallback={interval}s")
                while s.running:
                    try:
                        n = s.cycle(overlay)
                        if n: s.log(f"livepush: {n} changed blocks pushed")
                    except Exception as e:
                        s.log(f"livepush error: {e}")
                    if have_inotify:
                        try:
                            subprocess.run(["inotifywait", "-qq", "-t", str(interval), "-e", "modify", overlay],
                                           capture_output=True, timeout=interval + 5)
                        except Exception:
                            time.sleep(interval)
                    else:
                        time.sleep(interval)

            def flush(s):
                t0 = time.time()
                while time.time() - t0 < 60:
                    with s.up_lock:
                        if not s.up_set and s.up_q.empty(): break
                    time.sleep(0.1)
                s.log(f"Final stats: uploaded={s.stats['uploaded']}, skipped={s.stats['skipped']}, changed={s.stats['changed']}")

        if __name__ == "__main__":
            ap = argparse.ArgumentParser()
            ap.add_argument("cmd")
            ap.add_argument("--accounts", required=True)
            ap.add_argument("--cache", required=True)
            ap.add_argument("--out")
            ap.add_argument("--overlay")
            ap.add_argument("--interval", type=int, default=1)
            a = ap.parse_args()
            e = Engine(a.accounts, a.cache)
            e.load()
            if a.cmd == "restore":
                e.restore(a.out)
            elif a.cmd == "livepush":
                e.livepush(a.overlay, a.interval)
            elif a.cmd == "push":
                e.start_uploaders()
                n = e.cycle(a.overlay)
                e.log(f"final push: {n} changed blocks")
                e.flush()
        PYEOF
        echo "✓ DLIVE1 engine written"

    - name: Prepare cache dir
      run: |
        set +e
        CACHE=/var/lib/dlive
        if df -P /mnt 2>/dev/null | awk 'NR==2{exit !($4>30000000)}'; then CACHE=/mnt/dlive; fi
        sudo mkdir -p "$CACHE"; sudo chown -R runner:runner "$CACHE"
        echo "$CACHE" > /tmp/dlive_cache
        df -h "$CACHE" | tail -1

    - name: Restore disk from Drime
      run: |
        CACHE=$(cat /tmp/dlive_cache)
        python3 -u dlive.py restore --accounts /tmp/dlive_accounts --cache "$CACHE" --out "$CACHE/base.raw"

    - name: Download Ubuntu 26.04 LTS Server ISO
      run: |
        CACHE=$(cat /tmp/dlive_cache)
        ISO="$CACHE/ubuntu.iso"
        if [ ! -f "$ISO" ]; then
          URL1="https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso"
          URL2="https://releases.ubuntu.com/24.04/ubuntu-24.04.3-live-server-amd64.iso"
          wget -q --tries=3 -O "$ISO" "$URL1" || wget -q --tries=3 -O "$ISO" "$URL2" || { echo "✗ ISO failed"; exit 1; }
        fi
        ls -lh "$ISO"

    - name: Start VNC (proven stack)
      run: |
        sudo pkill -f Xvfb || true; sudo pkill -f x11vnc || true; sleep 2
        sudo Xvfb :1 -screen 0 1920x1080x24 & sleep 2
        sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg -o /tmp/x11vnc.log
        sleep 2
        sudo ss -tlnp | grep 5900 && echo "✓ VNC ready on 5900"

    - name: Boot VM + lightning live sync
      run: |
        CACHE=$(cat /tmp/dlive_cache)
        ISO="$CACHE/ubuntu.iso"
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        [ -e /dev/kvm ] && { sudo chmod 666 /dev/kvm; ACCEL="-enable-kvm"; CPU="-cpu host"; } || { ACCEL=""; CPU="-cpu qemu64"; }

        qemu-img create -f qcow2 -F raw -b "$CACHE/base.raw" "$CACHE/overlay.qcow2"

        python3 -u dlive.py livepush --accounts /tmp/dlive_accounts --cache "$CACHE" --overlay "$CACHE/overlay.qcow2" --interval 1 > /tmp/livepush.log 2>&1 &
        PUSH_PID=$!
        echo "✓ livepush daemon started (event-driven, 1s fallback)"
        echo "Monitor progress: tail -f /tmp/livepush.log"

        echo "=================================================="
        echo "VNC: $NB_IP:5900 (no password)"
        echo "First boot = Ubuntu installer. Reboots = your disk."
        echo "Install: entire disk, NO LVM."
        echo "Drime will show increasing usage as blocks upload."
        echo "=================================================="

        sudo -E DISPLAY=:1 qemu-system-x86_64 $ACCEL -machine pc $CPU \
          -smp 4,sockets=1,cores=2,threads=2 -m 16384 \
          -drive file="$CACHE/overlay.qcow2",format=qcow2,if=none,id=d0,cache=writeback \
          -device ide-hd,drive=d0 \
          -cdrom "$ISO" \
          -boot order=c,once=d \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -serial stdio \
          -display sdl &
        QPID=$!

        wait $QPID

        echo "VM stopped — running final sync..."
        kill $PUSH_PID 2>/dev/null
        python3 -u dlive.py push --accounts /tmp/dlive_accounts --cache "$CACHE" --overlay "$CACHE/overlay.qcow2"
        echo "✓ Final sync complete. Your disk is safe on Drime."
