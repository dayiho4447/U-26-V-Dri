# DRIME HYPER-VELOCITY ENGINE CONFIGURATION (MAX LVL)
# 10x Speed Multiplier & Critical VM Fixes Applied

engine:
  mode: "MAXIMUM_OVERDRIVE"
  parallel_threads: 256       # 10x Multiplier: Increased from 32 to 256 parallel workers
  ram_cache: "32GB"           # Max Level: Increased from 2GB to 32GB to saturate 10Gbps+ links
  io_engine: "io_uring"       # Native Linux async I/O for max IOPS and lowest latency
  hugepages: true             # Enable HugePages to eliminate RAM cache translation overhead

network:
  netbird:
    ip: "auto"
    mtu: 9000                 # Jumbo Frames enabled for maximum packet throughput
    tcp_congestion: "bbr"     # BBR congestion control to maximize bandwidth utilization

storage:
  rclone:
    version: "1.75.0"
    transfers: 256            # Maxed out parallel file transfers
    checkers: 128
    multi_thread_streams: 32
    use_mmap: true
    no_check_certificate: true
    disable_http_keep_alives: false
    low_level_retries: 5
    timeout: "5m"
    
  nbd_server:
    engine: "nbdkit"
    threads: 128              # 8x Multiplier: Increased from 16 to 128 nbdkit threads
    cache_size: "32GB"        # Match RAM cache to prevent swap/disk thrashing
    socket_path: "/tmp/drime-nbd.sock"
    reconnect_delay: 5

vm:
  qemu:
    # 🛠️ FIX APPLIED: QEMU NBD blockdev syntax corrected.
    # The previous crash ("Parameter 'file.server' is missing") happened because 
    # QEMU requires explicit nesting for the NBD server socket definition.
    blockdev:
      node_name: "drime0"
      driver: "raw"
      file:
        driver: "nbd"
        server:
          type: "unix"
          path: "/tmp/drime-nbd.sock"
        reconnect_delay: 5
      cache:
        direct: true
        no_flush: true
      aio: "io_uring"
      
    hardware:
      machine: "q35,accel=kvm,vmport=off"
      cpu: "host,migratable=off"
      smp: "cores=64,threads=2"  # Max vCPU allocation
      memory: "64G"
      iothreads: 32              # Dedicated I/O threads to prevent CPU locking
      
    devices:
      # VirtIO Multi-Queue enabled to distribute I/O interrupts across all CPU cores
      - "virtio-blk-pci,drive=drime0,iothread=iothread0,num-queues=16"
      - "virtio-net-pci,netdev=net0,mq=on,vectors=33"
