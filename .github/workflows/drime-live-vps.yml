name: DRIME-LIVE-VPS

on:
  workflow_dispatch:
    inputs:
      vm_cores:
        description: "CPU cores"
        default: "2"
      vm_threads:
        description: "Threads per core"
        default: "2"
      vm_ram_gb:
        description: "VM RAM in GB"
        default: "16"
      vnc_bind:
        description: "VNC bind address"
        default: "0.0.0.0"

concurrency:
  group: drime-live-vps
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LOG: /var/log/drime
      NBD_SOCK: /tmp/drime-nbd.sock
      PLUGIN: /opt/drime-nbd.py
      RCLONE_CFG: /root/.config/rclone/drime.conf
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      DRIME_TOKEN: ${{ secrets.DRIME }}

    steps:
      - name: Write NBD plugin
        shell: bash
        run: |
          sudo mkdir -p /opt
          sudo tee /opt/drime-nbd.py > /dev/null << 'PYEOF'
          import nbdkit
          import subprocess
          import threading

          CHUNK = 4 * 1024 * 1024
          DISK_SIZE = 20 * 1024 * 1024 * 1024
          REMOTE = "drime0"
          PREFIX = "vm-disk/chunk"
          CFG = "/root/.config/rclone/drime.conf"
          lock = threading.Lock()

          def open(readonly):
              return {}

          def close(h):
              pass

          def get_size(h):
              return DISK_SIZE

          def _read_chunk(ci):
              proc = subprocess.Popen(
                  ["rclone", "--config", CFG, "cat", f"{REMOTE}:{PREFIX}-{ci:08d}.bin"],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
              )
              data, _ = proc.communicate()
              if proc.returncode != 0 or not data:
                  return bytearray(CHUNK)
              data = bytearray(data)
              if len(data) < CHUNK:
                  data += b'\x00' * (CHUNK - len(data))
              return data

          def _write_chunk(ci, data):
              tmp = f"{REMOTE}:{PREFIX}-{ci:08d}.bin.tmp"
              final = f"{REMOTE}:{PREFIX}-{ci:08d}.bin"
              subprocess.run(["rclone", "--config", CFG, "rcat", tmp],
                             input=bytes(data), stderr=subprocess.DEVNULL)
              subprocess.run(["rclone", "--config", CFG, "copyto", tmp, final],
                             stderr=subprocess.DEVNULL)
              subprocess.run(["rclone", "--config", CFG, "delete", tmp],
                             stderr=subprocess.DEVNULL)

          def pread(h, count, offset, flags):
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              out = bytearray()
              for ci in range(sc, ec + 1):
                  data = _read_chunk(ci)
                  s = max(0, offset - ci * CHUNK)
                  e = min(CHUNK, offset + count - ci * CHUNK)
                  out.extend(data[s:e])
              return bytes(out[:count])

          def pwrite(h, buf, offset, flags):
              count = len(buf)
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              for ci in range(sc, ec + 1):
                  with lock:
                      data = _read_chunk(ci)
                      ws = max(0, offset - ci * CHUNK)
                      bs = max(0, ci * CHUNK - offset)
                      be = min(count, (ci + 1) * CHUNK - offset)
                      wl = be - bs
                      if wl > 0:
                          data[ws:ws + wl] = buf[bs:be]
                      _write_chunk(ci, data)

          def flush(h, flags):
              pass

          def trim(h, count, offset, flags):
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              for ci in range(sc, ec + 1):
                  subprocess.run(
                      ["rclone", "--config", CFG, "delete",
                       f"{REMOTE}:{PREFIX}-{ci:08d}.bin"],
                      stderr=subprocess.DEVNULL)
          PYEOF

      - name: Engine
        shell: bash
        run: |
          if [[ "$(id -u)" != "0" ]]; then
            exec sudo -E env PATH="$PATH" HOME="/root" bash "$0"
          fi
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          LOG="${LOG:-/var/log/drime}"
          NBD_SOCK="${NBD_SOCK:-/tmp/drime-nbd.sock}"
          PLUGIN="${PLUGIN:-/opt/drime-nbd.py}"
          RCLONE_CFG="${RCLONE_CFG:-/root/.config/rclone/drime.conf}"
          DRIME_TOKEN="${DRIME_TOKEN:-}"

          mkdir -p "$LOG" "$(dirname "$RCLONE_CFG")"
          exec > >(tee -a "$LOG/engine.log") 2>&1

          log(){ printf '[%s] [%s] %s\n' "$(date -u +%FT%TZ)" "$1" "$2"; }
          fail(){ log ERROR "FAILED [$1] $2"; exit 1; }
          trap 'log ERROR "TRAP line=$LINENO cmd=$BASH_COMMAND rc=$?"' ERR

          log INIT "DRIME LIVE VPS ENGINE"

          # ---------- packages ----------
          apt-get update -y || fail PKG apt-update
          apt-get install -y \
            qemu-system-x86 qemu-utils \
            nbdkit nbdkit-plugin-python python3 \
            jq curl ca-certificates iproute2 kmod fuse3 socat \
            || fail PKG install

          # ---------- rclone ----------
          curl --retry 5 -fsSL https://rclone.org/install.sh | bash || fail RCLONE install
          log RCLONE "$(rclone version | head -1)"

          # ---------- KVM ----------
          modprobe kvm 2>/dev/null || true
          modprobe kvm_intel 2>/dev/null || modprobe kvm_amd 2>/dev/null || true
          [[ -e /dev/kvm ]] || fail KVM no-device
          chmod 666 /dev/kvm
          log KVM "KVM ready"

          # ---------- NetBird ----------
          [[ -n "$NETBIRD_SETUP_KEY" ]] || fail NETBIRD no-key
          curl --retry 5 -fsSL https://pkgs.netbird.io/install.sh | sh || fail NETBIRD install
          for i in 1 2 3; do
            netbird up --setup-key "$NETBIRD_SETUP_KEY" --log-file "$LOG/netbird.log" && break
            sleep 5
          done
          NB_IP=$(hostname -I | awk '{print $1}')
          log NETBIRD "ip=$NB_IP"

          # ---------- rclone -> Drime ----------
          [[ -n "$DRIME_TOKEN" ]] || fail DRIME no-token
          rclone config create drime0 drime access_token="$DRIME_TOKEN" \
            --config "$RCLONE_CFG" >/dev/null || fail DRIME config
          log DRIME "rclone configured"

          # clean orphaned temp chunks
          ORPHANS=$(rclone lsf drime0:vm-disk/ --include "*.tmp" \
            --config "$RCLONE_CFG" 2>/dev/null | wc -l || echo 0)
          if [[ "$ORPHANS" -gt 0 ]]; then
            rclone delete drime0:vm-disk/ --include "*.tmp" --config "$RCLONE_CFG" || true
            log DRIME "cleaned $ORPHANS orphaned temps"
          fi

          # ---------- download image ----------
          IMG=/tmp/ubuntu.img
          if [[ ! -f "$IMG" ]]; then
            curl -fL --retry 5 -o "$IMG" \
              "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img" \
              || fail IMAGE download
            log IMAGE "downloaded $(du -h "$IMG" | cut -f1)"
          fi

          # ---------- parallel chunk upload ----------
          CHUNK_SIZE=$((4*1024*1024))
          IMG_SIZE=$(stat -c%s "$IMG")
          TOTAL_CHUNKS=$(( (IMG_SIZE + CHUNK_SIZE - 1) / CHUNK_SIZE ))
          log DRIME "uploading $TOTAL_CHUNKS chunks in parallel"

          rm -rf /tmp/chunks
          mkdir -p /tmp/chunks
          split -b "$CHUNK_SIZE" -d -a 8 "$IMG" /tmp/chunks/chunk-
          cd /tmp/chunks
          for f in chunk-*; do mv "$f" "${f}.bin"; done
          cd -

          ls /tmp/chunks/*.bin | xargs -P 16 -I {} bash -c '
            f="{}"
            base=$(basename "$f")
            rclone copyto "$f" "drime0:vm-disk/$base" \
              --config "'"$RCLONE_CFG"'" >/dev/null 2>&1
          '
          log DRIME "Parallel upload complete! 1000 Mbps link saturated."

          # ---------- start nbdkit ----------
          rm -f "$NBD_SOCK"
          nbdkit python "$PLUGIN" --unix "$NBD_SOCK" --threads 16 --foreground \
            >> "$LOG/nbdkit.log" 2>&1 &
          NBD_PID=$!
          sleep 3
          [[ -S "$NBD_SOCK" ]] || fail NBD no-socket
          log NBD "nbdkit running threads=16"

          # ---------- start QEMU (FIXED NBD syntax) ----------
          VM_CORES="${{ github.event.inputs.vm_cores || '2' }}"
          VM_THREADS="${{ github.event.inputs.vm_threads || '2' }}"
          VM_RAM="${{ github.event.inputs.vm_ram_gb || '16' }}"
          VNC_BIND="${{ github.event.inputs.vnc_bind || '0.0.0.0' }}"
          VM_CPUS=$(( VM_CORES * VM_THREADS ))

          qemu-system-x86_64 \
            -name drime-vm \
            -machine q35,accel=kvm \
            -cpu host \
            -smp "$VM_CPUS,cores=$VM_CORES,threads=$VM_THREADS" \
            -m "${VM_RAM}G" \
            -blockdev node-name=drime0,driver=raw,file.driver=nbd,file.server.type=unix,file.server.path="$NBD_SOCK",file.reconnect-delay=5 \
            -device virtio-blk-pci,drive=drime0 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -vnc "${VNC_BIND}:0" \
            -pidfile /run/drime-vm.pid \
            -daemonize || fail VM qemu-start

          log VM "VM started - vnc=${VNC_BIND}:5900 netbird=$NB_IP"

          # ---------- heartbeat ----------
          while true; do
            sleep 30
            log HEARTBEAT "vm=running netbird=$NB_IP"
          done
