name: DRIME-LIVE-VPS

on:
  workflow_dispatch:
    inputs:
      vm_ram_gb:
        description: "RAM in GB"
        default: "16"
      vnc_bind:
        description: "VNC bind"
        default: "0.0.0.0"

concurrency:
  group: drime-live-vps
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LOG: /var/log/drime
      CACHE: /var/cache/drime-chunks
      NBD_SOCK: /tmp/drime-nbd.sock
      RCLONE_CFG: /root/.config/rclone/drime.conf
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      DRIME_TOKEN: ${{ secrets.DRIME }}
    steps:
      - name: Write NBD plugin
        shell: bash
        run: |
          sudo mkdir -p /opt
          sudo tee /opt/drime-nbd.py > /dev/null << 'PYEOF'
          import nbdkit, subprocess, os, time

          CHUNK = 4 * 1024 * 1024
          DISK_SIZE = 20 * 1024 * 1024 * 1024
          CACHE = "/var/cache/drime-chunks"
          REMOTE = "drime0"
          PREFIX = "vm-disk/chunk-"
          CFG = "/root/.config/rclone/drime.conf"
          os.makedirs(CACHE, exist_ok=True)

          def _p(ci): return os.path.join(CACHE, "%08d.bin" % ci)

          def fetch(ci):
              p = _p(ci)
              for attempt in range(6):
                  r = subprocess.run(["rclone", "--config", CFG, "copyto",
                                      "%s%s%08d.bin" % (REMOTE, PREFIX, ci), p],
                                     capture_output=True)
                  if r.returncode == 0:
                      return
                  time.sleep(1 + attempt)
              with open(p, "wb") as f:
                  f.write(b"\x00" * CHUNK)

          def open(readonly):
              return {}

          def get_size(h):
              return DISK_SIZE

          def pread(h, count, offset, flags):
              out = bytearray()
              ci0 = offset // CHUNK
              ci1 = (offset + count - 1) // CHUNK
              for ci in range(ci0, ci1 + 1):
                  p = _p(ci)
                  if not os.path.exists(p):
                      fetch(ci)
                  s = max(0, offset - ci * CHUNK)
                  e = min(CHUNK, offset + count - ci * CHUNK)
                  with open(p, "rb") as f:
                      f.seek(s)
                      out += f.read(e - s)
              return bytes(out)

          def pwrite(h, buf, offset, flags):
              count = len(buf)
              ci0 = offset // CHUNK
              ci1 = (offset + count - 1) // CHUNK
              for ci in range(ci0, ci1 + 1):
                  p = _p(ci)
                  if not os.path.exists(p):
                      fetch(ci)
                  s = max(0, offset - ci * CHUNK)
                  bs = max(0, ci * CHUNK - offset)
                  e = min(CHUNK, offset + count - ci * CHUNK)
                  with open(p, "rb") as f:
                      data = bytearray(f.read())
                  if len(data) < CHUNK:
                      data += b"\x00" * (CHUNK - len(data))
                  data[s:s + (e - s)] = buf[bs:bs + (e - s)]
                  tmp = p + ".w"
                  with open(tmp, "wb") as f:
                      f.write(data)
                  os.replace(tmp, p)

          def flush(h, flags):
              pass
          PYEOF

      - name: Engine
        shell: bash
        run: |
          if [[ "$(id -u)" != "0" ]]; then
            exec sudo -E env PATH="$PATH" HOME="/root" bash "$0"
          fi
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          LOG="${LOG:-/var/log/drime}"; CACHE="${CACHE:-/var/cache/drime-chunks}"
          NBD_SOCK="${NBD_SOCK:-/tmp/drime-nbd.sock}"
          RCLONE_CFG="${RCLONE_CFG:-/root/.config/rclone/drime.conf}"
          mkdir -p "$LOG" "$CACHE" "$(dirname "$RCLONE_CFG")"
          exec > >(tee -a "$LOG/engine.log") 2>&1
          log(){ printf '[%s] [%s] %s\n' "$(date -u +%FT%TZ)" "$1" "$2"; }
          fail(){ log ERROR "FAILED [$1] $2"; exit 1; }
          trap 'log ERROR "TRAP line=$LINENO rc=$?"' ERR
          trap 'log SHUTDOWN "graceful"; pkill -f nbdkit 2>/dev/null || true; pkill -f "rclone copy" 2>/dev/null || true' EXIT

          log INIT "DRIME LIVE VPS - NVMe FAST TIER + 64-WAY DRIME MIRROR"

          apt-get update -y || fail PKG APT_UPDATE
          apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils nbdkit \
            nbdkit-plugin-python jq curl ca-certificates iproute2 kmod fuse3 socat ovmf \
            || fail PKG INSTALL
          curl --retry 5 -fsSL https://rclone.org/install.sh | bash || fail RCLONE INSTALL
          log RCLONE "$(rclone version | head -n1)"

          modprobe kvm 2>/dev/null || true
          [[ -e /dev/kvm ]] || fail KVM NO_DEVICE
          chmod 666 /dev/kvm

          [[ -n "${NETBIRD_SETUP_KEY:-}" ]] || fail NETBIRD NO_KEY
          curl --retry 5 -fsSL https://pkgs.netbird.io/install.sh | sh || fail NETBIRD INSTALL
          netbird up --setup-key "$NETBIRD_SETUP_KEY" || netbird up --setup-key "$NETBIRD_SETUP_KEY" || fail NETBIRD UP
          NB_IP=$(hostname -I | awk '{print $1}')
          log NETBIRD "connected ip=$NB_IP"

          rclone config create drime0 drime access_token="$DRIME_TOKEN" --config "$RCLONE_CFG" >/dev/null || fail DRIME CONFIG

          log IMAGE "Downloading Ubuntu 26.04 LTS (resolute)"
          curl -fL --retry 5 -o /tmp/base.qcow2 \
            https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img || fail IMAGE DOWNLOAD
          qemu-img convert -f qcow2 -O raw /tmp/base.qcow2 /tmp/base.raw || fail IMAGE CONVERT
          rm -f /tmp/base.qcow2
          log IMAGE "splitting into NVMe cache"
          split -b 4M -d -a 8 --additional-suffix=.bin /tmp/base.raw "$CACHE/chunk-" || fail IMAGE SPLIT
          rm -f /tmp/base.raw
          log IMAGE "cache ready: $(ls "$CACHE" | wc -l) chunks"

          # 64-WAY BACKGROUND MIRROR (future-proof: retries forever, survives API down)
          ( while true; do
              rclone copy "$CACHE/" drime0:vm-disk/ --config "$RCLONE_CFG" \
                --transfers 64 --checkers 64 --retries 2 --low-level-retries 2 \
                --contimeout 5s --timeout 60s --stats 0 >/dev/null 2>&1
              sleep 2
            done ) &
          MIRROR_PID=$!
          log MIRROR "64-way mirror started pid=$MIRROR_PID"

          # Drime usage growth logger
          ( while true; do
              USED=$(rclone size drime0:vm-disk/ --config "$RCLONE_CFG" 2>/dev/null | awk '/Total size/{print $3}' || echo 0)
              log DRIME-USAGE "drime_used=$USED"
              sleep 30
            done ) &
          USAGE_PID=$!

          nbdkit python /opt/drime-nbd.py --unix "$NBD_SOCK" --threads 32 --foreground >>"$LOG/nbdkit.log" 2>&1 &
          NBD_PID=$!
          for i in $(seq 1 30); do [[ -S "$NBD_SOCK" ]] && break; sleep 1; done
          [[ -S "$NBD_SOCK" ]] || fail NBD NO_SOCKET
          log NBD "nbdkit live threads=32"

          qemu-system-x86_64 \
            -name drime-vm \
            -machine q35,accel=kvm \
            -cpu host \
            -smp 4,cores=2,threads=2 \
            -m "${{ github.event.inputs.vm_ram_gb || '16' }}G" \
            -blockdev node-name=drime0,driver=raw,file.driver=nbd,file.server.type=unix,file.server.path=$NBD_SOCK,file.reconnect-delay=5 \
            -device virtio-blk-pci,drive=drime0,bootindex=1 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -vnc "${{ github.event.inputs.vnc_bind || '0.0.0.0' }}:0" \
            -pidfile /run/drime-vm.pid \
            -daemonize || fail VM QEMU_START
          log VM "VM RUNNING vnc=$NB_IP:5900"

          while true; do
            [[ -f /run/drime-vm.pid ]] && kill -0 "$(cat /run/drime-vm.pid)" 2>/dev/null || fail VM DIED
            kill -0 "$MIRROR_PID" 2>/dev/null || { log MIRROR "mirror died - restarting"; ( while true; do rclone copy "$CACHE/" drime0:vm-disk/ --config "$RCLONE_CFG" --transfers 64 --checkers 64 --retries 2 --contimeout 5s --timeout 60s --stats 0 >/dev/null 2>&1; sleep 2; done ) & MIRROR_PID=$!; }
            sleep 30
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drime-logs-${{ github.run_id }}
          path: /var/log/drime
          if-no-files-found: warn
