name: DLIVE1 Enterprise Storage Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 curl qemu-utils qemu-system-x86 wget ca-certificates jq net-tools xvfb x11vnc

    - name: Install latest rclone
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Install NetBird
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key "${{ secrets.NETBIRD_SETUP_KEY }}" || { echo "NetBird failed"; exit 1; }
        sudo netbird status

    - name: Configure Drime accounts
      env:
        DRIME: ${{ secrets.DRIME }}
        DRIME_ACCOUNTS: ${{ secrets.DRIME_ACCOUNTS }}
      run: |
        set +e
        python3 - <<'PY'
        import os, subprocess, sys
        accounts = []
        d = os.environ.get("DRIME", "").strip()
        if d: accounts.append(("DRIME", d, 20*1024**3))
        batch = os.environ.get("DRIME_ACCOUNTS", "") or ""
        for i, line in enumerate(batch.splitlines(), 1):
            line = line.strip()
            if not line: continue
            parts = line.split()
            if len(parts) >= 3: name, tok, size = parts[0], parts[1], int(parts[2])
            elif len(parts) == 2: name, tok, size = parts[0], parts[1], 20*1024**3
            else: name, tok, size = f"DRIME{i}", parts[0], 20*1024**3
            accounts.append((name, tok, size))
        if not accounts:
            print("ERROR: No Drime accounts!", file=sys.stderr); sys.exit(1)
        with open("/tmp/dlive_accounts", "w") as out:
            for name, tok, size in accounts:
                subprocess.run(["rclone", "config", "delete", name], capture_output=True)
                c = subprocess.run(["rclone", "config", "create", name, "drime", f"access_token={tok}"], capture_output=True)
                if c.returncode == 0:
                    out.write(f"{name} {size}\n"); print(f"✓ Account configured: {name} ({size//1024**3}GB)")
        print(f"Total accounts: {len(accounts)}")
        PY
        [ -s /tmp/dlive_accounts ] || { echo "FATAL: accounts file empty"; exit 1; }
        cat /tmp/dlive_accounts

    - name: Write DLIVE1 Enterprise Engine
      run: |
        cat > dlive.py <<'PYEOF'
        #!/usr/bin/env python3
        import os, json, zlib, socket, struct, threading, queue, subprocess, time, argparse, hashlib, sys
        from pathlib import Path
        from collections import defaultdict

        VERSION = "1.0"
        B = 512 * 1024
        NBD_MAGIC = b"NBDMAGIC"; IHAVEOPT = b"IHAVEOPT"
        OPT_EXPORT = 1; C_NO_ZEROES = 2
        REQ_MAGIC = 0x25609513; REP_MAGIC = 0x67446ab5
        CMD_READ, CMD_WRITE, CMD_DISC, CMD_FLUSH, CMD_TRIM = 0, 1, 2, 3, 4
        RC_FLAGS = ["--retries", "2", "--low-level-retries", "2", "--contimeout", "15s", "--timeout", "180s"]

        def rc(*args, timeout=300):
            try: return subprocess.run(["rclone"] + list(args) + RC_FLAGS, capture_output=True, timeout=timeout)
            except Exception as e:
                print(f"[RC ERROR] {e}", flush=True)
                return subprocess.CompletedProcess(args, 1, b"", str(e).encode())

        def checksum(data): return hashlib.sha256(data).hexdigest()[:16]

        class Metrics:
            def __init__(self): self.lock = threading.Lock(); self.counters = defaultdict(int)
            def inc(self, name, n=1):
                with self.lock: self.counters[name] += n
            def report(self):
                with self.lock: return dict(self.counters)

        class WAL:
            def __init__(self, cache_dir):
                self.wal_dir = Path(cache_dir) / "wal"; self.wal_dir.mkdir(parents=True, exist_ok=True)
                self.lock = threading.Lock(); self.seq = 0
            def append(self, op_type, cid, data):
                with self.lock:
                    self.seq += 1
                    entry = {"seq": self.seq, "op": op_type, "cid": cid, "checksum": checksum(data), "size": len(data)}
                    with open(self.wal_dir / f"{self.seq:08d}.wal", "wb") as f:
                        f.write(json.dumps(entry).encode() + b"\n"); f.write(data)
                    return self.seq
            def replay(self):
                ops = []
                for wf in sorted(self.wal_dir.glob("*.wal")):
                    try:
                        with open(wf, "rb") as f:
                            entry = json.loads(f.readline()); data = f.read()
                        if checksum(data) == entry["checksum"]: ops.append((entry["cid"], data))
                    except Exception: pass
                return ops
            def cleanup(self, seq):
                for wf in self.wal_dir.glob("*.wal"):
                    try:
                        if int(wf.stem) <= seq: wf.unlink()
                    except Exception: pass

        class Engine:
            def __init__(self, accounts_file, cache):
                self.cache = Path(cache); self.cache.mkdir(parents=True, exist_ok=True)
                self.blocks_dir = self.cache / "blocks"; self.blocks_dir.mkdir(exist_ok=True)
                self.accounts = []
                for line in open(accounts_file):
                    p = line.split()
                    if len(p) >= 2: self.accounts.append([p[0], int(p[1])])
                if not self.accounts: raise RuntimeError("No accounts loaded")
                self.anchor = self.accounts[0][0]
                self.wal = WAL(self.cache); self.metrics = Metrics()
                self.blk_locks = {}; self.glock = threading.Lock()
                self.up_q = queue.Queue(); self.up_set = set(); self.up_lock = threading.Lock()
                self.pf_q = queue.Queue(); self.pf_set = set(); self.pf_lock = threading.Lock()
                self.running = True

            def log(self, *a): print("[DLIVE]", *a, flush=True)

            def block_lock(self, cid):
                with self.glock:
                    if cid not in self.blk_locks: self.blk_locks[cid] = threading.Lock()
                    return self.blk_locks[cid]

            def load(self):
                self.log("Initializing storage engine...")
                sb_path = self.cache / "superblock.json"
                r = rc("copyto", f"{self.anchor}:dlive/v1/superblock.json", str(sb_path))
                if r.returncode == 0 and sb_path.exists():
                    try:
                        self.accounts = json.load(open(sb_path))["accounts"]
                        self.log(f"Loaded existing disk: {len(self.accounts)} accounts")
                    except Exception as e:
                        self.log(f"Superblock corrupt, recreating: {e}"); self._create_superblock()
                else:
                    self.log("Creating new disk..."); self._create_superblock()
                self.ranges = []; off = 0
                for name, size in self.accounts:
                    nb = size // B; self.ranges.append((name, off, off + nb)); off += nb
                self.size = off * B
                self.log(f"Disk size: {self.size // 1024**3}GB ({off} blocks)")
                ops = self.wal.replay()
                if ops:
                    self.log(f"Replaying {len(ops)} WAL entries...")
                    for cid, data in ops: self._write_block_local(cid, data)
                    self.log("WAL replay complete")
                for i in range(4): threading.Thread(target=self._uploader, daemon=True).start()
                for i in range(8): threading.Thread(target=self._prefetcher, daemon=True).start()
                threading.Thread(target=self._health_monitor, daemon=True).start()
                threading.Thread(target=self._prewarm, daemon=True).start()
                self.log("Engine ready")

            def _create_superblock(self):
                sb = {"version": VERSION, "magic": "DLIVE1", "block_size": B, "accounts": self.accounts, "created": int(time.time())}
                with open(self.cache / "superblock.json", "w") as f: json.dump(sb, f, indent=2)
                rc("copyto", str(self.cache / "superblock.json"), f"{self.anchor}:dlive/v1/superblock.json")

            def _health_monitor(self):
                while self.running:
                    time.sleep(30); self.log(f"Health: {self.metrics.report()}")
                    try:
                        st = os.statvfs(self.cache)
                        if (st.f_bavail * st.f_frsize) / 1024**3 < 1:
                            self.log("WARNING: Low space, evicting..."); self._evict(1024)
                    except Exception: pass

            def _evict(self, count):
                files = sorted(self.blocks_dir.glob("*.blk"), key=lambda p: p.stat().st_mtime)
                n = 0
                for f in files:
                    if n >= count: break
                    try:
                        cid = int(f.stem)
                        with self.block_lock(cid):
                            if cid not in self.up_set: f.unlink(); n += 1
                    except Exception: pass
                self.metrics.inc("evict", n)

            def acct_for(self, cid):
                for name, s, e in self.ranges:
                    if s <= cid < e: return name, cid - s
                return None, None

            def block_path(self, cid): return self.blocks_dir / f"{cid:08d}.blk"

            def _fetch_block(self, cid):
                name, lid = self.acct_for(cid)
                if name is None: return None
                tmp = str(self.block_path(cid)) + ".tmp"
                r = rc("copyto", f"{name}:dlive/v1/blocks/{lid:08d}.gz", tmp)
                if r.returncode == 0 and os.path.exists(tmp):
                    try:
                        data = zlib.decompress(open(tmp, "rb").read()); os.unlink(tmp); return data
                    except Exception:
                        try: os.unlink(tmp)
                        except Exception: pass
                return None

            def _write_block_local(self, cid, data):
                with self.block_lock(cid):
                    try: self.block_path(cid).write_bytes(data)
                    except OSError:
                        self._evict(256)
                        try: self.block_path(cid).write_bytes(data)
                        except OSError as e: self.log(f"FATAL write: {e}")

            def _prewarm(self):
                for cid in range(256):
                    with self.pf_lock:
                        if cid not in self.pf_set: self.pf_set.add(cid); self.pf_q.put(cid)
                self.log("Prewarm queued")

            def _prefetcher(self):
                while self.running:
                    cid = self.pf_q.get()
                    try:
                        p = self.block_path(cid)
                        if not p.exists():
                            data = self._fetch_block(cid)
                            if data is not None:
                                if len(data) < B: data += b"\x00" * (B - len(data))
                                self._write_block_local(cid, data); self.metrics.inc("prefetch")
                    except Exception: pass
                    finally:
                        with self.pf_lock: self.pf_set.discard(cid)
                        self.pf_q.task_done()

            def read(self, off, length):
                out = bytearray(length); pos = 0
                while pos < length:
                    o = off + pos; cid = o // B; co = o % B; n = min(B - co, length - pos)
                    with self.block_lock(cid):
                        p = self.block_path(cid)
                        if p.exists(): data = p.read_bytes(); self.metrics.inc("cache_hit")
                        else:
                            data = self._fetch_block(cid)
                            if data is None: data = b"\x00" * B
                            if len(data) < B: data += b"\x00" * (B - len(data))
                            self._write_block_local(cid, data); self.metrics.inc("cache_miss")
                    out[pos:pos+n] = data[co:co+n]; pos += n
                    for a in range(1, 32):
                        c2 = cid + a
                        with self.pf_lock:
                            if c2 not in self.pf_set: self.pf_set.add(c2); self.pf_q.put(c2)
                return bytes(out)

            def write(self, off, data):
                pos = 0; n = len(data)
                while pos < n:
                    o = off + pos; cid = o // B; co = o % B; k = min(B - co, n - pos)
                    with self.block_lock(cid):
                        p = self.block_path(cid)
                        cur = bytearray(p.read_bytes()) if p.exists() else bytearray(self._fetch_block(cid) or (b"\x00" * B))
                        if len(cur) < B: cur.extend(b"\x00" * (B - len(cur)))
                        cur[co:co+k] = data[pos:pos+k]
                        new = bytes(cur)
                        self.wal.append("write", cid, new)
                        self._write_block_local(cid, new)
                        with self.up_lock:
                            if cid not in self.up_set: self.up_set.add(cid); self.up_q.put(cid)
                    pos += k
                self.metrics.inc("write_bytes", n)

            def _uploader(self):
                while self.running:
                    cid = self.up_q.get(); batch = [cid]; dl = time.time() + 0.15
                    while len(batch) < 32:
                        try: batch.append(self.up_q.get(timeout=max(0.01, dl - time.time())))
                        except queue.Empty: break
                    by_acct = defaultdict(list)
                    for c in batch:
                        p = self.block_path(c)
                        if not p.exists(): continue
                        data = p.read_bytes()
                        if not any(data): self.metrics.inc("skip_zero"); continue
                        name, lid = self.acct_for(c)
                        if name: by_acct[name].append((lid, data))
                    for name, items in by_acct.items():
                        stage = self.cache / f"stage_{threading.get_ident()}"; stage.mkdir(exist_ok=True)
                        for lid, data in items:
                            with open(stage / f"{lid:08d}.gz", "wb") as f: f.write(zlib.compress(data, 1))
                        r = rc("copy", str(stage), f"{name}:dlive/v1/blocks/", "--transfers", "16")
                        for f in stage.glob("*"):
                            try: f.unlink()
                            except Exception: pass
                        if r.returncode == 0: self.metrics.inc("upload_success", len(items))
                        else:
                            self.metrics.inc("upload_fail")
                            base = next((s for nm, s, e in self.ranges if nm == name), None)
                            if base is not None:
                                for lid, _ in items:
                                    with self.up_lock: self.up_set.add(base + lid); self.up_q.put(base + lid)
                    with self.up_lock:
                        for c in batch: self.up_set.discard(c)

            def flush(self):
                t0 = time.time()
                while time.time() - t0 < 30:
                    with self.up_lock:
                        if not self.up_set and self.up_q.empty(): break
                    time.sleep(0.05)
                self.wal.cleanup(999999999)

            def shutdown(self): self.running = False; self.flush()

        def recv_exact(c, n):
            b = b""
            while len(b) < n:
                k = c.recv(n - len(b))
                if not k: return None
                b += k
            return b

        def client(eng, conn):
            try:
                conn.sendall(NBD_MAGIC + IHAVEOPT + struct.pack(">H", 3))
                cf = struct.unpack(">I", recv_exact(conn, 4))[0]
                noz = bool(cf & C_NO_ZEROES)
                while True:
                    h = recv_exact(conn, 16)
                    if not h: return
                    mg, opt, ol = struct.unpack(">QII", h)
                    if ol: recv_exact(conn, ol)
                    if opt == OPT_EXPORT:
                        r = struct.pack(">QH", eng.size, (1 << 0) | (1 << 2) | (1 << 5))
                        if not noz: r += b"\x00" * 124
                        conn.sendall(r); break
                    else: conn.sendall(struct.pack(">QIII", 0x3e889045565a9, opt, 0x80000001, 0))
                while True:
                    q = recv_exact(conn, 28)
                    if not q: return
                    mg, fl, cmd, hd, off, ln = struct.unpack(">IHHQQI", q)
                    if mg != REQ_MAGIC: return
                    er = 0
                    if cmd == CMD_READ:
                        try: pl = eng.read(off, ln)
                        except Exception as e: eng.log(f"Read error: {e}"); er = 5; pl = b"\x00" * ln
                        conn.sendall(struct.pack(">IIQ", REP_MAGIC, er, hd) + pl)
                    elif cmd == CMD_WRITE:
                        wd = recv_exact(conn, ln)
                        if wd is None: return
                        try: eng.write(off, wd)
                        except Exception as e: eng.log(f"Write error: {e}"); er = 5
                        if fl & 1: eng.flush()
                        conn.sendall(struct.pack(">IIQ", REP_MAGIC, er, hd))
                    elif cmd == CMD_FLUSH: eng.flush(); conn.sendall(struct.pack(">IIQ", REP_MAGIC, 0, hd))
                    elif cmd == CMD_TRIM: conn.sendall(struct.pack(">IIQ", REP_MAGIC, 0, hd))
                    elif cmd == CMD_DISC: return
                    else: conn.sendall(struct.pack(">IIQ", REP_MAGIC, 22, hd))
            except Exception as e: eng.log(f"Client error: {e}")
            finally:
                try: conn.close()
                except Exception: pass

        def serve(eng, sockpath):
            try: os.unlink(sockpath)
            except Exception: pass
            srv = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
            srv.bind(sockpath); os.chmod(sockpath, 0o777); srv.listen(32)
            eng.log(f"NBD listening on {sockpath}")
            try:
                while eng.running:
                    c, _ = srv.accept()
                    threading.Thread(target=client, args=(eng, c), daemon=True).start()
            finally: eng.shutdown()

        if __name__ == "__main__":
            ap = argparse.ArgumentParser()
            ap.add_argument("cmd"); ap.add_argument("--accounts", required=True)
            ap.add_argument("--cache", required=True); ap.add_argument("--sock", default="/tmp/dlive.sock")
            a = ap.parse_args()
            try:
                e = Engine(a.accounts, a.cache); e.load(); serve(e, a.sock)
            except Exception as ex:
                print(f"FATAL: {ex}", file=sys.stderr); sys.exit(1)
        PYEOF
        echo "✓ DLIVE1 Enterprise Engine written"

    - name: Start DLIVE1 engine
      run: |
        set +e
        CACHE=/var/lib/dlive
        if df -P /mnt 2>/dev/null | awk 'NR==2{exit !($4>30000000)}'; then CACHE=/mnt/dlive; fi
        sudo mkdir -p "$CACHE"; sudo chown -R runner:runner "$CACHE"
        echo "$CACHE" > /tmp/dlive_cache
        nohup python3 -u dlive.py serve --accounts /tmp/dlive_accounts --cache "$CACHE" --sock /tmp/dlive.sock > /tmp/dlive.log 2>&1 &
        PID=$!
        for i in $(seq 1 90); do
          if [ -S /tmp/dlive.sock ]; then echo "✓ Engine started (cache=$CACHE)"; cat /tmp/dlive.log; exit 0; fi
          if ! kill -0 $PID 2>/dev/null; then echo "✗ Engine crashed"; cat /tmp/dlive.log; exit 1; fi
          sleep 1
        done
        echo "✗ Engine timeout"; cat /tmp/dlive.log; exit 1

    - name: Download Ubuntu 26.04 LTS Server ISO
      run: |
        CACHE=$(cat /tmp/dlive_cache)
        ISO="$CACHE/ubuntu.iso"
        if [ ! -f "$ISO" ]; then
          URL1="https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso"
          URL2="https://releases.ubuntu.com/24.04/ubuntu-24.04.3-live-server-amd64.iso"
          wget -q --tries=3 -O "$ISO" "$URL1" || wget -q --tries=3 -O "$ISO" "$URL2" || { echo "✗ ISO failed"; exit 1; }
        fi
        echo "$ISO" > /tmp/dlive_iso
        ls -lh "$ISO"

    - name: Start VNC (proven x11vnc stack)
      run: |
        sudo pkill -f Xvfb || true; sudo pkill -f x11vnc || true; sleep 2
        sudo Xvfb :1 -screen 0 1920x1080x24 & sleep 2
        sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg -o /tmp/x11vnc.log
        sleep 2
        sudo ss -tlnp | grep 5900 && echo "✓ VNC ready on 5900"

    - name: Boot VM (manual install over VNC)
      run: |
        ISO=$(cat /tmp/dlive_iso)
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        [ -e /dev/kvm ] && { sudo chmod 666 /dev/kvm; ACCEL="-enable-kvm"; CPU="-cpu host"; } || { ACCEL=""; CPU="-cpu qemu64"; }
        echo "=================================================="
        echo "VNC: $NB_IP:5900 (no password) — use your normal VNC viewer"
        echo "Install: entire disk, NO LVM"
        echo "=================================================="
        sudo -E DISPLAY=:1 qemu-system-x86_64 $ACCEL -machine pc $CPU \
          -smp 4,sockets=1,cores=2,threads=2 -m 16384 \
          -drive file=nbd:unix:/tmp/dlive.sock,format=raw,if=none,id=d0,cache=writeback \
          -device ide-hd,drive=d0 \
          -cdrom "$ISO" \
          -boot order=cd \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -serial stdio \
          -display sdl
