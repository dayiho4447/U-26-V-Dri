        DRIME99: ${{ secrets.DRIME99 }}
      run: |
        sudo mkdir -p /run/drimelive
        sudo chmod 777 /run/drimelive
        sudo -E python3 - <<'PY'
        import os, re, subprocess
        
        accounts = []
        if os.path.exists("drime-storage.conf"):
            for line in open("drime-storage.conf"):
                line = line.split("#",1)[0].strip()
                m = re.match(r'^(DRIME[0-9]*)\s+(\S+)', line)
                if m: accounts.append((m.group(1), m.group(2)))
                
        ok = 0
        with open("/run/drimelive/accounts.txt","w") as out:
            for name,size in accounts:
                key = os.environ.get(name)
                if not key: continue
                subprocess.run(["rclone","config","delete",name], capture_output=True)
                c = subprocess.run(["rclone","config","create",name,"drime","access_token="+key], capture_output=True)
                m2 = subprocess.run(["rclone","mkdir",name+":liveblock"], capture_output=True)
                if c.returncode==0 and m2.returncode==0:
                    out.write("%s %s\n" % (name,size)); ok+=1
        if ok==0: raise SystemExit("ERROR: no Drime account configured.")
        print(f"Configured {ok} Drime accounts successfully.")
        PY
        sudo chmod 644 /run/drimelive/accounts.txt

    - name: Check if disk ingested
      id: os
      run: |
        first=$(sudo head -1 /run/drimelive/accounts.txt | awk '{print $1}')
        if sudo rclone lsf "$first:liveblock/" 2>/dev/null | grep -q '^installed.marker$'; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

    - name: Download + Convert + Ingest (first run only)
      if: steps.os.outputs.exists != 'true'
      run: |
        first=$(sudo head -1 /run/drimelive/accounts.txt | awk '{print $1}')
        IMG=$(sudo rclone lsf "$first:liveblock/" 2>/dev/null | grep -iE '\.(vmdk|img|qcow2)$' | head -1 || true)
        [ -z "$IMG" ] && { echo "ERROR: no base image"; exit 1; }
        
        echo "Downloading $IMG..."
        sudo rclone copyto "$first:liveblock/$IMG" "/tmp/disk.vmdk" --progress
        
        echo "Converting to raw..."
        sudo qemu-img convert -f vmdk -O raw /tmp/disk.vmdk /tmp/disk.raw
        
        echo "Ingesting to Drime..."
        cat > /tmp/ingest.py <<'PY'
        import sys, os
        sys.path.insert(0, ".")
        from drime_fast import DrimeFastStorage
        
        s = DrimeFastStorage(
            conf_path="drime-storage.conf",
            accounts_path="/run/drimelive/accounts.txt"
        )
        s.load_manifest()
        
        chunk_size = s.chunk_size
        zero_chunk = b"\x00" * chunk_size
        
        print("Ingesting disk to Drime...", flush=True)
        with open("/tmp/disk.raw", "rb") as f:
            cid = 0
            while True:
                data = f.read(chunk_size)
                if not data: break
                if len(data) < chunk_size:
                    data += b"\x00" * (chunk_size - len(data))
                if data != zero_chunk:
                    s.write_chunk(cid, data, 0)
                cid += 1
                if cid % 100 == 0:
                    print(f"  chunk {cid}...", flush=True)
        
        s.flush()
        print("Ingest complete!", flush=True)
        PY
        
        sudo env PYTHONPATH="$PWD" python3 /tmp/ingest.py
        
        echo "installed $(date -Is)" | sudo rclone rcat "$first:liveblock/installed.marker"
        sudo rm -f /tmp/disk.vmdk /tmp/disk.raw

    - name: Start Drime Storage Server (built-in NBD)
      run: |
        sudo mkdir -p /run/drimelive
        sudo chmod 777 /run/drimelive
        sudo rm -f /run/drimelive/nbd.sock
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && DRIME_CONF=drime-storage.conf DRIME_ACCOUNTS=/run/drimelive/accounts.txt nohup ./drimeblock serve > /var/log/drimelive.log 2>&1 &"
        
        for i in $(seq 1 60); do
          if [ -S /run/drimelive/nbd.sock ]; then
            echo "Drime Fast Storage ready! (took ${i}s)"
            exit 0
          fi
          if ! sudo pgrep -f "drime_fast.py serve" > /dev/null; then
            echo "ERROR: server process died. Log:"
            sudo cat /var/log/drimelive.log || true
            exit 1
          fi
          sleep 1
        done
        
        echo "ERROR: socket never appeared. Log:"
        sudo cat /var/log/drimelive.log || true
        exit 1

    - name: Start VNC + Boot VM (BIOS + IDE, matches your MBR vmdk)
      run: |
        SOCK=/run/drimelive/nbd.sock
        
        sudo pkill -f Xvfb || true
        sudo pkill -f x11vnc || true
        sleep 2
        
        sudo Xvfb :1 -screen 0 1920x1080x24 &
        sleep 2
        sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg
        sleep 2
        
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        
        if [ -e /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
          ACCEL="-enable-kvm"
          CPU="-cpu host"
        else
          ACCEL=""
          CPU="-cpu qemu64"
        fi
        
        export DISPLAY=:1
        : > /tmp/vm-serial.log
        
        echo "=== BOOTING FROM DRIME (Legacy BIOS + IDE disk) ==="
        sudo -E DISPLAY=:1 qemu-system-x86_64 \
          $ACCEL \
          -machine pc \
          $CPU \
          -smp 4,sockets=1,cores=2,threads=2 \
          -m 16384 \
          -drive file=nbd:unix:${SOCK},if=none,id=disk0,format=raw,cache=writeback \
          -device ide-hd,drive=disk0 \
          -boot order=c \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -serial file:/tmp/vm-serial.log \
          -display sdl > /tmp/vm.log 2>&1 &
        QPID=$!
        
        sleep 5
        echo "=========================================="
        echo "VM BOOTED DIRECTLY FROM DRIME (BIOS mode)"
        echo "VNC: $NB_IP:5900 (no password)"
        echo "=========================================="
        
        # Watchdog: keep VNC alive + stream guest serial console to logs
        (
          while kill -0 $QPID 2>/dev/null; do
            sleep 30
            echo "--- guest serial console ---"
            sudo tail -n 10 /tmp/vm-serial.log 2>/dev/null || true
            if ! sudo ss -tlnp | grep -q ':5900'; then
              sudo pkill -f x11vnc || true
              sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg -o /tmp/x11vnc.log
            fi
          done
        ) &
        
        tail -f /dev/null
