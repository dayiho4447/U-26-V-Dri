name: Drime Live Ubuntu VPS Auto

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 rclone curl qemu-utils qemu-system-x86 nbdkit nbdkit-plugin-python cloud-image-utils genisoimage wget ca-certificates

    - name: Install latest rclone
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Create drime_store.py
      run: |
        cat > drime_store.py <<'PYEOF'
        #!/usr/bin/env python3
        import os, re, json, time, uuid, gzip, sqlite3, hashlib, threading, subprocess, shutil
        from pathlib import Path

        def parse_size(v):
            if isinstance(v, int): return int(v)
            s = str(v).strip().upper()
            m = re.match(r'^([0-9]*\.?[0-9]+)([KMGTP]?I?B?)$', s)
            if not m: raise ValueError("bad size")
            num = float(m.group(1)); unit = m.group(2); mult = 1
            if unit.startswith("K"): mult = 1024
            elif unit.startswith("M"): mult = 1024**2
            elif unit.startswith("G"): mult = 1024**3
            elif unit.startswith("T"): mult = 1024**4
            elif unit.startswith("P"): mult = 1024**5
            return int(num*mult)

        def run_rclone(args, check=True, extra=None):
            cmd = ["rclone"] + args + (extra or [])
            p = subprocess.run(cmd, text=True, capture_output=True)
            if check and p.returncode != 0:
                raise subprocess.CalledProcessError(p.returncode, cmd, output=p.stdout, stderr=p.stderr)
            return p

        class DrimeStore:
            def __init__(self, remote, cache, size="20G", chunk_size="4M", sync_mode="writeback"):
                self.remote = remote.strip().rstrip("/")
                self.cache = Path(cache).expanduser().resolve()
                self.chunks_dir = self.cache / "chunks"
                self.tmp_dir = self.cache / "tmp"
                self.db_path = self.cache / "meta.db"
                self.chunks_dir.mkdir(parents=True, exist_ok=True)
                self.tmp_dir.mkdir(parents=True, exist_ok=True)
                self.size = parse_size(size)
                self.chunk_size = parse_size(chunk_size)
                self.sync_mode = sync_mode
                self.lock = threading.RLock()
                self.remote_ids = set()
                self.db = sqlite3.connect(str(self.db_path), check_same_thread=False)
                self.db.execute("PRAGMA journal_mode=WAL")
                self.db.execute("PRAGMA synchronous=NORMAL")
                self.db.execute("PRAGMA busy_timeout=10000")
                self.db.execute("CREATE TABLE IF NOT EXISTS meta (k TEXT PRIMARY KEY, v TEXT)")
                self.db.execute("CREATE TABLE IF NOT EXISTS chunks (id INTEGER PRIMARY KEY, sha256 TEXT, uploaded INTEGER DEFAULT 0, dirty INTEGER DEFAULT 0, gen INTEGER DEFAULT 0, updated REAL, zero INTEGER DEFAULT 0)")
                self.db.commit()
                self.dirty = set()
                self._load_dirty()

            def _load_dirty(self):
                self.dirty = set(r[0] for r in self.db.execute("SELECT id FROM chunks WHERE dirty = 1 OR uploaded = 0"))

            def set_meta(self, k, v):
                self.db.execute("INSERT INTO meta(k,v) VALUES(?,?) ON CONFLICT(k) DO UPDATE SET v=excluded.v", (k, str(v)))
                self.db.commit()

            def chunk_len(self, cid):
                start = cid*self.chunk_size
                return min(self.chunk_size, self.size-start)

            def chunk_path(self, cid):
                return self.chunks_dir / ("%08d.part" % cid)

            def _atomic_write(self, path, data):
                tmp = self.tmp_dir / ("%s.%s" % (path.name, uuid.uuid4().hex))
                with open(tmp, "wb") as f:
                    f.write(data); f.flush(); os.fsync(f.fileno())
                os.replace(tmp, path)

            def fsck(self):
                with self.lock:
                    self.set_meta("size", self.size)
                    self.set_meta("chunk_size", self.chunk_size)
                    self.load_remote_manifest()
                    self.upload_manifest()

            def load_remote_manifest(self):
                self.remote_ids = set()
                tmp = self.tmp_dir / ("manifest_%s.gz" % uuid.uuid4().hex)
                try:
                    run_rclone(["copyto", self.remote + "/manifest.json.gz", str(tmp)], extra=["--retries", "1", "--low-level-retries", "1"])
                    with gzip.open(tmp, "rt") as f:
                        m = json.load(f)
                    if int(m.get("size", 0)) != self.size: raise ValueError("size mismatch")
                    if int(m.get("chunk_size", 0)) != self.chunk_size: raise ValueError("chunk mismatch")
                    for c in m.get("chunks", []):
                        rid = int(c["id"])
                        self.remote_ids.add(rid)
                        self.db.execute("INSERT INTO chunks(id, sha256, uploaded, dirty, gen, updated, zero) VALUES(?, ?, 1, 0, ?, ?, 0) ON CONFLICT(id) DO NOTHING", (rid, c.get("sha256", ""), int(c.get("gen", 0)), float(c.get("updated", 0))))
                    self.db.commit()
                except Exception:
                    pass
                finally:
                    try: tmp.unlink()
                    except Exception: pass

            def upload_manifest(self):
                cur = self.db.execute("SELECT id, sha256, gen, updated FROM chunks WHERE uploaded = 1 AND zero = 0 ORDER BY id")
                chunks = [{"id": int(r[0]), "sha256": r[1], "gen": int(r[2]), "updated": float(r[3]) if r[3] else 0.0} for r in cur.fetchall()]
                manifest = {"version": 2, "remote": self.remote, "size": self.size, "chunk_size": self.chunk_size, "generated": time.time(), "chunks": chunks}
                tmp = self.tmp_dir / ("manifest_%s.gz" % uuid.uuid4().hex)
                with gzip.open(tmp, "wt") as f:
                    json.dump(manifest, f)
                run_rclone(["copyto", str(tmp), self.remote + "/manifest.json.gz"], extra=["--retries", "2", "--low-level-retries", "2"])
                try: tmp.unlink()
                except Exception: pass

            def read_chunk(self, cid):
                with self.lock:
                    p = self.chunk_path(cid)
                    if p.exists():
                        return p.read_bytes()
                    if cid not in self.remote_ids:
                        return b"\x00" * self.chunk_len(cid)
                    tmp = self.tmp_dir / ("%08d_%s.gz" % (cid, uuid.uuid4().hex))
                    try:
                        run_rclone(["copyto", self.remote + "/chunks/%08d.gz" % cid, str(tmp)], extra=["--retries", "1", "--low-level-retries", "1"])
                        with gzip.open(tmp, "rb") as f:
                            data = f.read()
                        expected = self.chunk_len(cid)
                        if len(data) < expected:
                            data = data + b"\x00" * (expected - len(data))
                        self._atomic_write(p, data)
                        return data
                    except subprocess.CalledProcessError as e:
                        err = (e.stderr or "").lower()
                        if any(s in err for s in ["not found", "object not found", "doesn't exist", "file not found", "no such"]):
                            self.remote_ids.discard(cid)
                            return b"\x00" * self.chunk_len(cid)
                        raise
                    finally:
                        try: tmp.unlink()
                        except Exception: pass

            def write_chunk(self, cid, data, offset_in_chunk):
                with self.lock:
                    p = self.chunk_path(cid)
                    chunk = bytearray(p.read_bytes()) if p.exists() else bytearray(self.read_chunk(cid))
                    expected = self.chunk_len(cid)
                    if len(chunk) < expected:
                        chunk.extend(b"\x00" * (expected - len(chunk)))
                    chunk[offset_in_chunk:offset_in_chunk + len(data)] = data
                    final = bytes(chunk)
                    self._atomic_write(p, final)
                    sha = hashlib.sha256(final).hexdigest()
                    self.db.execute("INSERT INTO chunks(id, sha256, uploaded, dirty, gen, updated, zero) VALUES(?, ?, 0, 1, 0, ?, 0) ON CONFLICT(id) DO UPDATE SET sha256=excluded.sha256, uploaded=0, dirty=1, gen=gen+1, updated=excluded.updated, zero=0", (cid, sha, time.time()))
                    self.db.commit()
                    self.dirty.add(cid)

            def flush(self):
                with self.lock:
                    rows = self.db.execute("SELECT id, gen FROM chunks WHERE dirty = 1").fetchall()
                    if not rows:
                        self.upload_manifest()
                        return
                    stage = self.tmp_dir / ("stage_" + uuid.uuid4().hex)
                    stage.mkdir(parents=True, exist_ok=True)
                    plan = []
                    try:
                        for cid, gen in rows:
                            p = self.chunk_path(cid)
                            if not p.exists():
                                continue
                            data = p.read_bytes()
                            expected = self.chunk_len(cid)
                            if len(data) < expected:
                                data = data + b"\x00" * (expected - len(data))
                            sha = hashlib.sha256(data).hexdigest()
                            is_zero = (data == b"\x00" * expected)
                            remote_present = cid in self.remote_ids
                            if is_zero and not remote_present:
                                plan.append({"id": cid, "gen": gen, "sha": sha, "kind": "skip"})
                                continue
                            with gzip.open(stage / ("%08d.gz" % cid), "wb") as f:
                                f.write(data)
                            plan.append({"id": cid, "gen": gen, "sha": sha, "kind": "upload"})
                        if any(x["kind"] == "upload" for x in plan):
                            run_rclone(["copy", str(stage), self.remote + "/chunks/", "--transfers", "8", "--no-update-modtime", "--stats", "5s"], extra=["--retries", "2", "--low-level-retries", "2"])
                        now = time.time()
                        for x in plan:
                            self.db.execute("UPDATE chunks SET uploaded=1, dirty=0, sha256=?, updated=?, zero=? WHERE id=? AND gen=?", (x["sha"], now, 1 if x["kind"] == "skip" else 0, x["id"], x["gen"]))
                            if x["kind"] == "upload":
                                self.remote_ids.add(x["id"])
                            else:
                                self.remote_ids.discard(x["id"])
                        self.db.commit()
                    finally:
                        shutil.rmtree(stage, ignore_errors=True)
                    self.upload_manifest()
                    self._load_dirty()

            def read(self, offset, length):
                out = bytearray(length); pos = 0
                while pos < length:
                    off = offset + pos
                    cid = off // self.chunk_size
                    coff = off % self.chunk_size
                    n = min(self.chunk_size - coff, length - pos)
                    chunk = self.read_chunk(cid)
                    out[pos:pos+n] = chunk[coff:coff+n]
                    pos += n
                return bytes(out)

            def write(self, data, offset):
                pos = 0; total = len(data)
                while pos < total:
                    off = offset + pos
                    cid = off // self.chunk_size
                    coff = off % self.chunk_size
                    n = min(self.chunk_size - coff, total - pos)
                    self.write_chunk(cid, data[pos:pos+n], coff)
                    pos += n
        PYEOF

    - name: Create drime_nbd.py
      run: |
        cat > drime_nbd.py <<'PYEOF'
        #!/usr/bin/env python3
        import os, sys
        sys.path.insert(0, os.getcwd())
        import nbdkit
        from drime_store import DrimeStore

        API_VERSION = 2
        CFG = {}
        STORE = None

        def thread_model():
            return nbdkit.THREAD_MODEL_PARALLEL

        def config(key, value):
            CFG[key] = value

        def config_complete():
            global STORE
            remote = CFG.get("remote")
            if not remote: raise ValueError("remote required")
            STORE = DrimeStore(remote=remote, cache=CFG.get("cache", "/var/lib/drimelive"), size=CFG.get("size", "20G"), chunk_size=CFG.get("chunk", "4M"), sync_mode=CFG.get("sync", "writeback"))
            STORE.fsck()

        def open(readonly):
            return STORE

        def close(h):
            try: h.flush()
            except Exception: pass

        def get_size(h):
            return h.size

        def can_write(h):
            return True

        def can_flush(h):
            return True

        def pread(h, buf, offset, flags):
            data = h.read(offset, len(buf))
            buf[:len(data)] = data
            return buf

        def pwrite(h, buf, offset, flags):
            h.write(bytes(buf), offset)
            return len(buf)

        def flush(h):
            h.flush()
        PYEOF

    - name: Create drime_seed.py
      run: |
        cat > drime_seed.py <<'PYEOF'
        #!/usr/bin/env python3
        import os, base64, pathlib, shutil, subprocess

        cache = os.environ.get("CACHE", "/var/lib/drimelive")
        root_password = os.environ.get("ROOT_PASSWORD", "root")
        netbird_key = os.environ.get("NETBIRD_SETUP_KEY", "")
        instance_id = os.environ.get("INSTANCE_ID", "drime-live-vm")

        def shq(s):
            return "'" + s.replace("'", "'\\''") + "'"

        script = "\n".join([
            "#!/bin/sh",
            "export DEBIAN_FRONTEND=noninteractive",
            "echo root:" + shq(root_password) + " | chpasswd",
            "passwd -u root >/dev/null 2>&1 || true",
            "mkdir -p /etc/ssh/sshd_config.d",
            "cat > /etc/ssh/sshd_config.d/10-drime.conf <<'SSHEOF'",
            "PermitRootLogin yes",
            "PasswordAuthentication yes",
            "KbdInteractiveAuthentication yes",
            "SSHEOF",
            "systemctl unmask ssh >/dev/null 2>&1 || true",
            "systemctl enable ssh >/dev/null 2>&1 || true",
            "( curl -fsSL https://pkgs.netbird.io/install.sh | sh ) >/dev/null 2>&1 || true",
            "systemctl enable netbird >/dev/null 2>&1 || true",
            "systemctl restart ssh >/dev/null 2>&1 || systemctl restart sshd >/dev/null 2>&1 || true",
            "if [ -n " + shq(netbird_key) + " ]; then",
            "  for i in $(seq 1 30); do curl -fsS --max-time 5 https://pkgs.netbird.io >/dev/null 2>&1 && break; sleep 2; done",
            "  netbird up --setup-key " + shq(netbird_key) + " --hostname drime-live >/dev/null 2>&1 || true",
            "fi",
            "mkdir -p /etc/drime-live",
            "cat > /etc/drime-live/identity <<'IDEOF'",
            "STORAGE=drime",
            "MODE=liveblock",
            "PRESENTATION=100_percent_drime",
            "PORT_FORWARD=0",
            "OS=ubuntu-26.04-lts-server",
            "SSH_ROOT_PASSWORD_LOGIN=true",
            "NETBIRD=installed_inside_vm",
            "IDEOF",
            "cat > /etc/motd <<'MOTDEOF'",
            "Drime Live Storage - Ubuntu 26.04 LTS - 0 port forward - SSH root pw - NetBird inside",
            "MOTDEOF",
            "",
        ]) + "\n"

        b64 = base64.b64encode(script.encode()).decode()

        ud = "\n".join([
            "#cloud-config",
            "hostname: drime-live",
            "manage_etc_hosts: true",
            "ssh_pwauth: true",
            "disable_root: false",
            "package_update: true",
            "packages:",
            "  - curl",
            "  - ca-certificates",
            "  - jq",
            "  - openssh-server",
            "  - coreutils",
            "runcmd:",
            "  - sh -c 'echo " + b64 + " | base64 -d | sh'",
            "",
        ])

        md = "instance-id: %s\nlocal-hostname: drime-live\n" % instance_id

        seed_dir = pathlib.Path(cache) / "seed"
        seed_img = pathlib.Path(cache) / "seed.img"
        seed_dir.mkdir(parents=True, exist_ok=True)
        (seed_dir / "user-data").write_text(ud)
        (seed_dir / "meta-data").write_text(md)

        if shutil.which("cloud-localds"):
            subprocess.run(["cloud-localds", str(seed_img), str(seed_dir / "user-data"), str(seed_dir / "meta-data")], check=True)
        else:
            subprocess.run(["genisoimage", "-output", str(seed_img), "-volid", "cidata", "-joliet", "-rock", str(seed_dir / "user-data"), str(seed_dir / "meta-data")], check=True)

        print("seed created:", seed_img)
        PYEOF

    - name: Create drimeblock
      run: |
        cat > drimeblock <<'SHEOF'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        REMOTE="${DRIME_REMOTE:-drime:liveblock}"
        CACHE="${DRIME_CACHE:-/var/lib/drimelive}"
        RUNDIR="${DRIME_RUNDIR:-/run/drimelive}"
        SOCK="${DRIME_SOCK:-${RUNDIR}/nbd.sock}"
        SIZE="${DRIME_SIZE:-20G}"
        CHUNK="${DRIME_CHUNK:-4M}"
        SYNC="${DRIME_SYNC:-writeback}"
        MEM="${DRIME_MEM:-768}"
        log(){ printf '\033[1;34m[drimeblock]\033[0m %s\n' "$*"; }
        die(){ printf '\033[1;31m[error]\033[0m %s\n' "$*" >&2; exit 1; }
        require_root(){ [[ $EUID -eq 0 ]] || die "run as root"; }

        wait_sock(){
          for i in $(seq 1 90); do
            [ -S "$SOCK" ] && { echo "socket ready"; return 0; }
            sleep 1
          done
          echo "ERROR socket missing"; sudo cat /var/log/drimelive-serve.log 2>/dev/null || true; exit 1
        }

        cmd_serve(){
          require_root
          mkdir -p "$CACHE" "$RUNDIR"
          log "serve remote=$REMOTE cache=$CACHE size=$SIZE chunk=$CHUNK"
          exec env PYTHONPATH="$(pwd)" nbdkit --foreground --unix "$SOCK" python ./drime_nbd.py remote="$REMOTE" cache="$CACHE" size="$SIZE" chunk="$CHUNK" sync="$SYNC"
        }

        cmd_seed(){
          require_root
          ROOT_PASSWORD="${ROOT_PASSWORD:-root}" NETBIRD_SETUP_KEY="${NETBIRD_SETUP_KEY:-}" CACHE="$CACHE" INSTANCE_ID="${INSTANCE_ID:-drime-live-vm}" python3 drime_seed.py
        }

        cmd_write_cloud(){
          require_root
          local CLOUD_IMG="${CLOUD_IMG:-}"
          [ -n "$CLOUD_IMG" ] || die "set CLOUD_IMG"
          [ -f "$CLOUD_IMG" ] || die "image not found: $CLOUD_IMG"
          [ -S "$SOCK" ] || die "socket missing"
          log "writing image to Drime live storage"
          qemu-img convert -p -O raw "$CLOUD_IMG" "nbd:unix:${SOCK}" || qemu-img convert -p -O raw "$CLOUD_IMG" "nbd:unix:${SOCK}:exportname=drime"
          log "write done"
        }

        cmd_sync(){
          require_root
          mkdir -p "$CACHE"
          env PYTHONPATH="$(pwd)" REMOTE="$REMOTE" CACHE="$CACHE" SIZE="$SIZE" CHUNK="$CHUNK" SYNC="$SYNC" python3 -c 'import os; from drime_store import DrimeStore; s=DrimeStore(remote=os.environ["REMOTE"], cache=os.environ["CACHE"], size=os.environ["SIZE"], chunk_size=os.environ["CHUNK"], sync_mode=os.environ["SYNC"]); s.fsck(); s.flush(); print("sync complete")'
        }

        cmd_flushloop(){
          require_root
          mkdir -p "$CACHE"
          log "flush loop every 45s"
          exec env PYTHONPATH="$(pwd)" REMOTE="$REMOTE" CACHE="$CACHE" SIZE="$SIZE" CHUNK="$CHUNK" SYNC="$SYNC" python3 -c 'import os,time; from drime_store import DrimeStore; s=DrimeStore(remote=os.environ["REMOTE"], cache=os.environ["CACHE"], size=os.environ["SIZE"], chunk_size=os.environ["CHUNK"], sync_mode=os.environ["SYNC"]); s.fsck()
        while True:
            try: s.flush()
            except Exception as e: print("flush err:",e,flush=True)
            time.sleep(45)'
        }

        qemu_args(){
          local ACCEL="-enable-kvm"; [ -e /dev/kvm ] || ACCEL="-machine accel=tcg"
          echo "$ACCEL"
        }

        cmd_qemu_seed(){
          require_root
          [ -S "$SOCK" ] || die "socket missing"
          local SEED_IMG="${CACHE}/seed.img"; [ -f "$SEED_IMG" ] || die "seed missing"
          local ACCEL; ACCEL="$(qemu_args)"
          log "boot VM (0 port forward, serial only)"
          exec qemu-system-x86_64 $ACCEL -m "$MEM" -drive file=nbd:unix:${SOCK},if=none,id=d0,format=raw,cache=writeback -device virtio-blk-pci,drive=d0,serial=DRIME_LIVE_0001 -cdrom "$SEED_IMG" -boot order=c -netdev user,id=n0 -device virtio-net-pci,netdev=n0 -nographic
        }

        case "${1:-}" in
          serve) cmd_serve;;
          seed) cmd_seed;;
          write-cloud) cmd_write_cloud;;
          sync) cmd_sync;;
          flushloop) cmd_flushloop;;
          qemu-seed) cmd_qemu_seed;;
          *) echo "usage: serve|seed|write-cloud|sync|flushloop|qemu-seed"; exit 1;;
        esac
        SHEOF
        chmod +x drimeblock

    - name: Configure Drime remote automatically
      env:
        DRIME_API_TOKEN: ${{ secrets.DRIME_API_TOKEN }}
      run: |
        [ -n "$DRIME_API_TOKEN" ] || { echo "ERROR add secret DRIME_API_TOKEN"; exit 1; }
        mkdir -p ~/.config/rclone
        rm -f ~/.config/rclone/rclone.conf
        touch ~/.config/rclone/rclone.conf
        chmod 600 ~/.config/rclone/rclone.conf
        ok=false
        test_remote(){ rclone mkdir drime:liveblock >/dev/null 2>&1; }
        rclone config delete drime >/dev/null 2>&1 || true
        if rclone config create drime drime access_token="$DRIME_API_TOKEN" >/dev/null 2>&1 && test_remote; then ok=true; echo "native drime ok"; fi
        if [ "$ok" != true ]; then
          UID1=$(printf '%s' "$DRIME_API_TOKEN" | cut -d'|' -f1); [ -z "$UID1" ] && UID1=drime
          PASS=$(rclone obscure "$DRIME_API_TOKEN")
          for URL in "https://drime.cloud/remote.php/dav/files/${UID1}/" "https://drime.cloud/remote.php/webdav/"; do
            rclone config delete drime >/dev/null 2>&1 || true
            if rclone config create drime webdav url="$URL" vendor=nextcloud user="$UID1" pass="$PASS" >/dev/null 2>&1 && test_remote; then ok=true; echo "webdav ok $URL"; break; fi
          done
        fi
        [ "$ok" = true ] || { echo "ERROR drime config failed"; rclone help backends || true; exit 1; }
        sudo mkdir -p /root/.config/rclone
        sudo cp ~/.config/rclone/rclone.conf /root/.config/rclone/rclone.conf
        sudo chmod 600 /root/.config/rclone/rclone.conf
        sudo rclone lsd drime: || true

    - name: Check if OS already exists in Drime
      id: os
      run: |
        if sudo rclone lsf drime:liveblock/ 2>/dev/null | grep -q '^installed.marker$'; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

    - name: Purge stale liveblock on fresh install
      if: steps.os.outputs.exists != 'true'
      run: |
        echo "fresh install: purge drime:liveblock"
        sudo rclone purge drime:liveblock || true

    - name: Start DrimeLiveBlock storage server
      run: |
        sudo rm -f /run/drimelive/nbd.sock
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && PYTHONPATH=\"$GITHUB_WORKSPACE\" DRIME_REMOTE=drime:liveblock DRIME_SIZE=20G DRIME_CHUNK=4M DRIME_SYNC=writeback nohup ./drimeblock serve > /var/log/drimelive-serve.log 2>&1 &"
        for i in $(seq 1 90); do [ -S /run/drimelive/nbd.sock ] && { echo ready; break; }; sleep 1; done
        [ -S /run/drimelive/nbd.sock ] || { echo "ERROR socket"; sudo cat /var/log/drimelive-serve.log || true; exit 1; }

    - name: Create cloud-init seed
      env:
        ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      run: |
        [ -n "$ROOT_PASSWORD" ] || { echo "ERROR add secret ROOT_PASSWORD"; exit 1; }
        [ -n "$NETBIRD_SETUP_KEY" ] || { echo "ERROR add secret NETBIRD_SETUP_KEY"; exit 1; }
        sudo -E bash -c "cd \"$GITHUB_WORKSPACE\" && ./drimeblock seed"

    - name: Download Ubuntu 26.04 LTS cloud image
      if: steps.os.outputs.exists != 'true'
      run: |
        wget -O ubuntu-26.04.img https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img

    - name: Write Ubuntu 26.04 to Drime live storage
      if: steps.os.outputs.exists != 'true'
      run: |
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && CLOUD_IMG=./ubuntu-26.04.img ./drimeblock write-cloud"

    - name: Persist install to Drime and restart server
      if: steps.os.outputs.exists != 'true'
      run: |
        echo "stop install server"
        sudo pkill -f 'drime_nbd.py' || true
        sleep 3
        sudo rm -f /run/drimelive/nbd.sock
        echo "batched upload to Drime"
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && PYTHONPATH=\"$GITHUB_WORKSPACE\" DRIME_REMOTE=drime:liveblock DRIME_SIZE=20G DRIME_CHUNK=4M DRIME_SYNC=writeback ./drimeblock sync"
        echo "restart server"
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && PYTHONPATH=\"$GITHUB_WORKSPACE\" DRIME_REMOTE=drime:liveblock DRIME_SIZE=20G DRIME_CHUNK=4M DRIME_SYNC=writeback nohup ./drimeblock serve > /var/log/drimelive-serve.log 2>&1 &"
        for i in $(seq 1 90); do [ -S /run/drimelive/nbd.sock ] && { echo ready; break; }; sleep 1; done
        [ -S /run/drimelive/nbd.sock ] || { echo "ERROR socket"; sudo cat /var/log/drimelive-serve.log || true; exit 1; }
        echo "installed $(date -Is)" | sudo rclone rcat drime:liveblock/installed.marker

    - name: Start runtime flush loop
      run: |
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && PYTHONPATH=\"$GITHUB_WORKSPACE\" DRIME_REMOTE=drime:liveblock DRIME_SIZE=20G DRIME_CHUNK=4M DRIME_SYNC=writeback nohup ./drimeblock flushloop > /var/log/drimelive-flush.log 2>&1 &"
        sleep 2
        echo "flush loop started"

    - name: Connection info
      run: |
        echo "=========================================="
        echo "Drime Live Ubuntu VPS"
        echo "OS: Ubuntu 26.04 LTS Server"
        echo "Storage: Drime live block storage"
        echo "Port forward: 0%  |  SSH root pw: yes"
        echo "NetBird: inside VM  |  hostname: drime-live"
        echo "SSH: ssh root@<NetBird IP of peer drime-live>"
        echo "Password = your ROOT_PASSWORD secret"
        echo "=========================================="

    - name: Boot VM from Drime live storage
      run: |
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && ./drimeblock qemu-seed"
