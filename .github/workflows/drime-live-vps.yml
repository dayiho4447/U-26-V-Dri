name: DRIME-LIVE-VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DRIME_USER: pyypl2005+vm@gmail.com
  DRIME_PASS: Ed16019a@
  DRIME_URL: https://dav.drime.cloud/drime

jobs:
  drime-live-vps:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System Update & Dependency Installation
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 jq curl ca-certificates iproute2 kmod fuse3 \
            cpu-checker genisoimage glib-networking glib-networking-common \
            glib-networking-services gsettings-desktop-schemas gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-x ipxe-qemu \
            ipxe-qemu-256k-compat-efi-roms libaa1 libasyncns0 libavc1394-0 \
            libboost-iostreams1.83.0 libboost-thread1.83.0 libbrlapi0.8 libcaca0 \
            libcacard0 libcdparanoia0 libdaxctl1 libdecor-0-0 libdecor-0-plugin-1-gtk \
            libdv4t64 libfdt1 libflac12t64 libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-good1.0-0 libiec61883-0 libiscsi7 libjack-jackd2-0 \
            libmp3lame0 libmpg123-0t64 libnbd0 libndctl6 libnfs14 libopus0 \
            liborc-0.4-0t64 libpcsclite1 libpipewire-0.3-0t64 libpipewire-0.3-common \
            libpmem1 libpmemobj1 libproxy1v5 libpulse0 librados2 libraw1394-11 librbd1 \
            librdmacm1t64 libsamplerate0 libsdl2-2.0-0 libshout3 libslirp0 libsndfile1 \
            libsoup-3.0-0 libsoup-3.0-common libspa-0.2-modules libspeex1 \
            libspice-server1 libtag1v5 libtag1v5-vanilla libtheora0 \
            libtorrent-rasterbar2.0t64 libtwolame0 liburing2 libusbredirparser1t64 \
            libv4l-0t64 libv4lconvert0t64 libvirglrenderer1 libvisual-0.4-0 \
            libvorbisenc2 libvpx9 libvte-2.91-0 libvte-2.91-common libwavpack1 \
            libwebrtc-audio-processing1 libxv1 msr-tools qemu-block-extra \
            qemu-system-common qemu-system-data qemu-system-gui \
            qemu-system-modules-opengl qemu-system-modules-spice seabios \
            session-migration cloud-image-utils nbdkit nbdkit-plugin-python \
            ovmf qemu-system-x86 qemu-utils socat

      - name: Install Rclone
        run: |
          wget -q https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/bin/
          sudo chown root:root /usr/bin/rclone
          sudo chmod 755 /usr/bin/rclone

      - name: Configure Rclone (Drime WebDAV)
        run: |
          mkdir -p ~/.config/rclone
          PASS_OBSCURED=$(rclone obscure "${{ env.DRIME_PASS }}")
          
          cat <<EOF > ~/.config/rclone/rclone.conf
          [drime0]
          type = webdav
          url = ${{ env.DRIME_URL }}
          vendor = other
          user = ${{ env.DRIME_USER }}
          pass = ${PASS_OBSCURED}
          EOF
          
          # Also write to drime.conf as expected by some custom scripts in your logs
          cp ~/.config/rclone/rclone.conf ~/.config/rclone/drime.conf

      - name: Install & Start NetBird
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update
          sudo apt-get install -y netbird
          sudo systemctl enable netbird
          sudo systemctl start netbird

      - name: Download Ubuntu Image
        run: |
          echo "Downloading Ubuntu Image..."
          # Replace with your actual image download logic
          dd if=/dev/zero of=ubuntu.img bs=1M count=3500 

      - name: Turbo Upload to Drime
        run: |
          echo "Starting adaptive turbo uploader..."
          # Add your custom python/bash turbo uploader script here
          # rclone copy ubuntu.img drime0: --transfers 128 --checkers 128
          
      - name: Start NBD Server
        run: |
          # Start nbdkit in background
          nbdkit --threads=16 --filter=cache cache=2G --unix /tmp/drime-nbd.sock --pidfile /tmp/nbdkit.pid memory 3500M &
          sleep 2

      - name: Start QEMU (Fixed Blockdev Syntax)
        run: |
          # FIX APPLIED HERE: 
          # Changed invalid 'file.socket.type' and 'file.socket.path' 
          # to correct QEMU blockdev syntax: 'file.server.type' and 'file.server.path'
          qemu-system-x86_64 \
            -blockdev node-name=drime0,driver=raw,file.driver=nbd,file.server.type=unix,file.server.path=/tmp/drime-nbd.sock,file.reconnect-delay=5 \
            -m 2048 -smp 2 -nographic \
            -serial mon:stdio
