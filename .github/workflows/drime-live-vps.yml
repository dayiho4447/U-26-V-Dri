name: DLIVE-CORE (100% Custom Socket-Level Architecture)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install base packages (NO nbdkit, NO websockify)
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 curl qemu-utils qemu-system-x86 wget ca-certificates jq net-tools || true
        sudo chmod 666 /dev/kvm 2>/dev/null || true

    - name: Install latest rclone (Used only as raw network pipe)
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Install NetBird
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key "${{ secrets.NETBIRD_SETUP_KEY }}" || { echo "NetBird failed"; exit 1; }
        sudo netbird status

    - name: Configure Drime accounts
      env:
        DRIME: ${{ secrets.DRIME }}
        DRIME_ACCOUNTS: ${{ secrets.DRIME_ACCOUNTS }}
      run: |
        set +e
        python3 - <<'PY'
        import os, subprocess, sys
        accounts = []
        d = os.environ.get("DRIME", "").strip()
        if d: accounts.append(("DRIME", d, 20*1024**3))
        batch = os.environ.get("DRIME_ACCOUNTS", "") or ""
        for i, line in enumerate(batch.splitlines(), 1):
            line = line.strip()
            if not line: continue
            parts = line.split()
            if len(parts) >= 3: name, tok, size = parts[0], parts[1], int(parts[2])
            elif len(parts) == 2: name, tok, size = parts[0], parts[1], 20*1024**3
            else: name, tok, size = f"DRIME{i}", parts[0], 20*1024**3
            accounts.append((name, tok, size))
        if not accounts:
            print("ERROR: No Drime accounts!", file=sys.stderr); sys.exit(1)
        with open("/tmp/dlive_accounts", "w") as out:
            for name, tok, size in accounts:
                subprocess.run(["rclone", "config", "delete", name], capture_output=True)
                c = subprocess.run(["rclone", "config", "create", name, "drime", f"access_token={tok}"], capture_output=True)
                if c.returncode == 0:
                    out.write(f"{name} {size}\n"); print(f"✓ Account configured: {name} ({size//1024**3}GB)")
        print(f"Total accounts: {len(accounts)}")
        PY
        [ -s /tmp/dlive_accounts ] || { echo "FATAL: accounts file empty"; exit 1; }
        cat /tmp/dlive_accounts

    - name: Write DLIVE-CORE Engine (100% Custom NBD Protocol Implementation)
      run: |
        cat > /tmp/dlive_core.py <<'PYEOF'
        #!/usr/bin/env python3
        # DLIVE-CORE: Custom NBD Protocol Handler written from scratch.
        # No nbdkit. No 3rd party daemons. Pure Python socket-level interception.
        import socket, struct, threading, queue, zlib, subprocess, os, sys, time

        B = 4 * 1024 * 1024  # 4MB Blocks
        DISK_SIZE = 20 * 1024 * 1024 * 1024

        # Raw NBD Protocol Constants (RFC 9284)
        NBD_MAGIC = b'NBDMAGIC'
        OPTS_MAGIC = b'IHAVEOPT'
        REQ_MAGIC = 0x25609513
        REP_MAGIC = 0x67446ab5
        CMD_READ = 0
        CMD_WRITE = 1
        CMD_DISC = 2
        CMD_FLUSH = 3

        class DLIVE_CORE:
            def __init__(self, sock_path, accounts_file):
                self.sock_path = sock_path
                self.accounts = []
                with open(accounts_file) as f:
                    for line in f:
                        p = line.split()
                        if len(p)>=2: self.accounts.append((p[0], int(p[1])))
                self.anchor = self.accounts[0][0] if self.accounts else ""
                
                self.cache = {}
                self.lock = threading.Lock()
                self.up_q = queue.Queue()
                self.pending = 0
                self.p_lock = threading.Lock()
                self.p_cond = threading.Condition(self.p_lock)
                
                for _ in range(16):
                    threading.Thread(target=self.uploader, daemon=True).start()

            def log(self, msg):
                print(f"[DLIVE-CORE] {msg}", flush=True)

            def acct_for(self, cid):
                off = 0
                for name, size in self.accounts:
                    nb = size // B
                    if off <= cid < off + nb: return name, cid - off
                    off += nb
                return None, None

            def uploader(self):
                while True:
                    cid, data = self.up_q.get()
                    name, lid = self.acct_for(cid)
                    if not name:
                        with self.p_cond:
                            self.pending -= 1
                            if self.pending == 0: self.p_cond.notify_all()
                        continue
                    
                    gz = f"/tmp/dlive_{cid}_{threading.get_ident()}.gz"
                    with open(gz, "wb") as f: f.write(zlib.compress(data, 1))
                    
                    r = subprocess.run(["rclone", "copyto", gz, f"{name}:dlive/v5/blocks/{lid:08d}.gz", "--retries", "3"], capture_output=True)
                    if r.returncode == 0:
                        self.log(f"⚡ PUSHED {cid:08d} to {name}")
                    else:
                        self.log(f"FAILED {cid:08d}")
                    try: os.unlink(gz)
                    except: pass
                    
                    with self.p_cond:
                        self.pending -= 1
                        if self.pending == 0: self.p_cond.notify_all()

            def handle_client(self, conn):
                try:
                    # 1. Handshake
                    conn.sendall(NBD_MAGIC + OPTS_MAGIC + struct.pack(">H", 1))
                    self.recv_exact(conn, 12) # Client magic + flags
                    
                    # 2. Option Haggling
                    while True:
                        opt_magic, opt, opt_len = struct.unpack(">QII", self.recv_exact(conn, 16))
                        if opt_len > 0: self.recv_exact(conn, opt_len)
                        
                        if opt == 1: # EXPORT_NAME
                            size = DISK_SIZE
                            flags = 0 
                            info = struct.pack(">QH", size, flags) + b'\x00' * 124
                            conn.sendall(info)
                            break
                        else:
                            conn.sendall(struct.pack(">QIII", 0x3e889045565a9, opt, 0x80000001, 0))
                    
                    # 3. Transmission Phase
                    while True:
                        magic, flags, cmd, handle, offset, length = struct.unpack(">IHHQQI", self.recv_exact(conn, 28))
                        if magic != REQ_MAGIC: break
                        
                        if cmd == CMD_READ:
                            out = bytearray(length)
                            pos = 0
                            while pos < length:
                                o = offset + pos
                                cid = o // B
                                co = o % B
                                n = min(B - co, length - pos)
                                with self.lock:
                                    blk = self.cache.get(cid, b'\x00' * B)
                                out[pos:pos+n] = blk[co:co+n]
                                pos += n
                            conn.sendall(struct.pack(">IIQ", REP_MAGIC, 0, handle) + bytes(out))
                        
                        elif cmd == CMD_WRITE:
                            data = self.recv_exact(conn, length)
                            pos = 0
                            while pos < length:
                                o = offset + pos
                                cid = o // B
                                co = o % B
                                n = min(B - co, length - pos)
                                
                                with self.lock:
                                    if cid not in self.cache:
                                        self.cache[cid] = bytearray(b'\x00' * B)
                                    self.cache[cid][co:co+n] = data[pos:pos+n]
                                
                                if n == B or True: 
                                    with self.p_cond:
                                        self.pending += 1
                                    self.up_q.put((cid, bytes(self.cache[cid])))
                                pos += n
                            conn.sendall(struct.pack(">IIQ", REP_MAGIC, 0, handle))
                        
                        elif cmd == CMD_FLUSH:
                            with self.p_cond:
                                while self.pending > 0:
                                    self.p_cond.wait()
                            conn.sendall(struct.pack(">IIQ", REP_MAGIC, 0, handle))
                        
                        elif cmd == CMD_DISC:
                            break
                        else:
                            conn.sendall(struct.pack(">IIQ", REP_MAGIC, 22, handle))
                except Exception as e:
                    self.log(f"Client error: {e}")
                finally:
                    conn.close()

            def recv_exact(self, conn, n):
                b = b""
                while len(b) < n:
                    k = conn.recv(n - len(b))
                    if not k: raise ConnectionError
                    b += k
                return b

            def serve(self):
                try: os.unlink(self.sock_path)
                except: pass
                s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                s.bind(self.sock_path)
                os.chmod(self.sock_path, 0o777)
                s.listen(5)
                self.log(f"Custom NBD Server listening on {self.sock_path}")
                while True:
                    c, _ = s.accept()
                    threading.Thread(target=self.handle_client, daemon=True).start()

        if __name__ == "__main__":
            core = DLIVE_CORE("/tmp/dlive.sock", sys.argv[1])
            core.serve()
        PYEOF
        echo "✓ DLIVE-CORE Engine written (100% Custom Protocol)"

    - name: Prepare cache dir
      run: |
        set +e
        CACHE=/var/lib/dlive
        if df -P /mnt 2>/dev/null | awk 'NR==2{exit !($4>30000000)}'; then CACHE=/mnt/dlive; fi
        sudo mkdir -p "$CACHE"; sudo chown -R runner:runner "$CACHE"
        echo "$CACHE" > /tmp/dlive_cache
        df -h "$CACHE" | tail -1

    - name: Download Ubuntu 26.04 LTS Server ISO
      run: |
        CACHE=$(cat /tmp/dlive_cache)
        ISO="$CACHE/ubuntu.iso"
        if [ ! -f "$ISO" ]; then
          wget -q --tries=3 -O "$ISO" "https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso" || { echo "✗ ISO failed"; exit 1; }
        fi
        echo "$ISO" > /tmp/dlive_iso
        ls -lh "$ISO"

    - name: Boot VM DLIVE-CORE + Native WebSocket VNC
      run: |
        set -x
        CACHE=$(cat /tmp/dlive_cache)
        ISO=$(cat /tmp/dlive_iso)
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
        ACCEL=""; CPU="-cpu qemu64"
        [ -e /dev/kvm ] && { ACCEL="-enable-kvm"; CPU="-cpu host"; }

        # Start Custom NBD Core
        sudo python3 -u /tmp/dlive_core.py /tmp/dlive_accounts > /tmp/core.log 2>&1 &
        CORE_PID=$!
        sleep 2
        [ -S /tmp/dlive.sock ] || { echo "✗ Core failed"; cat /tmp/core.log; exit 1; }

        echo "=================================================="
        echo "VNC CLIENT: $NB_IP:5900"
        echo "WEB BROWSER: ws://$NB_IP:6080 (Use any HTML5 VNC client)"
        echo "MODE: DLIVE-CORE (100% Custom Socket-Level Interception)"
        echo "Install: entire disk, NO LVM."
        echo "=================================================="

        # QEMU connects to our custom Python NBD server.
        # QEMU handles WebSocket natively on port 6080 (No websockify needed).
        sudo -E qemu-system-x86_64 $ACCEL -machine pc $CPU \
          -smp 4,sockets=1,cores=4,threads=1 -m 16384 \
          -object iothread,id=ioth1 \
          -drive file=nbd:unix:/tmp/dlive.sock,format=raw,if=none,id=d0,cache=writeback,aio=threads,discard=unmap \
          -device virtio-blk-pci,drive=d0,iothread=ioth1 \
          -drive file="$ISO",media=cdrom,if=ide,id=cd0 \
          -boot order=c,once=d \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -serial stdio \
          -display none \
          -vnc 0.0.0.0:0,websocket=6080,share=allow-exclusive &
        QPID=$!

        wait $QPID

        echo "VM stopped — final flush..."
        sleep 5
        sudo kill $CORE_PID 2>/dev/null
        
        echo "--- CORE LOG ---"
        cat /tmp/core.log 2>/dev/null || true
        echo "--- FINAL DRIME STATE ---"
        ACC=$(head -1 /tmp/dlive_accounts | awk '{print $1}')
        rclone size "$ACC:dlive"
        echo "✓ Done. 100% Custom Architecture."
