name: DRIME-VM-ENGINE

on:
  workflow_dispatch:
    inputs:
      vm_cores:
        description: "CPU cores"
        default: "2"
      vm_threads:
        description: "Threads per core"
        default: "2"
      vm_ram_gb:
        description: "RAM in GB"
        default: "16"
      vnc_bind:
        description: "VNC bind address"
        default: "0.0.0.0"

concurrency:
  group: drime-vm-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ENGINE_LOG_DIR: /var/log/drime
      RCLONE_CONFIG: /root/.config/rclone/drime.conf
      DRIME_POOL: /mnt/drime-pool
      DISK_IMG: /mnt/drime-pool/vm-26.04.img
      PID_FILE: /run/drime-vm.pid

      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      SECRETS_JSON: ${{ toJSON(secrets) }}
      VARS_JSON: ${{ toJSON(vars) }}

      INPUT_VM_CORES: ${{ github.event.inputs.vm_cores }}
      INPUT_VM_THREADS: ${{ github.event.inputs.vm_threads }}
      INPUT_VM_RAM_GB: ${{ github.event.inputs.vm_ram_gb }}
      INPUT_VNC_BIND: ${{ github.event.inputs.vnc_bind }}

    steps:
      - name: Engine
        shell: bash
        run: |
          if [[ "$(id -u)" != "0" ]]; then
            exec sudo -E env PATH="$PATH" HOME="/root" bash "$0"
          fi

          set -Eeuo pipefail
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export DEBIAN_FRONTEND=noninteractive

          ENGINE_LOG_DIR="${ENGINE_LOG_DIR:-/var/log/drime}"
          RCLONE_CONFIG="${RCLONE_CONFIG:-/root/.config/rclone/drime.conf}"
          DRIME_POOL="${DRIME_POOL:-/mnt/drime-pool}"
          DISK_IMG="${DISK_IMG:-/mnt/drime-pool/vm-26.04.img}"
          PID_FILE="${PID_FILE:-/run/drime-vm.pid}"

          if [[ -z "${SECRETS_JSON:-}" ]]; then SECRETS_JSON='{}'; fi
          if [[ -z "${VARS_JSON:-}" ]]; then VARS_JSON='{}'; fi

          mkdir -p "$ENGINE_LOG_DIR" "$(dirname "$RCLONE_CONFIG")"
          exec > >(tee -a "$ENGINE_LOG_DIR/engine.log") 2>&1

          log() {
            local level="$1" comp="$2"; shift 2
            printf '[%s] [%s] [%s] %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$level" "$comp" "$*"
          }

          fail() {
            trap - ERR; local comp="$1" reason="$2" which="${3:-unknown}"
            log ERROR "$comp" "FAILED reason=$reason which=$which"; exit 1
          }

          CLEANUP_DONE=0
          cleanup() {
            [[ "$CLEANUP_DONE" == "1" ]] && return 0
            CLEANUP_DONE=1
            [[ -f "$PID_FILE" ]] && kill "$(cat "$PID_FILE")" 2>/dev/null || true
            mountpoint -q "$DRIME_POOL" && umount -l "$DRIME_POOL" 2>/dev/null || true
            shopt -s nullglob
            for m in /mnt/drime*; do
              mountpoint -q "$m" && fusermount3 -u "$m" 2>/dev/null || umount -l "$m" 2>/dev/null || true
            done
          }
          trap 'log ERROR TRAP "unhandled=$BASH_COMMAND exit=$?"; exit 1' ERR
          trap cleanup EXIT
          trap 'cleanup; exit 143' TERM INT

          log INFO INIT "DRIME VM engine started (Direct Drime Boot - No Cloud-Init)"

          apt-get update -y || fail PKG APT_UPDATE_FAILED ubuntu
          apt-get install -y qemu-system-x86 qemu-utils jq curl ca-certificates iproute2 kmod socat openssl openssh-server mergerfs fuse3 || fail PKG INSTALL_FAILED core-packages

          log INFO RCLONE "Installing latest rclone..."
          curl --retry 5 -fsSL https://rclone.org/install.sh | bash || fail RCLONE INSTALL_FAILED rclone
          log INFO RCLONE "Installed version: $(rclone version | head -n1)"

          modprobe kvm || true; modprobe kvm_intel || modprobe kvm_amd || true
          [[ -e /dev/kvm ]] || fail KVM DEVICE_MISSING /dev/kvm
          chmod 666 /dev/kvm || fail KVM PERMISSION_FAILED /dev/kvm
          log INFO KVM "KVM device ready"

          get_secret_or_var() {
            local v=$(jq -r --arg k "$1" '.[$k] // empty' <<<"$SECRETS_JSON")
            [[ -z "$v" ]] && v=$(jq -r --arg k "$1" '.[$k] // empty' <<<"$VARS_JSON")
            printf '%s' "$v"
          }

          NETBIRD_INSTALL_URL="$(get_secret_or_var NETBIRD_INSTALL_URL)"
          NETBIRD_INSTALL_URL="${NETBIRD_INSTALL_URL:-https://pkgs.netbird.io/install.sh}"
          [[ -n "${NETBIRD_SETUP_KEY:-}" ]] || fail NETBIRD MISSING_SETUP_KEY NETBIRD_SETUP_KEY

          for i in {1..5}; do
            log INFO NETBIRD "Installation attempt $i..."
            curl --retry 5 --retry-connrefused -fsSL "$NETBIRD_INSTALL_URL" | sh && break
            sleep 5
          done

          for i in {1..5}; do
            log INFO NETBIRD "Connection attempt $i..."
            netbird up --setup-key "$NETBIRD_SETUP_KEY" --log-file "$ENGINE_LOG_DIR/netbird.log" && break
            sleep 5
          done

          NETBIRD_IP=$(hostname -I 2>/dev/null | awk '{print $1}' || true)
          for iface in wt0 netbird0 nb0; do
            if ip addr show "$iface" 2>/dev/null | grep -q 'inet '; then
              NETBIRD_IP=$(ip -4 -o addr show "$iface" | awk '{print $4}' | cut -d/ -f1 | head -n1)
              break
            fi
          done
          log INFO NETBIRD "NetBird ready ip=${NETBIRD_IP:-unknown}"

          touch /etc/fuse.conf
          sed -i 's/^#user_allow_other/user_allow_other/' /etc/fuse.conf || true
          grep -q '^user_allow_other' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

          mapfile -t DRIME_KEYS < <(jq -r 'to_entries[] | select(.key | test("^DRIME([0-9]+)?$")) | .key' <<<"$SECRETS_JSON" | sort -V)
          [[ ${#DRIME_KEYS[@]} -gt 0 ]] || fail STORAGE NO_DRIME_SECRETS "DRIME,DRIME1..."

          MOUNTS=()
          idx=0
          for key in "${DRIME_KEYS[@]}"; do
            val=$(jq -r --arg k "$key" '.[$k]' <<<"$SECRETS_JSON")
            if jq -e . >/dev/null 2>&1 <<<"$val"; then
              token=$(jq -r '.access_token // .token // .api_key // .pass // empty' <<<"$val")
            else
              token="$val"
            fi
            [[ -n "$token" ]] || fail STORAGE MISSING_CREDENTIAL "$key"

            rclone config create "drime$idx" drime access_token="$token" --config "$RCLONE_CONFIG" >/dev/null
            mkdir -p "/mnt/drime$idx"
            
            # Direct Mount with write-back cache required for block device emulation
            rclone mount "drime$idx:" "/mnt/drime$idx" \
              --config "$RCLONE_CONFIG" \
              --vfs-cache-mode writes \
              --vfs-cache-max-age 1m \
              --vfs-cache-max-size 2G \
              --allow-other \
              --log-file "$ENGINE_LOG_DIR/rclone-$idx.log" \
              --daemon || fail STORAGE MOUNT_FAILED "$key"
              
            MOUNTS+=("/mnt/drime$idx")
            log INFO STORAGE "MOUNT_OK account=$key"
            idx=$((idx + 1))
          done

          mkdir -p "$DRIME_POOL"
          if [[ ${#MOUNTS[@]} -gt 1 ]]; then
            mergerfs -o defaults,allow_other,use_ino,cache.files=off,category.create=mfs "${MOUNTS[@]}" "$DRIME_POOL" || fail STORAGE MERGERFS_FAILED pool
          else
            mount --bind "${MOUNTS[0]}" "$DRIME_POOL" || fail STORAGE BIND_FAILED pool
          fi
          log INFO STORAGE "POOL_OK count=${#MOUNTS[@]} path=$DRIME_POOL"

          # Download latest Ubuntu 26.04 LTS (Resolute Raccoon) directly to Drime
          if [[ ! -f "$DISK_IMG" ]]; then
            log INFO IMAGE "Downloading Ubuntu 26.04 LTS directly to Drime..."
            curl -fL --retry 5 https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img -o /tmp/resolute.img || fail IMAGE DOWNLOAD_FAILED 26.04
            qemu-img convert -p -f qcow2 -O raw /tmp/resolute.img "$DISK_IMG" || fail IMAGE CONVERT_FAILED "$DISK_IMG"
            rm -f /tmp/resolute.img
            log INFO IMAGE "Ubuntu 26.04 LTS ready on Drime"
          fi

          VM_CORES="${INPUT_VM_CORES:-2}"
          VM_THREADS="${INPUT_VM_THREADS:-2}"
          VM_RAM_GB="${INPUT_VM_RAM_GB:-16}"
          VNC_BIND="${INPUT_VNC_BIND:-0.0.0.0}"
          VM_CPUS=$((VM_CORES * VM_THREADS))

          log INFO VM "Booting QEMU directly from Drime (No Cloud-Init, No User/Pwd set)"
          
          # Boot directly from the Drime mount point. cache=writeback is mandatory for FUSE/Object storage
          qemu-system-x86_64 \
            -name drime-vm \
            -machine q35,accel=kvm \
            -cpu host \
            -smp "$VM_CPUS,cores=$VM_CORES,threads=$VM_THREADS" \
            -m "${VM_RAM_GB}G" \
            -drive file="$DISK_IMG",format=raw,if=virtio,cache=writeback,discard=unmap \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -vnc "${VNC_BIND}:0" \
            -pidfile "$PID_FILE" \
            -daemonize || fail VM QEMU_START_FAILED qemu

          for i in {1..30}; do
            ss -ltn 2>/dev/null | grep -q ':5900 ' && break
            sleep 1
          done

          log INFO VM "VM_RUNNING vcpu=$VM_CPUS ram=${VM_RAM_GB}G vnc=${VNC_BIND}:5900 netbird=${NETBIRD_IP:-unknown}"
          log INFO ACCESS "VNC netbird: ${NETBIRD_IP:-unknown}:5900"
          log INFO STORAGE "OS is reading/writing directly to $DISK_IMG on Drime"

          while true; do
            [[ -f "$PID_FILE" ]] && kill -0 "$(cat "$PID_FILE")" 2>/dev/null || fail VM PROCESS_DIED "$PID_FILE"
            log INFO HEARTBEAT "vm=running storage=drime_direct netbird=${NETBIRD_IP:-unknown}"
            sleep 30
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drime-logs-${{ github.run_id }}
          path: /var/log/drime
          if-no-files-found: warn
