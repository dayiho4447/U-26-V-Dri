name: DRIME-LIVE-VPS

on:
  workflow_dispatch:

concurrency:
  group: drime-live-vps
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LOG: /var/log/drime
      NBD_SOCK: /tmp/drime-nbd.sock
      PLUGIN: /opt/drime-nbd.py
      RCLONE_CFG: /root/.config/rclone/drime.conf
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      DRIME_TOKEN: ${{ secrets.DRIME }}
    steps:
      - name: Write NBD plugin
        shell: bash
        run: |
          sudo mkdir -p /opt
          sudo tee /opt/drime-nbd.py > /dev/null << 'PYEOF'
          import nbdkit
          import subprocess
          import threading
          import io

          CHUNK = 4 * 1024 * 1024
          DISK_SIZE = 20 * 1024 * 1024 * 1024
          REMOTE = "drime0"
          PREFIX = "vm-disk/chunk-"
          CFG = "/root/.config/rclone/drime.conf"
          lock = threading.Lock()

          def open(readonly):
              return {}

          def close(h):
              pass

          def get_size(h):
              return DISK_SIZE

          def _read_chunk(ci):
              name = "%s%s%08d.bin" % (REMOTE, PREFIX, ci)
              proc = subprocess.Popen(["rclone", "--config", CFG, "cat", name],
                                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              data, _ = proc.communicate()
              if proc.returncode != 0 or not data:
                  return bytearray(CHUNK)
              data = bytearray(data)
              if len(data) < CHUNK:
                  data += b"\x00" * (CHUNK - len(data))
              return data

          def _write_chunk(ci, data):
              tmp = "/tmp/wb-%08d.bin" % ci
              with io.open(tmp, "wb") as f:
                  f.write(bytes(data))
              name = "%s%s%08d.bin" % (REMOTE, PREFIX, ci)
              subprocess.run(["rclone", "--config", CFG, "copyto", tmp, name],
                             stderr=subprocess.DEVNULL)
              subprocess.run(["rm", "-f", tmp], stderr=subprocess.DEVNULL)

          def pread(h, count, offset, flags):
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              out = bytearray()
              for ci in range(sc, ec + 1):
                  data = _read_chunk(ci)
                  s = max(0, offset - ci * CHUNK)
                  e = min(CHUNK, offset + count - ci * CHUNK)
                  out.extend(data[s:e])
              return bytes(out[:count])

          def pwrite(h, buf, offset, flags):
              count = len(buf)
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              for ci in range(sc, ec + 1):
                  with lock:
                      data = _read_chunk(ci)
                      s = max(0, offset - ci * CHUNK)
                      bs = max(0, ci * CHUNK - offset)
                      e = min(CHUNK, offset + count - ci * CHUNK)
                      wl = e - bs
                      if wl > 0:
                          data[s:s + wl] = buf[bs:bs + wl]
                      _write_chunk(ci, data)

          def flush(h, flags):
              pass

          def trim(h, count, offset, flags):
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              for ci in range(sc, ec + 1):
                  name = "%s%s%08d.bin" % (REMOTE, PREFIX, ci)
                  subprocess.run(["rclone", "--config", CFG, "delete", name],
                                 stderr=subprocess.DEVNULL)

          def can_fua(h):
              return nbdkit.FUA_NATIVE
          PYEOF

      - name: Engine
        shell: bash
        run: |
          if [[ "$(id -u)" != "0" ]]; then
            exec sudo -E env PATH="$PATH" HOME="/root" bash "$0"
          fi
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          LOG="${LOG:-/var/log/drime}"
          NBD_SOCK="${NBD_SOCK:-/tmp/drime-nbd.sock}"
          PLUGIN="${PLUGIN:-/opt/drime-nbd.py}"
          RCLONE_CFG="${RCLONE_CFG:-/root/.config/rclone/drime.conf}"

          mkdir -p "$LOG" "$(dirname "$RCLONE_CFG")"
          exec > >(tee -a "$LOG/engine.log") 2>&1

          log() { printf '[%s] [%s] %s\n' "$(date -u +%FT%TZ)" "$1" "$2"; }
          fail() { log ERROR "FAILED [$1] $2"; exit 1; }
          trap 'log ERROR "TRAP line=$LINENO cmd=$BASH_COMMAND rc=$?"' ERR

          cleanup() {
            log SHUTDOWN "Graceful shutdown"
            if [[ -f /run/drime-vm.pid ]]; then kill "$(cat /run/drime-vm.pid)" 2>/dev/null || true; fi
            pkill -f "nbdkit python" 2>/dev/null || true
            log SHUTDOWN "All data safe on Drime"
          }
          trap cleanup EXIT

          log INIT "DRIME LIVE VPS ENGINE (Ubuntu 26.04 LTS resolute)"

          apt-get update -y || fail PKG APT_UPDATE
          apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils nbdkit nbdkit-plugin-python python3 jq curl ca-certificates iproute2 kmod fuse3 socat || fail PKG INSTALL

          curl --retry 5 -fsSL https://rclone.org/install.sh | bash || fail RCLONE INSTALL
          log RCLONE "$(rclone version | head -n1)"

          modprobe kvm 2>/dev/null || true
          modprobe kvm_intel 2>/dev/null || modprobe kvm_amd 2>/dev/null || true
          [[ -e /dev/kvm ]] || fail KVM NO_DEVICE
          chmod 666 /dev/kvm || fail KVM PERMISSION
          log KVM "KVM ready"

          [[ -n "${NETBIRD_SETUP_KEY:-}" ]] || fail NETBIRD MISSING_SETUP_KEY
          curl --retry 5 -fsSL https://pkgs.netbird.io/install.sh | sh || fail NETBIRD INSTALL
          netbird up --setup-key "$NETBIRD_SETUP_KEY" || netbird up --setup-key "$NETBIRD_SETUP_KEY" || fail NETBIRD UP
          NB_IP=$(hostname -I | awk '{print $1}')
          log NETBIRD "connected ip=$NB_IP"

          [[ -n "${DRIME_TOKEN:-}" ]] || fail DRIME MISSING_TOKEN
          rclone config create drime0 drime access_token="$DRIME_TOKEN" --config "$RCLONE_CFG" >/dev/null || fail DRIME CONFIG
          log DRIME "rclone configured"

          rclone delete drime0:vm-disk/ --include "*.tmp" --config "$RCLONE_CFG" 2>/dev/null || true
          log DRIME "orphan cleanup done"

          IMG_URL="https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img"
          if [[ ! -f /tmp/base.qcow2 ]]; then
            curl -fL --retry 5 -o /tmp/base.qcow2 "$IMG_URL" || fail IMAGE DOWNLOAD
          fi
          log IMAGE "resolute 26.04 LTS downloaded"

          qemu-img convert -f qcow2 -O raw /tmp/base.qcow2 /tmp/disk.raw || fail IMAGE CONVERT
          RAWSIZE=$(stat -c%s /tmp/disk.raw)
          log IMAGE "raw size=$RAWSIZE"

          rm -rf /tmp/chunks && mkdir -p /tmp/chunks
          split -b 4M -d -a 8 /tmp/disk.raw /tmp/chunks/chunk- || fail IMAGE SPLIT
          Z=0
          shopt -s nullglob
          for f in /tmp/chunks/chunk-*; do
            if cmp -s -n 4194304 /dev/zero "$f"; then rm -f "$f"; Z=$((Z+1)); fi
          done
          log IMAGE "chunks ready skipped_zero=$Z"

          rclone copy /tmp/chunks/ drime0:vm-disk/ --config "$RCLONE_CFG" --transfers 32 --checkers 32 --stats 30s --stats-one-line || fail DRIME UPLOAD
          log DRIME "Parallel upload complete"

          rm -f "$NBD_SOCK"
          nbdkit python "$PLUGIN" --unix "$NBD_SOCK" --foreground --threads=16 >>"$LOG/nbdkit.log" 2>&1 &
          NBD_PID=$!
          for i in $(seq 1 30); do [[ -S "$NBD_SOCK" ]] && break; sleep 1; done
          [[ -S "$NBD_SOCK" ]] || fail NBD NO_SOCKET
          log NBD "nbdkit running threads=16"

          qemu-system-x86_64 \
            -name drime-vm \
            -machine q35,accel=kvm \
            -cpu host \
            -smp 4,cores=2,threads=2 \
            -m 16G \
            -blockdev node-name=drime0,driver=raw,file.driver=nbd,file.server.type=unix,file.server.path=${NBD_SOCK},file.reconnect-delay=5 \
            -device virtio-blk-pci,drive=drime0,bootindex=1 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -vnc 0.0.0.0:0 \
            -pidfile /run/drime-vm.pid \
            -daemonize || fail VM QEMU_START
          log VM "VM running vnc=0.0.0.0:5900 netbird=$NB_IP"

          while true; do
            sleep 30
            if [[ ! -f /run/drime-vm.pid ]] || ! kill -0 "$(cat /run/drime-vm.pid)" 2>/dev/null; then
              fail VM DIED
            fi
            log HEARTBEAT "vm=running netbird=$NB_IP"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drime-logs-${{ github.run_id }}
          path: /var/log/drime
          if-no-files-found: warn
