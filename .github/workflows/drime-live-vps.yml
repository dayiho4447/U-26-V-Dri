name: DLIVE1 Enterprise Storage Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 curl qemu-utils qemu-system-x86 wget ca-certificates jq net-tools xvfb x11vnc xdotool x11-utils

    - name: Install latest rclone
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Install NetBird
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key "${{ secrets.NETBIRD_SETUP_KEY }}" || { echo "NetBird failed"; exit 1; }
        sudo netbird status

    - name: Configure Drime accounts
      env:
        DRIME: ${{ secrets.DRIME }}
        DRIME_ACCOUNTS: ${{ secrets.DRIME_ACCOUNTS }}
      run: |
        set +e
        python3 - <<'PY'
        import os, subprocess, sys
        accounts = []
        d = os.environ.get("DRIME", "").strip()
        if d: accounts.append(("DRIME", d, 20*1024**3))
        batch = os.environ.get("DRIME_ACCOUNTS", "") or ""
        for i, line in enumerate(batch.splitlines(), 1):
            line = line.strip()
            if not line: continue
            parts = line.split()
            if len(parts) >= 3: name, tok, size = parts[0], parts[1], int(parts[2])
            elif len(parts) == 2: name, tok, size = parts[0], parts[1], 20*1024**3
            else: name, tok, size = f"DRIME{i}", parts[0], 20*1024**3
            accounts.append((name, tok, size))
        if not accounts:
            print("ERROR: No Drime accounts!", file=sys.stderr); sys.exit(1)
        with open("/tmp/dlive_accounts", "w") as out:
            for name, tok, size in accounts:
                subprocess.run(["rclone", "config", "delete", name], capture_output=True)
                c = subprocess.run(["rclone", "config", "create", name, "drime", f"access_token={tok}"], capture_output=True)
                if c.returncode == 0:
                    out.write(f"{name} {size}\n"); print(f"✓ Account: {name} ({size//1024**3}GB)")
        PY
        [ -s /tmp/dlive_accounts ] || { echo "FATAL: no accounts"; exit 1; }
        cat /tmp/dlive_accounts

    - name: Start rclone rcd daemon
      run: |
        set +e
        nohup rclone rcd --rc-addr 127.0.0.1:5572 --rc-no-auth \
          --transfers 32 --checkers 32 --retries 2 --contimeout 10s --timeout 120s > /tmp/rcd.log 2>&1 &
        for i in $(seq 1 30); do
          curl -s -m 2 http://127.0.0.1:5572/rc/noop >/dev/null && { echo "✓ rcd up"; exit 0; }
          sleep 1
        done
        echo "⚠ rcd not up"; cat /tmp/rcd.log

    - name: Write DLIVE1 engine
      run: |
        cat > dlive.py <<'PYEOF'
        #!/usr/bin/env python3
        import os, json, zlib, subprocess, time, argparse, sys, threading, queue, http.client
        from pathlib import Path
        from collections import defaultdict

        VERSION = "1.0"
        B = 512 * 1024
        RC_FLAGS = ["--retries","2","--low-level-retries","2","--contimeout","10s","--timeout","120s"]

        def rc(*args, timeout=600):
            try: return subprocess.run(["rclone"]+list(args)+RC_FLAGS, capture_output=True, timeout=timeout)
            except Exception as e:
                print(f"[RC ERROR] {e}", flush=True)
                return subprocess.CompletedProcess(args, 1, b"", str(e).encode())

        def rc_http(op, params, timeout=300):
            conn = http.client.HTTPConnection("127.0.0.1", 5572, timeout=timeout)
            conn.request("POST", "/"+op, body=json.dumps(params), headers={"Content-Type":"application/json"})
            resp = conn.getresponse(); data = resp.read(); conn.close()
            if resp.status != 200: raise RuntimeError(f"rc {op} -> {resp.status}: {data[:200]}")
            return json.loads(data) if data else {}

        class Engine:
            def __init__(s, accounts_file, cache):
                s.cache = Path(cache); s.cache.mkdir(parents=True, exist_ok=True)
                s.blocks_dir = s.cache / "blocks"; s.blocks_dir.mkdir(exist_ok=True)
                s.accounts = []
                for line in open(accounts_file):
                    p = line.split()
                    if len(p) >= 2: s.accounts.append([p[0], int(p[1])])
                if not s.accounts: raise RuntimeError("No accounts")
                s.anchor = s.accounts[0][0]
                s.blk_locks = {}; s.glock = threading.Lock()
                s.up_q = queue.Queue(); s.up_set = set(); s.up_lock = threading.Lock()
                s.running = True

            def log(s, *a): print("[DLIVE]", *a, flush=True)

            def block_lock(s, cid):
                with s.glock:
                    if cid not in s.blk_locks: s.blk_locks[cid] = threading.Lock()
                    return s.blk_locks[cid]

            def load(s):
                sb = s.cache / "superblock.json"
                r = rc("copyto", f"{s.anchor}:dlive/v1/superblock.json", str(sb))
                if r.returncode == 0 and sb.exists():
                    try:
                        s.accounts = json.load(open(sb))["accounts"]
                        s.log(f"Loaded existing: {len(s.accounts)} accounts")
                    except Exception: s._create_superblock()
                else:
                    s.log("Creating new disk..."); s._create_superblock()
                s.ranges = []; off = 0
                for name, size in s.accounts:
                    nb = size // B; s.ranges.append((name, off, off + nb)); off += nb
                s.size = off * B
                s.log(f"Disk: {s.size // 1024**3}GB ({off} blocks)")

            def _create_superblock(s):
                sb = {"version":VERSION,"magic":"DLIVE1","block_size":B,"accounts":s.accounts,"created":int(time.time())}
                with open(s.cache / "superblock.json", "w") as f: json.dump(sb, f)
                rc("copyto", str(s.cache / "superblock.json"), f"{s.anchor}:dlive/v1/superblock.json")

            def acct_for(s, cid):
                for name, a, b in s.ranges:
                    if a <= cid < b: return name, cid - a
                return None, None

            def block_path(s, cid): return s.blocks_dir / f"{cid:08d}.blk"

            def _fetch_block(s, cid):
                name, lid = s.acct_for(cid)
                if name is None: return None
                tmp = str(s.block_path(cid)) + ".tmp"
                ok = False
                try:
                    rc_http("operations/copyfile", {"srcFs": f"{name}:dlive/v1/blocks", "srcRemote": f"{lid:08d}.gz", "dstFs": "", "dstRemote": tmp})
                    ok = os.path.exists(tmp)
                except Exception:
                    ok = rc("copyto", f"{name}:dlive/v1/blocks/{lid:08d}.gz", tmp).returncode == 0 and os.path.exists(tmp)
                if ok:
                    try:
                        d = zlib.decompress(open(tmp,"rb").read()); os.unlink(tmp); return d
                    except Exception:
                        try: os.unlink(tmp)
                        except Exception: pass
                return None

            def _write_block_local(s, cid, data):
                with s.block_lock(cid): s.block_path(cid).write_bytes(data)

            def remote_cids(s):
                cids = []
                for name, s0, e0 in s.ranges:
                    try:
                        r = rc_http("operations/list", {"fs": f"{name}:dlive/v1/blocks"})
                        for item in r.get("list", []):
                            n = item.get("Name", "")
                            if n.endswith(".gz"):
                                try: cids.append(s0 + int(n.split(".")[0]))
                                except Exception: pass
                    except Exception:
                        rr = rc("lsf", f"{name}:dlive/v1/blocks/", "--files-only")
                        if rr.returncode == 0:
                            for ln in rr.stdout.decode().split():
                                if ln.endswith(".gz"):
                                    try: cids.append(s0 + int(ln.split(".")[0]))
                                    except Exception: pass
                return cids

            def restore(s, out):
                ids = s.remote_cids()
                s.log(f"Restoring {len(ids)} blocks...")
                fd = os.open(out, os.O_RDWR | os.O_CREAT, 0o644)
                os.ftruncate(fd, s.size)
                done = 0
                for cid in sorted(ids):
                    d = s._fetch_block(cid)
                    if d is None: continue
                    if len(d) < B: d += b"\x00" * (B - len(d))
                    if any(d): os.pwrite(fd, d, cid * B)
                    s._write_block_local(cid, d)
                    done += 1
                os.close(fd)
                s.log(f"Restore done: {done} blocks")

            def start_uploaders(s):
                for i in range(8): threading.Thread(target=s._uploader, daemon=True).start()

            def _uploader(s):
                while s.running:
                    cid = s.up_q.get(); batch = [cid]; dl = time.time() + 0.05
                    while len(batch) < 64:
                        try: batch.append(s.up_q.get(timeout=max(0.005, dl - time.time())))
                        except queue.Empty: break
                    by = defaultdict(list)
                    for c in batch:
                        p = s.block_path(c)
                        if not p.exists(): continue
                        d = p.read_bytes()
                        if not any(d): continue
                        name, lid = s.acct_for(c)
                        if name: by[name].append((lid, d))
                    for name, items in by.items():
                        stage = s.cache / f"stage_{threading.get_ident()}"; stage.mkdir(exist_ok=True)
                        for lid, d in items:
                            open(stage / f"{lid:08d}.gz", "wb").write(zlib.compress(d, 1))
                        ok = False
                        try:
                            rc_http("sync/copy", {"srcFs": str(stage), "dstFs": f"{name}:dlive/v1/blocks", "_config": {"Transfers": 32}})
                            ok = True
                        except Exception:
                            ok = rc("copy", str(stage), f"{name}:dlive/v1/blocks/", "--transfers","32").returncode == 0
                        if ok: s.log(f"UPLOADED {len(items)} blocks to {name}")
                        else:
                            s.log(f"UPLOAD FAILED {name}")
                            base = next((a for nm, a, b in s.ranges if nm == name), None)
                            if base is not None:
                                for lid, _ in items:
                                    with s.up_lock: s.up_set.add(base + lid); s.up_q.put(base + lid)
                        for f in stage.glob("*"):
                            try: f.unlink()
                            except Exception: pass
                    with s.up_lock:
                        for c in batch: s.up_set.discard(c)

            def write_changed(s, off, data):
                changed = 0; pos = 0; n = len(data)
                while pos < n:
                    o = off + pos; cid = o // B; co = o % B; k = min(B - co, n - pos)
                    with s.block_lock(cid):
                        p = s.block_path(cid)
                        cur = p.read_bytes() if p.exists() else None
                        if cur is None: cur = s._fetch_block(cid) or b"\x00" * B
                        if len(cur) < B: cur += b"\x00" * (B - len(cur))
                        seg = data[pos:pos + k]
                        if cur[co:co + k] != seg:
                            cur = bytearray(cur); cur[co:co + k] = seg
                            s._write_block_local(cid, bytes(cur))
                            with s.up_lock:
                                if cid not in s.up_set: s.up_set.add(cid); s.up_q.put(cid)
                            changed += 1
                    pos += k
                return changed

            def push_once(s, overlay):
                try:
                    r = subprocess.run(["qemu-img","map","-U","--output=json",overlay], capture_output=True, timeout=120)
                    if r.returncode != 0:
                        s.log(f"map FAILED: {r.stderr.decode()[:300]}"); return 0
                    ext = json.loads(r.stdout)
                    ov = [ex for ex in ext if ex.get("data") and not ex.get("zero")
                          and ex.get("filename","") and "base.raw" not in ex.get("filename","")]
                    s.log(f"overlay has {len(ov)} written extents")
                    pushed = 0
                    for ex in ov:
                        with open(overlay, "rb") as f:
                            f.seek(ex["offset"]); d = f.read(ex["length"])
                        pushed += s.write_changed(ex["start"], d)
                    if pushed: s.log(f"PUSHED {pushed} changed blocks")
                    return pushed
                except Exception as e:
                    s.log(f"push ERROR: {e}"); return 0

            def poll_loop(s, overlay, poll_interval):
                s.start_uploaders()
                s.log(f"DAEMON UP: poll every {poll_interval}s")
                last_mtime = 0; last_size = 0; last_push = 0
                while s.running:
                    try:
                        st = os.stat(overlay)
                        mtime = st.st_mtime; size = st.st_size
                        if mtime != last_mtime or size != last_size:
                            s.log(f"change detected (mtime={mtime}, size={size}), pushing...")
                            s.push_once(overlay)
                            last_mtime = mtime; last_size = size; last_push = time.time()
                        elif time.time() - last_push > 30:
                            # safety: push at least every 30s even if no mtime change
                            s.push_once(overlay)
                            last_push = time.time()
                    except Exception as e:
                        s.log(f"poll error: {e}")
                    time.sleep(poll_interval)

            def flush(s, timeout=30):
                t0 = time.time()
                while time.time() - t0 < timeout:
                    with s.up_lock:
                        if not s.up_set and s.up_q.empty(): break
                    time.sleep(0.05)

        if __name__ == "__main__":
            ap = argparse.ArgumentParser()
            ap.add_argument("cmd")
            ap.add_argument("--accounts", required=True)
            ap.add_argument("--cache", required=True)
            ap.add_argument("--out")
            ap.add_argument("--overlay")
            ap.add_argument("--poll", type=float, default=0.5)
            ap.add_argument("--flushtime", type=int, default=30)
            a = ap.parse_args()
            e = Engine(a.accounts, a.cache)
            e.load()
            if a.cmd == "restore":
                e.restore(a.out)
            elif a.cmd == "daemon":
                e.poll_loop(a.overlay, a.poll)
            elif a.cmd == "pushonce":
                e.start_uploaders()
                e.push_once(a.overlay)
                e.flush(a.flushtime)
        PYEOF
        echo "✓ Engine written"

    - name: Start Xvfb
      run: |
        sudo pkill -f Xvfb || true; sleep 1
        sudo Xvfb :1 -screen 0 1920x1080x24 & sleep 2
        echo "✓ Xvfb ready"

    - name: Restore disk
      run: |
        set +e
        CACHE=/var/lib/dlive
        if df -P /mnt 2>/dev/null | awk 'NR==2{exit !($4>30000000)}'; then CACHE=/mnt/dlive; fi
        sudo mkdir -p "$CACHE"; sudo chown -R runner:runner "$CACHE"
        echo "$CACHE" > /tmp/dlive_cache
        python3 -u dlive.py restore --accounts /tmp/dlive_accounts --cache "$CACHE" --out "$CACHE/base.raw"

    - name: Download ISO
      run: |
        CACHE=$(cat /tmp/dlive_cache)
        ISO="$CACHE/ubuntu.iso"
        if [ ! -f "$ISO" ]; then
          URL1="https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso"
          URL2="https://releases.ubuntu.com/24.04/ubuntu-24.04.3-live-server-amd64.iso"
          wget -q --tries=3 -O "$ISO" "$URL1" || wget -q --tries=3 -O "$ISO" "$URL2" || { echo "✗ ISO failed"; exit 1; }
        fi
        echo "$ISO" > /tmp/dlive_iso
        ls -lh "$ISO"

    - name: Boot VM + persistent daemon + perfect-fit VNC
      run: |
        set +e
        CACHE=$(cat /tmp/dlive_cache)
        ISO=$(cat /tmp/dlive_iso)
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        [ -e /dev/kvm ] && { sudo chmod 666 /dev/kvm; ACCEL="-enable-kvm"; CPU="-cpu host"; } || { ACCEL=""; CPU="-cpu qemu64"; }

        qemu-img create -f qcow2 -F raw -b "$CACHE/base.raw" "$CACHE/overlay.qcow2"

        # PERSISTENT DAEMON - never dies, polls every 0.5s
        python3 -u dlive.py daemon --accounts /tmp/dlive_accounts --cache "$CACHE" --overlay "$CACHE/overlay.qcow2" --poll 0.5 > /tmp/livepush.log 2>&1 &
        DAEMON_PID=$!
        echo "✓ Daemon PID=$DAEMON_PID"

        sudo -E DISPLAY=:1 SDL_VIDEO_WINDOW_POS=0,0 qemu-system-x86_64 $ACCEL -machine pc $CPU \
          -smp 4,sockets=1,cores=2,threads=2 -m 16384 \
          -drive file="$CACHE/overlay.qcow2",format=qcow2,if=none,id=d0,cache=writeback \
          -device ide-hd,drive=d0 \
          -cdrom "$ISO" \
          -boot order=cd \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -serial stdio \
          -display sdl > /tmp/vm.log 2>&1 &
        QPID=$!

        # Wait for QEMU window
        WID=""
        for i in $(seq 1 30); do
          WID=$(sudo DISPLAY=:1 xdotool search --name -i "qemu" 2>/dev/null | head -1)
          [ -n "$WID" ] && break
          sleep 1
        done

        sudo pkill -f x11vnc || true; sleep 1

        if [ -n "$WID" ]; then
          # Get INNER geometry (skip title bar + borders)
          GEO=$(sudo DISPLAY=:1 xwininfo -id "$WID" | grep -E "(Width|Height|Absolute upper-left)" | awk '{print $NF}' | tr '\n' ' ')
          read -r X Y W H <<< "$GEO"
          echo "Window: inner=$W x $H at $X,$Y"
          # Clip to inner area - removes title bar and borders
          sudo x11vnc -display :1 -clip "${W}x${H}+${X}+${Y}" -forever -nopw -rfbport 5900 -shared -bg -o /tmp/x11vnc.log -scale 1 -cursor none
        else
          echo "⚠ Window not found, sharing full desktop"
          sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg -o /tmp/x11vnc.log
        fi
        sleep 2
        echo "=================================================="
        echo "VNC: $NB_IP:5900 (perfect fit, no title bar)"
        echo "Install: entire disk, NO LVM"
        echo "Daemon running forever, polls every 0.5s"
        echo "=================================================="

        ( while kill -0 $QPID 2>/dev/null; do
            sleep 15
            echo "--- daemon log ---"; tail -n 6 /tmp/livepush.log 2>/dev/null
          done ) &

        wait $QPID
        echo "VM stopped - final sync..."
        python3 -u dlive.py pushonce --accounts /tmp/dlive_accounts --cache "$CACHE" --overlay "$CACHE/overlay.qcow2" --flushtime 60
