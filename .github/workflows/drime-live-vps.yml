name: DRIME-LIVE-VPS

on:
  workflow_dispatch:
    inputs:
      vm_cores:
        description: "CPU cores"
        default: "2"
      vm_threads:
        description: "Threads per core"
        default: "2"
      vm_ram_gb:
        description: "RAM in GB"
        default: "16"
      vnc_bind:
        description: "VNC bind"
        default: "0.0.0.0"

concurrency:
  group: drime-live-vps
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LOG: /var/log/drime
      NBD_SOCK: /tmp/drime-nbd.sock
      PLUGIN: /opt/drime-nbd.py
      SIZE_FILE: /opt/drime-size
      WARM_DONE: /tmp/warm-done
      RCLONE_CFG: /root/.config/rclone/drime.conf
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      DRIME_TOKEN: ${{ secrets.DRIME }}
    steps:
      - name: Write NBD plugin
        shell: bash
        run: |
          sudo mkdir -p /opt
          sudo tee /opt/drime-nbd.py > /dev/null << 'PYEOF'
          import nbdkit, subprocess, os, threading
          from collections import OrderedDict
          from concurrent.futures import ThreadPoolExecutor

          _open = open
          CHUNK = 4 * 1024 * 1024
          try:
              DISK_SIZE = int(_open("/opt/drime-size").read().strip())
          except Exception:
              DISK_SIZE = 20 * 1024 * 1024 * 1024
          REMOTE = "drime0"
          PREFIX = "vm-disk/chunk-"
          CFG = "/root/.config/rclone/drime.conf"
          WARM_DONE = "/tmp/warm-done"

          lock = threading.Lock()
          cache = OrderedDict()
          CACHE_MAX = 512

          def _rc(*a):
              return subprocess.run(["rclone", "--config", CFG] + list(a), capture_output=True)

          def fetch(ci):
              with lock:
                  if ci in cache:
                      cache.move_to_end(ci)
                      return cache[ci]
              p = _rc("cat", "%s%08d.bin" % (PREFIX, ci))
              if p.returncode == 0 and p.stdout:
                  d = bytearray(p.stdout)
                  if len(d) < CHUNK:
                      d += b"\x00" * (CHUNK - len(d))
              else:
                  d = bytearray(CHUNK)
              with lock:
                  cache[ci] = d
                  cache.move_to_end(ci)
                  while len(cache) > CACHE_MAX:
                      cache.popitem(last=False)
              return d

          def prewarm():
              total = (DISK_SIZE + CHUNK - 1) // CHUNK
              with ThreadPoolExecutor(max_workers=8) as ex:
                  list(ex.map(fetch, range(min(128, total))))
              with _open(WARM_DONE, "w") as f:
                  f.write("ok")
              i = 128
              while i < total:
                  fetch(i)
                  i += 1

          threading.Thread(target=prewarm, daemon=True).start()

          def open(readonly):
              return {}

          def get_size(h):
              return DISK_SIZE

          def pread(h, count, offset, flags):
              out = bytearray()
              c0 = offset // CHUNK
              c1 = (offset + count - 1) // CHUNK
              for ci in range(c0, c1 + 1):
                  d = fetch(ci)
                  s = max(0, offset - ci * CHUNK)
                  e = min(CHUNK, offset + count - ci * CHUNK)
                  out += d[s:e]
              return bytes(out[:count])

          def pwrite(h, buf, offset, flags):
              count = len(buf)
              c0 = offset // CHUNK
              c1 = (offset + count - 1) // CHUNK
              for ci in range(c0, c1 + 1):
                  d = fetch(ci)
                  s = max(0, offset - ci * CHUNK)
                  bs = max(0, ci * CHUNK - offset)
                  e = min(CHUNK, offset + count - ci * CHUNK)
                  d[s:e] = buf[bs:bs + (e - s)]
                  tmp = "/tmp/wb-%08d.bin" % ci
                  with _open(tmp, "wb") as f:
                      f.write(bytes(d))
                  _rc("copyto", tmp, "%s%08d.bin" % (PREFIX, ci))
                  os.unlink(tmp)

          def flush(h, flags):
              pass
          PYEOF

      - name: Engine
        shell: bash
        run: |
          if [[ "$(id -u)" != "0" ]]; then
            exec sudo -E env PATH="$PATH" HOME="/root" bash "$0"
          fi
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          LOG="${LOG:-/var/log/drime}"
          NBD_SOCK="${NBD_SOCK:-/tmp/drime-nbd.sock}"
          PLUGIN="${PLUGIN:-/opt/drime-nbd.py}"
          SIZE_FILE="${SIZE_FILE:-/opt/drime-size}"
          WARM_DONE="${WARM_DONE:-/tmp/warm-done}"
          RCLONE_CFG="${RCLONE_CFG:-/root/.config/rclone/drime.conf}"

          mkdir -p "$LOG" "$(dirname "$RCLONE_CFG")"
          rm -f "$WARM_DONE"
          exec > >(tee -a "$LOG/engine.log") 2>&1

          log(){ printf '[%s] [%s] %s\n' "$(date -u +%FT%TZ)" "$1" "$2"; }
          fail(){ log ERROR "FAILED [$1] $2"; exit 1; }
          trap 'log ERROR "TRAP line=$LINENO cmd=$BASH_COMMAND rc=$?"' ERR
          trap 'log SHUTDOWN "graceful"; pkill -f "nbdkit python" 2>/dev/null || true' EXIT

          log INIT "DRIME LIVE VPS - pre-warm boot fix"

          apt-get update -y || fail PKG APT_UPDATE
          apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils \
            nbdkit nbdkit-plugin-python python3 jq curl ca-certificates \
            iproute2 kmod fuse3 socat || fail PKG INSTALL

          curl --retry 5 -fsSL https://rclone.org/install.sh | bash || fail RCLONE INSTALL
          log RCLONE "$(rclone version | head -n1)"

          modprobe kvm 2>/dev/null || true
          [[ -e /dev/kvm ]] || fail KVM NO_DEVICE
          chmod 666 /dev/kvm
          log KVM "ready"

          [[ -n "${NETBIRD_SETUP_KEY:-}" ]] || fail NETBIRD NO_KEY
          curl --retry 5 -fsSL https://pkgs.netbird.io/install.sh | sh || fail NETBIRD INSTALL
          netbird up --setup-key "$NETBIRD_SETUP_KEY" || netbird up --setup-key "$NETBIRD_SETUP_KEY" || fail NETBIRD UP
          NB_IP=$(hostname -I | awk '{print $1}')
          log NETBIRD "connected ip=$NB_IP"

          [[ -n "${DRIME_TOKEN:-}" ]] || fail DRIME NO_KEY
          rclone config create drime0 drime access_token="$DRIME_TOKEN" --config "$RCLONE_CFG" >/dev/null || fail DRIME CONFIG
          rclone delete drime0:vm-disk/ --include "*.tmp" --config "$RCLONE_CFG" 2>/dev/null || true

          IMG=/tmp/base.qcow2
          RAW=/tmp/base.raw
          if rclone cat drime0:vm-disk/chunk-00000000.bin --config "$RCLONE_CFG" >/dev/null 2>&1; then
            RAWSIZE=$(rclone cat drime0:vm-disk/__size__ --config "$RCLONE_CFG" 2>/dev/null || echo 0)
            log DRIME "existing disk found, skip upload"
          else
            curl -fL --retry 5 -o "$IMG" \
              https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img || fail IMAGE DOWNLOAD
            qemu-img convert -f qcow2 -O raw "$IMG" "$RAW" || fail IMAGE CONVERT
            RAWSIZE=$(stat -c%s "$RAW")
            rm -rf /tmp/chunks && mkdir -p /tmp/chunks
            split -b 4M -d -a 8 --additional-suffix=.bin "$RAW" /tmp/chunks/chunk- || fail IMAGE SPLIT
            Z=0
            shopt -s nullglob
            for f in /tmp/chunks/chunk-*.bin; do
              if cmp -s -n 4194304 /dev/zero "$f"; then rm -f "$f"; Z=$((Z+1)); fi
            done
            log IMAGE "chunks ready skipped_zero=$Z"
            rclone copy /tmp/chunks/ drime0:vm-disk/ --config "$RCLONE_CFG" \
              --transfers 32 --checkers 32 --stats 30s --stats-one-line || fail DRIME UPLOAD
            rm -rf /tmp/chunks
            echo "$RAWSIZE" | rclone rcat drime0:vm-disk/__size__ --config "$RCLONE_CFG" || true
            log DRIME "parallel upload complete"
          fi
          echo "$RAWSIZE" > "$SIZE_FILE"

          nbdkit python "$PLUGIN" --unix "$NBD_SOCK" --foreground --threads=16 \
            >>"$LOG/nbdkit.log" 2>&1 &
          NBD_PID=$!
          for i in $(seq 1 30); do [[ -S "$NBD_SOCK" ]] && break; sleep 1; done
          [[ -S "$NBD_SOCK" ]] || fail NBD NO_SOCKET
          log NBD "nbdkit running, pre-warming boot area..."

          for i in $(seq 1 240); do
            [[ -f "$WARM_DONE" ]] && break
            sleep 1
          done
          [[ -f "$WARM_DONE" ]] || fail NBD WARMUP_TIMEOUT
          log NBD "boot area warm - SeaBIOS will see instant disk"

          qemu-system-x86_64 \
            -name drime-vm \
            -machine q35,accel=kvm \
            -cpu host \
            -smp 4,cores=2,threads=2 \
            -m 16G \
            -blockdev node-name=drime0,driver=raw,file.driver=nbd,file.server.type=unix,file.server.path=$NBD_SOCK,file.reconnect-delay=5 \
            -device virtio-blk-pci,drive=drime0,bootindex=1 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -boot order=cn \
            -vnc 0.0.0.0:0 \
            -pidfile /run/drime-vm.pid \
            -daemonize || fail VM QEMU_START
          log VM "VM running vnc=0.0.0.0:5900 netbird=$NB_IP"

          while true; do
            sleep 30
            [[ -f /run/drime-vm.pid ]] && kill -0 "$(cat /run/drime-vm.pid)" 2>/dev/null || fail VM DIED
            log HEARTBEAT "vm=running netbird=$NB_IP"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drime-logs-${{ github.run_id }}
          path: /var/log/drime
          if-no-files-found: warn
