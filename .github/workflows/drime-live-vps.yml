name: DRIME-LIVE-VPS

on:
  workflow_dispatch:
    inputs:
      vm_cores:
        description: "CPU cores"
        default: "2"
      vm_threads:
        description: "Threads per core"
        default: "2"
      vm_ram_gb:
        description: "RAM in GB"
        default: "16"
      vnc_bind:
        description: "VNC bind address"
        default: "0.0.0.0"

concurrency:
  group: drime-live-vps
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LOG: /var/log/drime
      NBD_SOCK: /tmp/drime-nbd.sock
      RCLONE_CFG: /root/.config/rclone/drime.conf
      CACHE_DIR: /var/cache/drime-chunks
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      DRIME_TOKEN: ${{ secrets.DRIME }}
      INPUT_VM_CORES: 2
      INPUT_VM_THREADS: 2
      INPUT_VM_RAM_GB: 16
      INPUT_VNC_BIND: 0.0.0.0
    steps:
      - name: Write NBD plugin
        shell: bash
        run: |
          sudo mkdir -p /opt
          sudo tee /opt/drime-nbd.py > /dev/null << 'PYEOF'
          import nbdkit, subprocess, os, threading
          from collections import OrderedDict
          CHUNK = 4 * 1024 * 1024
          DISK_SIZE = 20 * 1024 * 1024 * 1024
          REMOTE = "drime0"
          PREFIX = "vm-disk/chunk-"
          CFG = "/root/.config/rclone/drime.conf"
          CACHE_DIR = "/var/cache/drime-chunks"
          os.makedirs(CACHE_DIR, exist_ok=True)
          lock = threading.Lock()
          ram = OrderedDict()
          RAM_MAX = 512
          dirty = set()
          dirty_lock = threading.Lock()

          def open(readonly): return {}
          def get_size(h): return DISK_SIZE

          def _cp(ci): return f"{CACHE_DIR}/{ci:08d}.bin"

          def _rclone(*a):
              return subprocess.run(["rclone","--config",CFG]+list(a), capture_output=True, timeout=120)

          def _get(ci):
              with lock:
                  if ci in ram:
                      ram.move_to_end(ci); return ram[ci]
              p = _cp(ci)
              if os.path.exists(p):
                  with open(p,"rb") as f: d = bytearray(f.read())
              else:
                  r = _rclone("cat", f"{PREFIX}{ci:08d}.bin")
                  if r.returncode != 0 or not r.stdout:
                      d = bytearray(CHUNK)
                  else:
                      d = bytearray(r.stdout)
                      if len(d) < CHUNK: d += b"\x00" * (CHUNK - len(d))
                  try:
                      with open(p+".tmp","wb") as f: f.write(d)
                      os.replace(p+".tmp", p)
                  except Exception: pass
              with lock:
                  ram[ci] = d; ram.move_to_end(ci)
                  while len(ram) > RAM_MAX: ram.popitem(last=False)
              return d

          def _flush_one(ci):
              with lock: d = bytes(ram.get(ci, bytearray(CHUNK)))
              _rclone("copyto", f"{CACHE_DIR}/{ci:08d}.bin", f"{PREFIX}{ci:08d}.bin")

          def flusher():
              import time
              while True:
                  time.sleep(2)
                  with dirty_lock: dd = sorted(dirty); dirty.clear()
                  for ci in dd: _flush_one(ci)

          threading.Thread(target=flusher, daemon=True).start()

          def pread(h, count, offset, flags):
              c0 = offset // CHUNK; c1 = (offset + count - 1) // CHUNK
              out = bytearray()
              for ci in range(c0, c1 + 1):
                  d = _get(ci)
                  s = max(0, offset - ci * CHUNK); e = min(CHUNK, offset + count - ci * CHUNK)
                  out += d[s:e]
              return bytes(out[:count])

          def pwrite(h, buf, offset, flags):
              count = len(buf); c0 = offset // CHUNK; c1 = (offset + count - 1) // CHUNK
              for ci in range(c0, c1 + 1):
                  d = bytearray(_get(ci))
                  s = max(0, offset - ci * CHUNK); bs = max(0, ci * CHUNK - offset)
                  e = min(CHUNK, offset + count - ci * CHUNK); wl = e - bs
                  if wl > 0: d[s:s+wl] = buf[bs:bs+wl]
                  with lock:
                      ram[ci] = d; ram.move_to_end(ci)
                      with dirty_lock: dirty.add(ci)

          def flush(h, flags):
              with dirty_lock: dd = sorted(dirty); dirty.clear()
              for ci in dd: _flush_one(ci)
          PYEOF

      - name: Engine
        shell: bash
        run: |
          if [[ "$(id -u)" != "0" ]]; then
            exec sudo -E env PATH="$PATH" HOME="/root" bash "$0"
          fi
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          LOG="${LOG:-/var/log/drime}"; NBD_SOCK="${NBD_SOCK:-/tmp/drime-nbd.sock}"
          RCLONE_CFG="${RCLONE_CFG:-/root/.config/rclone/drime.conf}"
          CACHE_DIR="${CACHE_DIR:-/var/cache/drime-chunks}"
          mkdir -p "$LOG" "$CACHE_DIR" "$(dirname "$RCLONE_CFG")"
          exec > >(tee -a "$LOG/engine.log") 2>&1
          log(){ printf '[%s] [%s] [%s]\n' "$(date -u +%FT%TZ)" "$1" "$2"; }
          fail(){ log ERROR "$1" "FAILED: $2"; exit 1; }
          trap 'log ERROR TRAP "line=$LINENO cmd=$BASH_COMMAND"' ERR

          log INIT "DRIME LIVE VPS ENGINE v2 (pre-warm + write-through)"

          apt-get update -y || fail PKG APT_UPDATE
          apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils ovmf socat \
            nbdkit nbdkit-plugin-python python3 jq curl ca-certificates iproute2 kmod fuse3 \
            || fail PKG INSTALL
          curl --retry 5 -fsSL https://rclone.org/install.sh | bash || fail RCLONE INSTALL
          log RCLONE "$(rclone version | head -1)"

          modprobe kvm 2>/dev/null || true
          [[ -e /dev/kvm ]] || fail KVM NO_DEVICE
          chmod 666 /dev/kvm
          log KVM "ready"

          [[ -n "${NETBIRD_SETUP_KEY:-}" ]] || fail NETBIRD NO_KEY
          curl --retry 5 -fsSL https://pkgs.netbird.io/install.sh | sh || fail NETBIRD INSTALL
          netbird up --setup-key "$NETBIRD_SETUP_KEY" || netbird up --setup-key "$NETBIRD_SETUP_KEY" || fail NETBIRD UP
          sleep 3

          # CORRECT NetBird IP: NetBird lives in 100.64.0.0/10 (or wt*/netbird* iface)
          NB_IP=$(ip -4 -o addr show | awk '{print $4}' | cut -d/ -f1 | awk -F. '$1==100 && $2>=64 && $2<=127 {print; exit}')
          if [[ -z "$NB_IP" ]]; then
            for ifc in wt0 wt1 netbird0 nb0; do
              NB_IP=$(ip -4 -o addr show "$ifc" 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | head -n1)
              [[ -n "$NB_IP" ]] && break
            done
          fi
          [[ -n "$NB_IP" ]] || NB_IP=$(hostname -I | awk '{print $1}')
          log NETBIRD "connected netbird_ip=$NB_IP"

          rclone config create drime0 drime access_token="$DRIME_TOKEN" --config "$RCLONE_CFG" >/dev/null || fail DRIME CONFIG
          log DRIME "rclone configured"
          rclone delete drime0:vm-disk/ --include "*.tmp" --config "$RCLONE_CFG" 2>/dev/null || true
          log DRIME "orphan cleanup done"

          curl -fL --retry 5 -o /tmp/base.qcow2 \
            https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img \
            || fail IMAGE DOWNLOAD
          log IMAGE "resolute 26.04 LTS downloaded"
          qemu-img convert -f qcow2 -O raw /tmp/base.qcow2 /tmp/disk.raw || fail IMAGE CONVERT
          log IMAGE "raw size=$(stat -c%s /tmp/disk.raw)"
          rm -rf /tmp/chunks && mkdir -p /tmp/chunks
          split -b 4M -d -a 8 /tmp/disk.raw /tmp/chunks/chunk- || fail IMAGE SPLIT
          rm -f /tmp/disk.raw
          for f in /tmp/chunks/chunk-*; do mv "$f" "$f.bin"; done
          Z=0; shopt -s nullglob
          for f in /tmp/chunks/chunk-*.bin; do
            if cmp -s -n 4194304 /dev/zero "$f"; then rm -f "$f"; Z=$((Z+1)); fi
          done
          log IMAGE "chunks ready skipped_zero=$Z"

          rclone copy /tmp/chunks/ drime0:vm-disk/ --config "$RCLONE_CFG" \
            --transfers 32 --checkers 32 --stats 30s --stats-one-line || fail DRIME UPLOAD
          rm -rf /tmp/chunks
          log DRIME "parallel upload complete (chunks=.bin)"

          # PRE-WARM: first 256 chunks (MBR+GPT+ESP+kernel) into local cache, 16-way parallel
          log WARMUP "pre-warming ESP region (256 chunks, 16x parallel)"
          export RCLONE_CFG
          seq -f "%08.0f" 0 255 | xargs -P 16 -I@ sh -c '
            [ -f "/var/cache/drime-chunks/@.bin" ] && exit 0
            rclone copyto --config "$RCLONE_CFG" "drime0:vm-disk/chunk-@.bin" "/var/cache/drime-chunks/@.bin.tmp" 2>/dev/null \
              && mv "/var/cache/drime-chunks/@.bin.tmp" "/var/cache/drime-chunks/@.bin" || true
          ' || true
          log WARMUP "pre-warm done cached=$(ls /var/cache/drime-chunks 2>/dev/null | wc -l)"

          # MBR signature verify (0x55AA) before boot
          SIG=$(head -c 512 /var/cache/drime-chunks/00000000.bin 2>/dev/null | tail -c 2 | od -An -tx1 | tr -d ' ')
          log VERIFY "mbr_signature=$SIG (expect 55aa)"

          # background warm of remaining chunks
          ( seq -f "%08.0f" 256 895 | xargs -P 16 -I@ sh -c '
              [ -f "/var/cache/drime-chunks/@.bin" ] && exit 0
              rclone copyto --config "$RCLONE_CFG" "drime0:vm-disk/chunk-@.bin" "/var/cache/drime-chunks/@.bin.tmp" 2>/dev/null \
                && mv "/var/cache/drime-chunks/@.bin.tmp" "/var/cache/drime-chunks/@.bin" || true
            ' ) &

          nbdkit python /opt/drime-nbd.py --unix "$NBD_SOCK" --threads 16 >>"$LOG/nbdkit.log" 2>&1 &
          for i in $(seq 1 30); do [[ -S "$NBD_SOCK" ]] && break; sleep 1; done
          [[ -S "$NBD_SOCK" ]] || fail NBD NO_SOCKET
          log NBD "nbdkit running threads=16"

          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd; OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          [[ -f "$OVMF_CODE" ]] || OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
          [[ -f "$OVMF_VARS" ]] || OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          [[ -f "$OVMF_CODE" && -f "$OVMF_VARS" ]] || fail UEFI NO_FIRMWARE
          cp -f "$OVMF_VARS" /tmp/OVMF_VARS.fd

          VM_CORES="${INPUT_VM_CORES:-2}"; VM_THREADS="${INPUT_VM_THREADS:-2}"; VM_RAM="${INPUT_VM_RAM_GB:-16}"
          VNC_BIND="${INPUT_VNC_BIND:-0.0.0.0}"; VM_CPUS=$((VM_CORES * VM_THREADS))

          qemu-system-x86_64 \
            -name drime-vm \
            -machine q35,accel=kvm \
            -cpu host \
            -smp "$VM_CPUS,cores=$VM_CORES,threads=$VM_THREADS" \
            -m "${VM_RAM}G" \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -blockdev node-name=drime0,driver=raw,file.driver=nbd,file.server.type=unix,file.server.path="$NBD_SOCK",file.reconnect-delay=5 \
            -device virtio-blk-pci,drive=drime0,bootindex=1 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -serial file:"$LOG/vm-serial.log" \
            -vnc "${VNC_BIND}:0" \
            -pidfile /run/drime-vm.pid \
            -daemonize || fail VM QEMU_START
          log VM "VM running vcpu=$VM_CPUS ram=${VM_RAM}G"

          BOOT_OK=0
          for i in $(seq 1 60); do
            if grep -q "login:" "$LOG/vm-serial.log" 2>/dev/null; then BOOT_OK=1; break; fi
            sleep 5
          done
          if [[ "$BOOT_OK" == 1 ]]; then log BOOT "OS BOOTED - login prompt on serial"; else log WARN BOOT "no login prompt yet - check VNC"; fi

          log ACCESS "=== CONNECT: VNC $NB_IP:5900 (NetBird IP) ==="

          while true; do
            [[ -f /run/drime-vm.pid ]] && kill -0 "$(cat /run/drime-vm.pid)" 2>/dev/null || fail VM DIED
            log HEARTBEAT "vm=running netbird=$NB_IP vnc=$NB_IP:5900"
            sleep 30
          done
