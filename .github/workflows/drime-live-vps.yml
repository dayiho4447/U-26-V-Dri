name: Drime Live VM (Custom Fast Storage)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 rclone curl qemu-utils qemu-system-x86 nbdkit nbdkit-plugin-python wget ca-certificates jq xvfb x11vnc net-tools ovmf

    - name: Install latest rclone
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Install NetBird
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key CE303734-75C3-44DC-8E35-B533A858A900
        sudo netbird status

    - name: Create Custom Fast Drime Storage Engine
      run: |
        cat > drime_fast.py <<'PYEOF'
        #!/usr/bin/env python3
        """
        CUSTOM DRIME LIVE STORAGE ENGINE (PATCHED & BULLETPROOF)
        - Disk stays entirely on Drime (no download)
        - Aggressive parallel read-ahead cache
        - Smart boot-sector prefetching
        - Instant plug-and-boot
        """
        import os, re, json, time, uuid, gzip, hashlib, threading, subprocess, shutil, sys
        from pathlib import Path
        from concurrent.futures import ThreadPoolExecutor
        from collections import OrderedDict
        import nbdkit

        API_VERSION = 2

        class DrimeFastStorage:
            def __init__(self, conf_path, accounts_path, cache="/var/lib/drimelive"):
                self.cache = Path(cache)
                self.chunks_dir = self.cache / "chunks"
                self.tmp_dir = self.cache / "tmp"
                self.cache.mkdir(parents=True, exist_ok=True)
                self.chunks_dir.mkdir(parents=True, exist_ok=True)
                self.tmp_dir.mkdir(parents=True, exist_ok=True)
                
                # Parse config safely
                self.chunk_size = self._parse_size(self._get_conf(conf_path, "chunk_size", "4M"))
                
                # Load accounts
                self.accounts = []
                total = 0
                if accounts_path and os.path.exists(accounts_path):
                    for line in open(accounts_path):
                        line = line.strip()
                        if not line or line.startswith("#"): continue
                        parts = line.split()
                        if len(parts) >= 2:
                            name, sz = parts[0], self._parse_size(parts[1])
                            start = total // self.chunk_size
                            total += sz
                            end = total // self.chunk_size
                            self.accounts.append({"name": name, "start": start, "end": end})
                
                self.size = total if total > 0 else 100 * 1024 * 1024 * 1024 # fallback 100G
                self.lock = threading.RLock()
                self.remote_ids = set()
                
                # SMART CACHE
                self.cache_data = OrderedDict()
                self.cache_lock = threading.Lock()
                self.MAX_CACHE_CHUNKS = 256  # 1GB cache
                
                # Prefetch tracking
                self.prefetch_queue = []
                self.prefetch_lock = threading.Lock()
                self.prefetch_thread = None
                
                # Parallel download pool
                self.executor = ThreadPoolExecutor(max_workers=8)
                
                print(f"[DRIME FAST] Storage engine initialized", flush=True)
                print(f"  Chunk size: {self.chunk_size // (1024*1024)}MB", flush=True)
                print(f"  Cache: {self.MAX_CACHE_CHUNKS} chunks (1GB)", flush=True)
                print(f"  Parallel workers: 8", flush=True)

            def _parse_size(self, v):
                if isinstance(v, int): return v
                if not v: return 4*1024*1024
                s = str(v).strip().upper()
                m = re.match(r'^([0-9]*\.?[0-9]+)([KMGTP]?I?B?)$', s)
                if not m: return 4*1024*1024
                num, unit = float(m.group(1)), m.group(2)
                mult = 1
                if unit.startswith("K"): mult = 1024
                elif unit.startswith("M"): mult = 1024**2
                elif unit.startswith("G"): mult = 1024**3
                return int(num * mult)

            def _get_conf(self, path, key, default):
                if not path or not os.path.exists(path): return default
                try:
                    for line in open(path):
                        line = line.split("#",1)[0].strip()
                        if "=" in line:
                            k, v = line.split("=", 1)
                            if k.strip() == key:
                                return v.strip()
                except Exception:
                    pass
                return default

            def load_manifest(self):
                """Load manifest in background, non-blocking"""
                if not self.accounts: return
                tmp = self.tmp_dir / f"manifest_{uuid.uuid4().hex}.gz"
                try:
                    cmd = ["rclone", "copyto", f"{self.accounts[0]['name']}:liveblock/manifest.json.gz", str(tmp), 
                           "--retries", "1", "--low-level-retries", "1"]
                    subprocess.run(cmd, capture_output=True, timeout=30)
                    with gzip.open(tmp, "rt") as f:
                        m = json.load(f)
                    for c in m.get("chunks", []):
                        self.remote_ids.add(int(c["id"]))
                    print(f"[DRIME FAST] Manifest loaded: {len(self.remote_ids)} chunks on Drime", flush=True)
                except Exception as e:
                    print(f"[DRIME FAST] Manifest load skipped: {e}", flush=True)
                finally:
                    try: tmp.unlink()
                    except: pass

            def _account_for(self, cid):
                for a in self.accounts:
                    if a["start"] <= cid < a["end"]:
                        return a["name"]
                return None

            def _chunk_len(self, cid):
                start = cid * self.chunk_size
                return min(self.chunk_size, self.size - start)

            def _download_chunk(self, cid):
                """Download single chunk with parallel worker"""
                p = self.chunks_dir / f"{cid:08d}.part"
                if p.exists():
                    return p.read_bytes()
                
                remote = self._account_for(cid)
                if not remote:
                    return b"\x00" * self._chunk_len(cid)
                
                tmp = self.tmp_dir / f"{cid:08d}_{uuid.uuid4().hex}.gz"
                try:
                    cmd = ["rclone", "copyto", f"{remote}:liveblock/chunks/{cid:08d}.gz", str(tmp),
                           "--retries", "2", "--low-level-retries", "2"]
                    result = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
                    
                    if result.returncode != 0:
                        err = result.stderr.lower()
                        if any(s in err for s in ["not found", "doesn't exist", "no such"]):
                            return b"\x00" * self._chunk_len(cid)
                        raise Exception(f"Download failed: {result.stderr}")
                    
                    with gzip.open(tmp, "rb") as f:
                        data = f.read()
                    
                    exp = self._chunk_len(cid)
                    if len(data) < exp:
                        data += b"\x00" * (exp - len(data))
                    
                    p.write_bytes(data)
                    return data
                    
                except Exception as e:
                    print(f"[DRIME FAST] Chunk {cid} download error: {e}", flush=True)
                    return b"\x00" * self._chunk_len(cid)
                finally:
                    try: tmp.unlink()
                    except: pass

            def _prefetch_worker(self):
                """Background prefetch worker"""
                while True:
                    with self.prefetch_lock:
                        if not self.prefetch_queue:
                            time.sleep(0.1)
                            continue
                        cid = self.prefetch_queue.pop(0)
                    
                    with self.cache_lock:
                        if cid in self.cache_data:
                            continue
                    
                    data = self._download_chunk(cid)
                    
                    with self.cache_lock:
                        self.cache_data[cid] = data
                        self.cache_data.move_to_end(cid)
                        while len(self.cache_data) > self.MAX_CACHE_CHUNKS:
                            self.cache_data.popitem(last=False)

            def start_prefetch(self):
                """Start background prefetch thread"""
                self.prefetch_thread = threading.Thread(target=self._prefetch_worker, daemon=True)
                self.prefetch_thread.start()
                
                with self.prefetch_lock:
                    for cid in range(64):
                        self.prefetch_queue.append(cid)
                
                print(f"[DRIME FAST] Prefetch started (64 chunks queued)", flush=True)

            def read_chunk(self, cid):
                """Fast chunk read with intelligent caching"""
                with self.cache_lock:
                    if cid in self.cache_data:
                        self.cache_data.move_to_end(cid)
                        return self.cache_data[cid]
                
                data = self._download_chunk(cid)
                
                with self.cache_lock:
                    self.cache_data[cid] = data
                    self.cache_data.move_to_end(cid)
                    while len(self.cache_data) > self.MAX_CACHE_CHUNKS:
                        self.cache_data.popitem(last=False)
                
                with self.prefetch_lock:
                    for ahead in range(1, 9):
                        next_cid = cid + ahead
                        if next_cid not in self.cache_data and next_cid not in self.prefetch_queue:
                            self.prefetch_queue.append(next_cid)
                
                return data

            def read(self, offset, length):
                out = bytearray(length)
                pos = 0
                while pos < length:
                    off = offset + pos
                    cid = off // self.chunk_size
                    coff = off % self.chunk_size
                    n = min(self.chunk_size - coff, length - pos)
                    chunk = self.read_chunk(cid)
                    out[pos:pos+n] = chunk[coff:coff+n]
                    pos += n
                return bytes(out)

            def write_chunk(self, cid, data, off):
                p = self.chunks_dir / f"{cid:08d}.part"
                if p.exists():
                    chunk = bytearray(p.read_bytes())
                else:
                    chunk = bytearray(self.read_chunk(cid))
                
                exp = self._chunk_len(cid)
                if len(chunk) < exp:
                    chunk.extend(b"\x00" * (exp - len(chunk)))
                
                chunk[off:off+len(data)] = data
                final = bytes(chunk)
                
                tmp = self.tmp_dir / f"{cid:08d}_{uuid.uuid4().hex}"
                tmp.write_bytes(final)
                os.replace(tmp, p)
                
                with self.cache_lock:
                    self.cache_data[cid] = final
                    self.cache_data.move_to_end(cid)
                    while len(self.cache_data) > self.MAX_CACHE_CHUNKS:
                        self.cache_data.popitem(last=False)

            def write(self, data, offset):
                pos = 0
                total = len(data)
                while pos < total:
                    off = offset + pos
                    cid = off // self.chunk_size
                    coff = off % self.chunk_size
                    n = min(self.chunk_size - coff, total - pos)
                    self.write_chunk(cid, data[pos:pos+n], coff)
                    pos += n

            def flush(self):
                dirty = []
                for p in self.chunks_dir.glob("*.part"):
                    cid = int(p.stem)
                    data = p.read_bytes()
                    sha = hashlib.sha256(data).hexdigest()
                    dirty.append((cid, data, sha))
                
                if not dirty: return
                
                print(f"[DRIME FAST] Flushing {len(dirty)} chunks to Drime...", flush=True)
                
                by_account = {}
                for cid, data, sha in dirty:
                    remote = self._account_for(cid)
                    if remote:
                        by_account.setdefault(remote, []).append((cid, data))
                
                for remote, chunks in by_account.items():
                    stage = self.tmp_dir / f"stage_{uuid.uuid4().hex}"
                    stage.mkdir(exist_ok=True)
                    for cid, data in chunks:
                        with gzip.open(stage / f"{cid:08d}.gz", "wb") as f:
                            f.write(data)
                    cmd = ["rclone", "copy", str(stage), f"{remote}:liveblock/chunks/",
                           "--transfers", "8", "--no-update-modtime"]
                    subprocess.run(cmd, capture_output=True)
                    shutil.rmtree(stage, ignore_errors=True)
                
                print(f"[DRIME FAST] Flush complete", flush=True)

        # NBD Plugin Interface
        CFG = {}
        STORE = None

        def thread_model():
            return nbdkit.THREAD_MODEL_PARALLEL

        def config(key, value):
            CFG[key] = value

        def config_complete():
            global STORE
            STORE = DrimeFastStorage(
                conf_path=CFG.get("conf", "drime-storage.conf"),
                accounts_path=CFG.get("accounts", "/run/drimelive/accounts.txt"),
                cache=CFG.get("cache", "/var/lib/drimelive")
            )
            STORE.load_manifest()
            STORE.start_prefetch()

        def open(readonly):
            return STORE

        def close(h):
            try: h.flush()
            except: pass

        def get_size(h):
            return h.size

        def can_write(h):
            return True

        def can_flush(h):
            return True

        def pread(h, buf, offset, flags):
            data = h.read(offset, len(buf))
            buf[:len(data)] = data
            return buf

        def pwrite(h, buf, offset, flags):
            h.write(bytes(buf), offset)
            return len(buf)

        def flush(h):
            h.flush()
        PYEOF

    - name: Create drimeblock
      run: |
        cat > drimeblock <<'SHEOF'
        #!/usr/bin/env bash
        set -Eeuo pipefail
        CONF="${DRIME_CONF:-drime-storage.conf}"
        ACCOUNTS="${DRIME_ACCOUNTS:-/run/drimelive/accounts.txt}"
        CACHE="${DRIME_CACHE:-/var/lib/drimelive}"
        RUNDIR="${DRIME_RUNDIR:-/run/drimelive}"
        SOCK="${DRIME_SOCK:-${RUNDIR}/nbd.sock}"

        case "${1:-}" in
          serve)
            mkdir -p "$CACHE" "$RUNDIR"
            exec env PYTHONPATH="$(pwd)" nbdkit --foreground --unix "$SOCK" python ./drime_fast.py conf="$CONF" accounts="$ACCOUNTS" cache="$CACHE"
            ;;
          sync)
            mkdir -p "$CACHE"
            env PYTHONPATH="$(pwd)" python3 -c 'import sys; sys.path.insert(0, "."); from drime_fast import DrimeFastStorage; s=DrimeFastStorage(conf_path="drime-storage.conf", accounts_path="/run/drimelive/accounts.txt"); s.flush()'
            ;;
          *) echo "usage: serve|sync"; exit 1;;
        esac
        SHEOF
        chmod +x drimeblock

    - name: Configure Drime accounts
      env:
        ALL_SECRETS: ${{ toJson(secrets) }}
      run: |
        sudo mkdir -p /run/drimelive
        sudo -E python3 - <<'PY'
        import os, json, re, subprocess
        secrets = json.loads(os.environ.get("ALL_SECRETS") or "{}")
        accounts = []
        for line in open("drime-storage.conf"):
            line = line.split("#",1)[0].strip()
            m = re.match(r'^(DRIME[0-9]*)\s+(\S+)', line)
            if m: accounts.append((m.group(1), m.group(2)))
        ok = 0
        with open("/run/drimelive/accounts.txt","w") as out:
            for name,size in accounts:
                key = secrets.get(name)
                if not key: continue
                subprocess.run(["rclone","config","delete",name], capture_output=True)
                c = subprocess.run(["rclone","config","create",name,"drime","access_token="+key], capture_output=True)
                m2 = subprocess.run(["rclone","mkdir",name+":liveblock"], capture_output=True)
                if c.returncode==0 and m2.returncode==0:
                    out.write("%s %s\n" % (name,size)); ok+=1
        if ok==0: raise SystemExit("ERROR: no Drime account.")
        PY

    - name: Check if disk ingested
      id: os
      run: |
        first=$(head -1 /run/drimelive/accounts.txt | awk '{print $1}')
        if sudo rclone lsf "$first:liveblock/" 2>/dev/null | grep -q '^installed.marker$'; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

    - name: Download + Convert + Ingest (first run only)
      if: steps.os.outputs.exists != 'true'
      run: |
        first=$(head -1 /run/drimelive/accounts.txt | awk '{print $1}')
        IMG=$(sudo rclone lsf "$first:liveblock/" 2>/dev/null | grep -iE '\.(vmdk|img|qcow2)$' | head -1 || true)
        [ -z "$IMG" ] && { echo "ERROR: no base image"; exit 1; }
        
        echo "Downloading $IMG..."
        sudo rclone copyto "$first:liveblock/$IMG" "/tmp/disk.vmdk" --progress
        
        echo "Converting to raw..."
        sudo qemu-img convert -f vmdk -O raw /tmp/disk.vmdk /tmp/disk.raw
        
        echo "Ingesting to Drime..."
        cat > /tmp/ingest.py <<'PY'
        import sys, os
        sys.path.insert(0, ".")
        from drime_fast import DrimeFastStorage
        
        s = DrimeFastStorage(
            conf_path="drime-storage.conf",
            accounts_path="/run/drimelive/accounts.txt"
        )
        s.load_manifest()
        
        chunk_size = s.chunk_size
        zero_chunk = b"\x00" * chunk_size
        
        print("Ingesting disk to Drime...", flush=True)
        with open("/tmp/disk.raw", "rb") as f:
            cid = 0
            while True:
                data = f.read(chunk_size)
                if not data: break
                if len(data) < chunk_size:
                    data += b"\x00" * (chunk_size - len(data))
                if data != zero_chunk:
                    s.write_chunk(cid, data, 0)
                cid += 1
                if cid % 100 == 0:
                    print(f"  chunk {cid}...", flush=True)
        
        s.flush()
        print("Ingest complete!", flush=True)
        PY
        
        sudo env PYTHONPATH="$PWD" python3 /tmp/ingest.py
        
        echo "installed $(date -Is)" | sudo rclone rcat "$first:liveblock/installed.marker"
        sudo rm -f /tmp/disk.vmdk /tmp/disk.raw

    - name: Start Drime Fast Storage Server
      run: |
        sudo rm -f /run/drimelive/nbd.sock
        sudo bash -c "cd \"$GITHUB_WORKSPACE\" && DRIME_CONF=drime-storage.conf DRIME_ACCOUNTS=/run/drimelive/accounts.txt nohup ./drimeblock serve > /var/log/drimelive.log 2>&1 &"
        
        for i in $(seq 1 60); do
          if [ -S /run/drimelive/nbd.sock ]; then
            echo "Drime Fast Storage ready!"
            sudo cat /var/log/drimelive.log || true
            exit 0
          fi
          sleep 1
        done
        
        echo "ERROR: Storage server failed"
        sudo cat /var/log/drimelive.log || true
        exit 1

    - name: Start VNC + Boot VM (Plug-and-Boot from Drime)
      run: |
        SOCK=/run/drimelive/nbd.sock
        
        # VNC setup
        sudo pkill -f Xvfb || true
        sudo pkill -f x11vnc || true
        sleep 2
        
        sudo Xvfb :1 -screen 0 1920x1080x24 &
        sleep 2
        sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg
        sleep 2
        
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        
        # KVM check
        if [ -e /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
          ACCEL="-enable-kvm"
          CPU="-cpu host"
        else
          ACCEL=""
          CPU="-cpu qemu64"
        fi
        
        # UEFI firmware
        CODE=$(ls /usr/share/OVMF/OVMF_CODE.fd /usr/share/OVMF/OVMF_CODE_4M.fd 2>/dev/null | head -1)
        VARS_SRC=$(ls /usr/share/OVMF/OVMF_VARS.fd /usr/share/OVMF/OVMF_VARS_4M.fd 2>/dev/null | head -1)
        sudo cp "$VARS_SRC" /tmp/OVMF_VARS.fd
        sudo chmod 666 /tmp/OVMF_VARS.fd
        
        export DISPLAY=:1
        
        echo "=== BOOTING FROM DRIME (Custom Fast Storage) ==="
        sudo -E DISPLAY=:1 qemu-system-x86_64 \
          $ACCEL \
          -machine q35 \
          $CPU \
          -smp 4,sockets=1,cores=2,threads=2 \
          -m 16384 \
          -drive if=pflash,format=raw,readonly=on,file=$CODE \
          -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
          -drive file=nbd:unix:${SOCK},if=none,id=disk0,format=raw,cache=writeback \
          -device nvme,drive=disk0,serial=DRIME0001 \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -display sdl > /tmp/vm.log 2>&1 &
        QPID=$!
        
        sleep 5
        echo "=========================================="
        echo "VM BOOTED DIRECTLY FROM DRIME"
        echo "VNC: $NB_IP:5900 (no password)"
        echo "=========================================="
        
        tail -f /dev/null
