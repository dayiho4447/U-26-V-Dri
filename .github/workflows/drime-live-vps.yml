name: DRIME-LIVE-VPS

on:
  workflow_dispatch:
    inputs:
      vm_ram_gb:
        description: "VM RAM in GB"
        default: "16"
      vnc_bind:
        description: "VNC bind address"
        default: "0.0.0.0"

concurrency:
  group: drime-live-vps
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LOG: /var/log/drime
      NBD_SOCK: /tmp/drime-nbd.sock
      PLUGIN: /opt/drime-nbd.py
      RCLONE_CFG: /root/.config/rclone/drime.conf
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      DRIME_TOKEN: ${{ secrets.DRIME }}
    steps:
      - name: Write NBD plugin
        shell: bash
        run: |
          sudo mkdir -p /opt
          sudo tee /opt/drime-nbd.py > /dev/null << 'PYEOF'
          import nbdkit
          import subprocess
          import threading
          import time
          from collections import OrderedDict

          CHUNK = 4 * 1024 * 1024
          DISK_SIZE = 20 * 1024 * 1024 * 1024
          REMOTE = "drime0"
          PREFIX = "vm-disk/chunk"
          CFG = "/root/.config/rclone/drime.conf"

          CACHE_SIZE = 512 # 2GB RAM Cache for lightning speed reads
          cache_lock = threading.Lock()
          chunk_cache = OrderedDict()

          stats_lock = threading.Lock()
          bytes_read = 0
          bytes_written = 0
          api_calls = 0
          start_time = time.time()

          def log_stats():
              while True:
                  time.sleep(3)
                  with stats_lock:
                      elapsed = time.time() - start_time
                      r_speed = (bytes_read / (1024*1024)) / elapsed if elapsed > 0 else 0
                      w_speed = (bytes_written / (1024*1024)) / elapsed if elapsed > 0 else 0
                      nbdkit.debug(f"[SPEED] Read: {r_speed:.1f} MB/s | Write: {w_speed:.1f} MB/s | API: {api_calls} | Cache: {len(chunk_cache)}")

          threading.Thread(target=log_stats, daemon=True).start()

          def open(readonly):
              return {}

          def get_size(h):
              return DISK_SIZE

          def fetch_chunk(ci):
              proc = subprocess.Popen(
                  ["rclone", "--config", CFG, "cat", f"{REMOTE}:{PREFIX}-{ci:08d}.bin"],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
              )
              data, _ = proc.communicate()
              with stats_lock:
                  global api_calls
                  api_calls += 1
              if proc.returncode != 0 or not data:
                  return bytearray(CHUNK)
              data = bytearray(data)
              if len(data) < CHUNK:
                  data.extend(b"\x00" * (CHUNK - len(data)))
              return data

          def save_chunk(ci, data):
              pw = subprocess.Popen(
                  ["rclone", "--config", CFG, "rcat", f"{REMOTE}:{PREFIX}-{ci:08d}.bin.tmp"],
                  stdin=subprocess.PIPE, stderr=subprocess.DEVNULL
              )
              pw.communicate(input=bytes(data))
              subprocess.run(["rclone", "--config", CFG, "copyto", f"{REMOTE}:{PREFIX}-{ci:08d}.bin.tmp", f"{REMOTE}:{PREFIX}-{ci:08d}.bin"], stderr=subprocess.DEVNULL)
              subprocess.run(["rclone", "--config", CFG, "delete", f"{REMOTE}:{PREFIX}-{ci:08d}.bin.tmp"], stderr=subprocess.DEVNULL)
              with stats_lock:
                  global api_calls
                  api_calls += 3

          def get_chunk_data(ci):
              with cache_lock:
                  if ci in chunk_cache:
                      chunk_cache.move_to_end(ci)
                      return chunk_cache[ci]
              
              data = fetch_chunk(ci)
              with cache_lock:
                  chunk_cache[ci] = data
                  chunk_cache.move_to_end(ci)
                  while len(chunk_cache) > CACHE_SIZE:
                      chunk_cache.popitem(last=False)
              return data

          def pread(h, count, offset, flags):
              global bytes_read
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              out = bytearray()
              for ci in range(sc, ec + 1):
                  data = get_chunk_data(ci)
                  s = max(0, offset - ci * CHUNK)
                  e = min(CHUNK, offset + count - ci * CHUNK)
                  out.extend(data[s:e])
              with stats_lock:
                  bytes_read += count
              return bytes(out[:count])

          def pwrite(h, buf, offset, flags):
              global bytes_written
              count = len(buf)
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              for ci in range(sc, ec + 1):
                  data = get_chunk_data(ci)
                  with cache_lock:
                      ws = max(0, offset - ci * CHUNK)
                      bs = max(0, ci * CHUNK - offset)
                      be = min(count, (ci + 1) * CHUNK - offset)
                      wl = be - bs
                      if wl > 0:
                          data[ws:ws + wl] = buf[bs:be]
                  save_chunk(ci, data)

              with stats_lock:
                  bytes_written += count

          def flush(h, flags):
              pass

          def trim(h, count, offset, flags):
              sc = offset // CHUNK
              ec = (offset + count - 1) // CHUNK
              for ci in range(sc, ec + 1):
                  with cache_lock:
                      if ci in chunk_cache:
                          del chunk_cache[ci]
                  subprocess.run(["rclone", "--config", CFG, "delete", f"{REMOTE}:{PREFIX}-{ci:08d}.bin"], stderr=subprocess.DEVNULL)

          def can_fua(h):
              return nbdkit.FUA_NATIVE
          PYEOF

      - name: Engine
        shell: bash
        run: |
          if [[ "$(id -u)" != "0" ]]; then
            exec sudo -E env PATH="$PATH" HOME="/root" bash "$0"
          fi
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          LOG="${LOG:-/var/log/drime}"
          NBD_SOCK="${NBD_SOCK:-/tmp/drime-nbd.sock}"
          PLUGIN="${PLUGIN:-/opt/drime-nbd.py}"
          RCLONE_CFG="${RCLONE_CFG:-/root/.config/rclone/drime.conf}"
          DRIME_TOKEN="${DRIME_TOKEN:-}"

          mkdir -p "$LOG" "$(dirname "$RCLONE_CFG")"
          exec > >(tee -a "$LOG/engine.log") 2>&1

          log(){ printf '[%s] [%s] %s\n' "$(date -u +%FT%TZ)" "$1" "$2"; }
          fail(){ log ERROR "FAILED [$1] $2"; exit 1; }
          trap 'log ERROR "TRAP line=$LINENO cmd=$BASH_COMMAND rc=$?"' ERR

          NBD_SUPERVISOR_PID=""
          cleanup() {
            log SHUTDOWN "Graceful shutdown"
            [[ -f /run/drime-vm.pid ]] && kill "$(cat /run/drime-vm.pid)" 2>/dev/null || true
            sleep 3
            [[ -n "$NBD_SUPERVISOR_PID" ]] && kill "$NBD_SUPERVISOR_PID" 2>/dev/null || true
            pkill -f "nbdkit python" 2>/dev/null || true
            rclone delete drime0:vm-disk/ --include "*.tmp" --config "$RCLONE_CFG" 2>/dev/null || true
            log SHUTDOWN "All data safe on Drime"
          }
          trap cleanup EXIT TERM INT

          log INIT "DRIME LIGHTNING SPEED ENGINE (32-Thread Parallel + 2GB RAM Cache)"

          apt-get update -y || fail PKG apt-update
          apt-get install -y \
            qemu-system-x86 qemu-utils \
            nbdkit nbdkit-plugin-python python3 \
            jq curl ca-certificates iproute2 kmod fuse3 socat \
            || fail PKG install

          curl --retry 5 -fsSL https://rclone.org/install.sh | bash || fail RCLONE install
          log RCLONE "$(rclone version | head -1)"

          modprobe kvm 2>/dev/null || true
          modprobe nbd 2>/dev/null || true
          [[ -e /dev/kvm ]] || fail KVM no-device
          chmod 666 /dev/kvm
          log KVM "ready"

          [[ -n "$NETBIRD_SETUP_KEY" ]] || fail NETBIRD no-key
          curl --retry 5 -fsSL https://pkgs.netbird.io/install.sh | sh || fail NETBIRD install
          for i in 1 2 3; do
            netbird up --setup-key "$NETBIRD_SETUP_KEY" --log-file "$LOG/netbird.log" && break
            sleep 5
          done
          NB_IP=$(hostname -I | awk '{print $1}')
          for ifc in wt0 netbird0 nb0; do
            if ip addr show "$ifc" 2>/dev/null | grep -q inet; then
              NB_IP=$(ip -4 -o addr show "$ifc" | awk '{print $4}' | cut -d/ -f1)
              break
            fi
          done
          log NETBIRD "ip=$NB_IP"

          [[ -n "$DRIME_TOKEN" ]] || fail DRIME no-token
          export RCLONE_CONFIG="$RCLONE_CFG"
          rclone config create drime0 drime access_token="$DRIME_TOKEN" --config "$RCLONE_CFG" >/dev/null
          log DRIME "configured"

          set +o pipefail
          ORPHANS=$(rclone lsf drime0:vm-disk/ --include "*.tmp" --config "$RCLONE_CFG" 2>/dev/null | wc -l | tr -d '[:space:]')
          set -o pipefail
          ORPHANS=${ORPHANS:-0}
          
          if [[ "$ORPHANS" =~ ^[0-9]+$ ]] && [[ "$ORPHANS" -gt 0 ]]; then
            log RECOVERY "Cleaning $ORPHANS orphaned temps"
            rclone delete drime0:vm-disk/ --include "*.tmp" --config "$RCLONE_CFG" || true
          fi
          log RECOVERY "clean state"

          IMG_URL="https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img"
          if [[ ! -f /tmp/resolute.raw ]]; then
            log IMAGE "Downloading Ubuntu 26.04 LTS"
            curl -fL --retry 5 "$IMG_URL" -o /tmp/resolute.qcow2 || fail IMAGE download
            qemu-img convert -f qcow2 -O raw /tmp/resolute.qcow2 /tmp/resolute.raw || fail IMAGE convert
            rm -f /tmp/resolute.qcow2
            log IMAGE "ready: $(du -h /tmp/resolute.raw | cut -f1)"
          fi

          # LIGHTNING SPEED UPLOAD: 32 parallel connections
          CHUNK_SIZE=$((4*1024*1024))
          log DRIME "Splitting image and uploading with 32 parallel transfers..."
          mkdir -p /tmp/vm-disk
          split -b ${CHUNK_SIZE} -d -a 8 /tmp/resolute.raw /tmp/vm-disk/chunk-
          for f in /tmp/vm-disk/chunk-*; do mv "$f" "${f}.bin"; done
          
          rclone copy /tmp/vm-disk/ drime0:vm-disk/ --config "$RCLONE_CFG" \
            --transfers 32 --checkers 16 --progress --stats 1s || fail DRIME parallel-upload
            
          rm -rf /tmp/vm-disk /tmp/resolute.raw
          log DRIME "Parallel upload complete! 1000 Mbps link saturated."

          rm -f "$NBD_SOCK"
          (
            while true; do
              nbdkit python "$PLUGIN" --unix "$NBD_SOCK" --threads 16 --foreground 2>>"$LOG/nbdkit.log"
              log WARN "nbdkit crashed, restarting in 2s"
              sleep 2
            done
          ) &
          NBD_SUPERVISOR_PID=$!

          for i in $(seq 1 30); do
            [[ -S "$NBD_SOCK" ]] && break
            sleep 1
          done
          [[ -S "$NBD_SOCK" ]] || fail NBD "socket not created"
          log NBD "nbdkit running threads=16 cache=2GB"

          VM_RAM="${{ github.event.inputs.vm_ram_gb || '16' }}"
          VNC_BIND="${{ github.event.inputs.vnc_bind || '0.0.0.0' }}"

          qemu-system-x86_64 \
            -name drime-vm \
            -machine q35,accel=kvm \
            -cpu host \
            -smp 4,cores=2,threads=2 \
            -m "${VM_RAM}G" \
            -blockdev node-name=drime0,driver=raw,file.driver=nbd,file.socket.type=unix,file.socket.path=$NBD_SOCK,file.reconnect-delay=5 \
            -device virtio-blk-pci,drive=drime0 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -vnc "${VNC_BIND}:0" \
            -pidfile /run/drime-vm.pid \
            -daemonize || fail VM qemu-start

          sleep 5
          ss -ltn | grep -q ':5900' || fail VM vnc-not-listening

          log VM "RUNNING ram=${VM_RAM}G vnc=${VNC_BIND}:5900 netbird=$NB_IP"
          log ACCESS "VNC -> $NB_IP:5900"

          while true; do
            kill -0 "$(cat /run/drime-vm.pid)" 2>/dev/null || fail VM died
            kill -0 "$NBD_SUPERVISOR_PID" 2>/dev/null || fail NBD supervisor-died
            
            set +o pipefail
            DRIME_USED=$(rclone size drime0:vm-disk/ --config "$RCLONE_CFG" 2>/dev/null | head -1 || echo "unknown")
            set -o pipefail
            DRIME_USED=${DRIME_USED:-unknown}
            
            log HEARTBEAT "vm=running drime=$DRIME_USED"
            sleep 30
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drime-logs-${{ github.run_id }}
          path: /var/log/drime
          if-no-files-found: warn
