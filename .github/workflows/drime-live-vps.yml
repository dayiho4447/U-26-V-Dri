name: Drime Direct VMDK Boot (No Chunks)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: drime-live-vm
  cancel-in-progress: false

jobs:
  drime-live-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 curl qemu-utils qemu-system-x86 wget ca-certificates jq xvfb x11vnc net-tools fuse3
        sudo modprobe fuse || echo "fuse module not available"
        sudo sysctl -w fs.fuse.max_user_background=1024 || true

    - name: Install latest rclone
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        rclone version

    - name: Install NetBird
      run: |
        curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main" | sudo tee /etc/apt/sources.list.d/netbird.list
        sudo apt-get update -y
        sudo apt-get install -y netbird
        sudo netbird up --setup-key CE303734-75C3-44DC-8E35-B533A858A900
        sudo netbird status

    - name: Configure Drime remote
      env:
        DRIME: ${{ secrets.DRIME }}
        DRIME1: ${{ secrets.DRIME1 }}
        DRIME2: ${{ secrets.DRIME2 }}
        DRIME3: ${{ secrets.DRIME3 }}
        DRIME4: ${{ secrets.DRIME4 }}
        DRIME5: ${{ secrets.DRIME5 }}
        DRIME6: ${{ secrets.DRIME6 }}
        DRIME7: ${{ secrets.DRIME7 }}
        DRIME8: ${{ secrets.DRIME8 }}
        DRIME9: ${{ secrets.DRIME9 }}
      run: |
        python3 - <<'PY'
        import os, re, subprocess
        for line in open("drime-storage.conf"):
            line = line.split("#",1)[0].strip()
            m = re.match(r'^(DRIME[0-9]*)\s+(\S+)', line)
            if not m: continue
            name = m.group(1)
            key = os.environ.get(name)
            if not key: continue
            subprocess.run(["rclone","config","delete",name], capture_output=True)
            c = subprocess.run(["rclone","config","create",name,"drime","access_token="+key], capture_output=True)
            if c.returncode==0:
                print("REMOTE="+name)
                open("/tmp/drime_remote","w").write(name)
                break
        PY
        echo "Using remote: $(cat /tmp/drime_remote)"

    - name: Test rclone connectivity
      run: |
        REMOTE=$(cat /tmp/drime_remote)
        echo "=== Testing rclone ls ==="
        rclone ls "${REMOTE}:liveblock/" || {
          echo "rclone ls failed"
          echo "=== Trying rclone config ==="
          rclone config show "$REMOTE"
          exit 1
        }

    - name: Mount Drime DIRECT (no download, no chunks)
      run: |
        REMOTE=$(cat /tmp/drime_remote)
        sudo mkdir -p /mnt/drime
        sudo chmod 777 /mnt/drime
        
        # Try to mount and capture errors
        echo "Starting rclone mount..."
        sudo rclone mount "${REMOTE}:liveblock" /mnt/drime \
          --vfs-cache-mode full \
          --vfs-cache-max-size 12G \
          --vfs-read-chunk-size 2M \
          --vfs-read-chunk-size-limit 8M \
          --vfs-read-ahead 32M \
          --buffer-size 256M \
          --transfers 8 \
          --checkers 8 \
          --allow-other \
          --uid 0 \
          --gid 0 \
          --daemon \
          --log-file /tmp/rclone-mount.log \
          -v || {
            echo "Mount command failed"
            cat /tmp/rclone-mount.log
            exit 1
          }
        
        echo "Waiting for mount..."
        sleep 5
        
        # Check if mount succeeded
        if mountpoint -q /mnt/drime; then
          echo "Mount successful!"
        else
          echo "Mount failed - not a mountpoint"
          cat /tmp/rclone-mount.log
          exit 1
        fi
        
        # List contents
        echo "Contents of /mnt/drime:"
        ls -lah /mnt/drime/ || {
          echo "Cannot list mount contents"
          cat /tmp/rclone-mount.log
          exit 1
        }
        
        # Find disk image
        IMG=$(ls /mnt/drime 2>/dev/null | grep -iE '\.(vmdk|img|qcow2)$' | head -1 || true)
        if [ -z "$IMG" ]; then
          echo "ERROR: no vmdk/img/qcow2 file found"
          echo "Available files:"
          ls -la /mnt/drime/ || true
          exit 1
        fi
        
        echo "IMG=$IMG" >> "$GITHUB_ENV"
        echo "SUCCESS: Mounted /mnt/drime/$IMG"

    - name: Start VNC
      run: |
        sudo pkill -f Xvfb || true
        sudo pkill -f x11vnc || true
        sleep 2
        sudo Xvfb :1 -screen 0 1920x1080x24 &
        sleep 2
        sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg
        sleep 2
        echo "VNC ready on 5900"

    - name: Boot VM DIRECT from vmdk (KVM, no chunks)
      run: |
        NB_IP=$(sudo netbird status | grep 'NetBird IP:' | awk '{print $3}' | cut -d'/' -f1)
        if [ -e /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
          ACCEL="-enable-kvm"; CPU="-cpu host"
        else
          ACCEL=""; CPU="-cpu qemu64"
        fi
        export DISPLAY=:1
        : > /tmp/vm-serial.log

        echo "=== BOOTING DIRECT: /mnt/drime/$IMG ==="
        sudo -E DISPLAY=:1 qemu-system-x86_64 \
          $ACCEL \
          -machine pc \
          $CPU \
          -smp 4,sockets=1,cores=2,threads=2 \
          -m 16384 \
          -drive file=/mnt/drime/$IMG,format=vmdk,if=none,id=d0,cache=writeback \
          -device ide-hd,drive=d0 \
          -boot order=c \
          -vga std \
          -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
          -serial file:/tmp/vm-serial.log \
          -display sdl > /tmp/vm.log 2>&1 &
        QPID=$!

        sleep 5
        echo "=========================================="
        echo "DIRECT VMDK BOOT (no chunks, no download)"
        echo "VNC: $NB_IP:5900 (no password)"
        echo "=========================================="

        (
          while kill -0 $QPID 2>/dev/null; do
            sleep 30
            echo "--- guest serial console ---"
            sudo tail -n 10 /tmp/vm-serial.log 2>/dev/null || true
            if ! sudo ss -tlnp | grep -q ':5900'; then
              sudo pkill -f x11vnc || true
              sudo x11vnc -display :1 -forever -nopw -rfbport 5900 -shared -bg -o /tmp/x11vnc.log
            fi
          done
        ) &

        tail -f /dev/null
